<body>
<div class="w">
  <div class="hd"><span class="seal">学</span>
  <h1>Academy</h1>
  <p class="sub">Освітня платформа YYOKAI для майстрів, які тільки починають.</p></div>

  <section class="card" id="auth">
    <div class="tabs"><button id="tl" class="on" onclick="mode('login')">Вхід</button><button id="tr" onclick="mode('register')">Реєстрація</button></div>
    <div id="rn" style="display:none"><label for="name">Імʼя та прізвище</label><input id="name" autocomplete="name"></div>
    <label for="em">Email</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Пароль</label><input id="pw" type="password" autocomplete="current-password" placeholder="Мінімум 6 символів">
    <button class="btn s" id="go" onclick="submit()">Увійти</button>
    <p class="msg" id="msg"></p>
  </section>

  <section id="app" style="display:none">
    <div class="card pf"><div><h2 id="pn"></h2><p id="pe"></p></div><button class="btn" style="margin:0" onclick="out()">Вийти</button></div>
    <div class="card wait" id="wait" style="display:none"><span class="seal">待</span><div><b>Профіль створено</b><p>Майстер перевірить заявку та відкриє доступ до уроків. Ми повідомимо, коли це станеться, а поки можна зайти пізніше.</p></div></div>
    <div id="cour"></div>
    <div class="card view" id="view" style="display:none"></div>
  </section>
</div>

<script>
const SB_URL="https://jtilygljejobpljcfqrd.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWx5Z2xqZWpvYnBsamNmcXJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MjAwNTEsImV4cCI6MjExMTE5NjA1MX0.crPkRj0M5DV8kFbCU6i07P5uK71Oe54IuXfbI57bHeQ";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
let M="login",user=null,courses=[],lessons=[],done=new Set();

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function say(t,ok){const m=$("msg");m.textContent=t;m.className="msg"+(ok?" ok":"")}
function mode(m){
  M=m;$("tl").classList.toggle("on",m==="login");$("tr").classList.toggle("on",m==="register");
  $("rn").style.display=m==="register"?"block":"none";
  $("go").textContent=m==="register"?"Створити профіль":"Увійти";
  $("pw").autocomplete=m==="register"?"new-password":"current-password";say("");
}
if(location.hash==="#register")mode("register");

async function submit(){
  const email=$("em").value.trim(),password=$("pw").value,name=$("name").value.trim();
  if(!email||password.length<6)return say("Введи email і пароль (мінімум 6 символів).");
  $("go").disabled=true;
  if(M==="register"){
    if(name.length<2){$("go").disabled=false;return say("Вкажи імʼя та прізвище.")}
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.origin+location.pathname}});
    $("go").disabled=false;
    if(error)return say(error.message.includes("registered")?"Цей email уже зареєстровано. Увійди.":"Не вдалося створити профіль: "+error.message);
    if(!data.session)return say("Перевір пошту: ми надіслали лист для підтвердження email.",true);
  }else{
    const {error}=await sb.auth.signInWithPassword({email,password});
    $("go").disabled=false;
    if(error)return say(error.message.includes("confirm")?"Підтверди email за листом, який ми надіслали.":"Невірний email або пароль.");
  }
  boot();
}
async function out(){await sb.auth.signOut();location.reload()}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("auth").style.display="block";$("app").style.display="none";return}
  user=session.user;$("auth").style.display="none";$("app").style.display="block";
  const {data:p}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  $("pn").textContent=(p&&p.full_name)||user.email;$("pe").textContent=user.email;
  if(!p||!p.approved){$("wait").style.display="flex";$("cour").innerHTML="";return}
  $("wait").style.display="none";load();
}
async function load(){
  const r=await Promise.all([sb.from("courses").select("*").order("position"),sb.from("lessons").select("*").order("position"),sb.from("progress").select("lesson_id")]);
  const er=r.find(x=>x.error);if(er){$("cour").innerHTML=`<p class="msg">Не вдалося завантажити уроки: ${esc(er.error.message)}</p>`;return}
  courses=r[0].data;lessons=r[1].data;done=new Set(r[2].data.map(x=>x.lesson_id));render();
}
function render(){
  $("cour").innerHTML=courses.length?courses.map(c=>{
    const ls=lessons.filter(l=>l.course_id===c.id),n=ls.filter(l=>done.has(l.id)).length;
    return `<div class="course"><h2>${esc(c.title)}</h2><p class="sub">${esc(c.description||"")}</p>
      <div class="bar"><i style="width:${ls.length?Math.round(n/ls.length*100):0}%"></i></div><p class="sub" style="font-size:13px;margin-bottom:6px">Пройдено ${n} з ${ls.length}</p>
      ${ls.map(l=>`<button class="les ${done.has(l.id)?"d":""}" onclick="openL('${l.id}')"><span>${done.has(l.id)?"✓":""}</span>${esc(l.title)}</button>`).join("")}</div>`;
  }).join(""):`<div class="card"><p class="sub">Уроки з’являться тут найближчим часом.</p></div>`;
}
function emb(u){
  const m=String(u).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  return m?`<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe>`:`<video src="${esc(u)}" controls playsinline></video>`;
}
function openL(id){
  const l=lessons.find(x=>x.id===id);if(!l)return;
  const d=done.has(id),v=$("view");
  v.innerHTML=`<h2>${esc(l.title)}</h2>${l.video_url?`<div class="vid">${emb(l.video_url)}</div>`:""}<div class="txt">${esc(l.body||"")}</div>
    <div class="row"><button class="btn ${d?"":"s"}" onclick="mark('${id}')">${d?"Пройдено ✓ (зняти відмітку)":"Позначити пройденим"}</button><button class="btn" onclick="$('view').style.display='none'">Закрити</button></div>`;
  v.style.display="block";v.scrollIntoView({behavior:"smooth"});
}
async function mark(id){
  const r=done.has(id)?await sb.from("progress").delete().eq("lesson_id",id).eq("user_id",user.id):await sb.from("progress").insert({user_id:user.id,lesson_id:id});
  if(r.error)return alert("Не вдалося зберегти: "+r.error.message);
  done.has(id)?done.delete(id):done.add(id);render();openL(id);
}
boot();
</script>

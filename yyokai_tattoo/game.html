<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Клікер & Авторизація</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
            position: relative;
        }
        /* Шапка з лого та мовним перемикачем */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo-container img {
            max-height: 50px;
            width: auto;
            display: block;
        }
        .lang-switcher button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
            transition: 0.2s;
        }
        .lang-switcher button:hover {
            background: var(--accent);
            color: var(--bg-color);
        }
        /* Екрани (Auth vs Game) */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        h2 {
            text-align: center;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button.primary-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button.primary-btn:hover {
            background: var(--accent-hover);
        }
        .social-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            background: #fff;
            color: #000;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .switch-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        .switch-text span {
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }
        .error-msg {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }
        /* Стилі гри-клікера */
        .clicker-box {
            text-align: center;
            padding: 20px 0;
        }
        .counter {
            font-size: 48px;
            font-weight: bold;
            color: var(--accent);
            margin: 20px 0;
        }
        .click-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0369a1);
            color: #fff;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s;
        }
        .click-btn:active {
            transform: scale(0.95);
        }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Шапка сайту -->
    <div class="header">
        <!-- Твоє лого замість маски (заміни шлях на свій логотип) -->
        <div class="logo-container">
            <img src="your-logo.png" alt="Logo" id="siteLogo">
        </div>
        <!-- Перемикач мови -->
        <div class="lang-switcher">
            <button onclick="setLanguage('uk')">UA</button>
            <button onclick="setLanguage('en')">EN</button>
        </div>
    </div>

    <!-- ЕКРАН АВТОРИЗАЦІЇ / РЕЄСТРАЦІЇ -->
    <div id="authScreen" class="screen active">
        <h2 id="authTitle">Вхід в акаунт</h2>
        
        <div class="form-group">
            <label data-i18n="emailLabel">Електронна пошта</label>
            <input type="email" id="emailInput" placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label data-i18n="passLabel">Пароль</label>
            <input type="password" id="passwordInput" placeholder="********">
        </div>

        <button class="primary-btn" id="authSubmitBtn" onclick="handleEmailAuth()">Увійти</button>
        
        <button class="social-btn" onclick="loginWithGoogle()">
            🌐 <span data-i18n="googleBtn">Увійти через Google</span>
        </button>
        <button class="social-btn" onclick="loginWithApple()">
            🍏 <span data-i18n="appleBtn">Увійти через Apple</span>
        </button>

        <div class="error-msg" id="errorMsg"></div>

        <div class="switch-text" id="switchText">
            Немає акаунта? <span onclick="toggleAuthMode()">Зареєструватися</span>
        </div>
    </div>

    <!-- ЕКРАН ГРИ (КЛІКЕР) -->
    <div id="gameScreen" class="screen">
        <h2 data-i18n="gameHeader">Гра-Клікер</h2>
        <p style="text-align: center; color: #94a3b8;" id="userEmailDisplay"></p>
        
        <div class="clicker-box">
            <div class="counter" id="scoreDisplay">0</div>
            <button class="clicker-btn click-btn" onclick="incrementScore()" data-i18n="clickBtn">Клік!</button>
        </div>

        <button class="logout-btn" onclick="logout()" data-i18n="logoutBtn">Вийти з акаунта</button>
    </div>
</div>

<!-- Firebase SDK (Modular) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        sendEmailVerification, 
        signInWithPopup, 
        GoogleAuthProvider, 
        OAuthProvider, 
        onAuthStateChanged, 
        signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
        getFirestore, 
        doc, 
        setDoc, 
        getDoc, 
        updateField, 
        increment 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ ВСТУПИ СВОЇ ДАНІ FIREBASE ТУТ:
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isRegisterMode = false;
    let currentScore = 0;
    let currentUser = null;

    // Словник перемикача мов
    const translations = {
        uk: {
            title: "Клікер & Авторизація",
            emailLabel: "Електронна пошта",
            passLabel: "Пароль",
            googleBtn: "Увійти через Google",
            appleBtn: "Увійти через Apple",
            gameHeader: "Гра-Клікер",
            clickBtn: "Клік!",
            logoutBtn: "Вийти з акаунта",
            loginHeader: "Вхід в акаунт",
            registerHeader: "Реєстрація акаунта",
            loginBtn: "Увійти",
            registerBtn: "Зареєструватися",
            switchLogin: "Немає акаунта? Зареєструватися",
            switchRegister: "Вже є акаунт? Увійти",
            verifyNotice: "Будь ласка, перевірте пошту та підтвердьте акаунт за посиланням у листі!"
        },
        en: {
            title: "Clicker & Auth",
            emailLabel: "Email address",
            passLabel: "Password",
            googleBtn: "Sign in with Google",
            appleBtn: "Sign in with Apple",
            gameHeader: "Clicker Game",
            clickBtn: "Click!",
            logoutBtn: "Log out",
            loginHeader: "Sign In",
            registerHeader: "Create Account",
            loginBtn: "Sign In",
            registerBtn: "Register",
            switchLogin: "No account? Register",
            switchRegister: "Already have an account? Sign In",
            verifyNotice: "Please check your inbox and verify your email address!"
        }
    };

    let currentLang = localStorage.getItem('site_lang') || 'uk';

    window.setLanguage = function(lang) {
        currentLang = lang;
        localStorage.setItem('site_lang', lang);
        updateTexts();
    }

    function updateTexts() {
        const t = translations[currentLang];
        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (t[key]) el.innerText = t[key];
        });
        document.getElementById("authTitle").innerText = isRegisterMode ? t.registerHeader : t.loginHeader;
        document.getElementById("authSubmitBtn").innerText = isRegisterMode ? t.registerBtn : t.loginBtn;
        document.getElementById("switchText").innerHTML = isRegisterMode 
            ? `${t.switchRegister.split('?')[0]}? <span onclick="toggleAuthMode()">${t.switchRegister.split('?')[1]}</span>`
            : `${t.switchLogin.split('?')[0]}? <span onclick="toggleAuthMode()">${t.switchLogin.split('?')[1]}</span>`;
    }

    window.toggleAuthMode = function() {
        isRegisterMode = !isRegisterMode;
        updateTexts();
    }

    // Перевірка стану акаунта (чи збережений у браузері/Firebase)
    onAuthStateChanged(auth, async (user) => {
        const errorEl = document.getElementById("errorMsg");
        errorEl.innerText = "";
        
        if (user) {
            // Якщо потрібна обов'язкова перевірка пошти (крім соцмереж)
            if (!user.emailVerified && user.providerData.some(p => p.providerId === 'password')) {
                errorEl.innerText = translations[currentLang].verifyNotice;
                return;
            }

            currentUser = user;
            document.getElementById("userEmailDisplay").innerText = user.email || user.displayName;
            
            // Завантажуємо дані клікера з бази
            await loadUserData(user.uid);

            // Перемикаємо екран на гру
            document.getElementById("authScreen").classList.remove("active");
            document.getElementById("gameScreen").classList.add("active");
        } else {
            currentUser = null;
            document.getElementById("gameScreen").classList.remove("active");
            document.getElementById("authScreen").classList.add("active");
        }
    });

    // Email Авторизація / Реєстрація
    window.handleEmailAuth = async function() {
        const email = document.getElementById("emailInput").value;
        const password = document.getElementById("passwordInput").value;
        const errorEl = document.getElementById("errorMsg");
        errorEl.innerText = "";

        try {
            if (isRegisterMode) {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                await sendEmailVerification(userCred.user);
                alert(translations[currentLang].verifyNotice);
                signOut(auth);
            } else {
                await signInWithEmailAndPassword(auth, email, password);
            }
        } catch (error) {
            errorEl.innerText = error.message;
        }
    }

    // Вхід через Google
    window.loginWithGoogle = async function() {
        const provider = new GoogleAuthProvider();
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            document.getElementById("errorMsg").innerText = error.message;
        }
    }

    // Вхід через Apple
    window.loginWithApple = async function() {
        const provider = new OAuthProvider('apple.com');
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            document.getElementById("errorMsg").innerText = error.message;
        }
    }

    // Вихід
    window.logout = function() {
        signOut(auth);
    }

    // Робота з базою даних (Збереження та завантаження клікера)
    async function loadUserData(uid) {
        const docRef = doc(db, "clickers", uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            currentScore = docSnap.data().score || 0;
        } else {
            currentScore = 0;
            await setDoc(docRef, { score: 0 });
        }
        document.getElementById("scoreDisplay").innerText = currentScore;
    }

    window.incrementScore = async function() {
        if (!currentUser) return;
        currentScore++;
        document.getElementById("scoreDisplay").innerText = currentScore;
        
        // Зберігаємо в базі
        const docRef = doc(db, "clickers", currentUser.uid);
        await setDoc(docRef, { score: currentScore }, { merge: true });
    }

    // Ініціалізація мови при завантаженні
    updateTexts();
</script>

</body>
</html>

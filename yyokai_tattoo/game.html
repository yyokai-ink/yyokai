<!DOCTYPE html>
<html lang="uk" class="dark"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>INK — Yokai Seal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{inkDark:'#0a090d',inkCard:'#131118',inkBorder:'#272235',crimsonRed:'#ff2a5f',neonGold:'#ffb703',deepPurple:'#3b0764',cyberBlue:'#00f0ff'}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style type="text/tailwindcss">
.card{@apply bg-inkCard border border-inkBorder rounded-2xl p-4}
.btn{@apply px-4 py-2 rounded-xl text-xs font-bold bg-crimsonRed text-white active:scale-95 transition disabled:opacity-40}
.btng{@apply px-4 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-neonGold to-crimsonRed active:scale-95 transition disabled:opacity-40}
.inp{@apply w-full bg-inkDark border border-inkBorder rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-crimsonRed}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 15px rgba(255,42,95,.4);transform:scale(1)}50%{box-shadow:0 0 35px rgba(255,183,3,.7);transform:scale(1.02)}}
@keyframes fall{to{transform:translateY(560px) rotate(360deg);opacity:.2}}
@keyframes flick{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.25)}}
@keyframes flash{to{background:rgba(255,183,3,.5)}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.kitsune-glow{animation:pulse-glow 3s infinite}
canvas{touch-action:none}
.sym{height:58px;display:flex;align-items:center;justify-content:center;font-size:34px;filter:drop-shadow(0 0 6px rgba(255,183,3,.5))}
.blur{filter:blur(2px)}.winc{animation:flash .35s infinite alternate;border-radius:10px}.shake{animation:shake .5s}
.dun{background:radial-gradient(ellipse at top,#4c1d95 0,#12091f 55%,#07050b 100%);border:3px solid;border-image:linear-gradient(135deg,#ffb703,#7c2d12,#ffb703) 1;box-shadow:inset 0 0 40px rgba(255,183,3,.25),0 0 30px rgba(124,58,237,.3)}
</style></head>
<body class="bg-inkDark text-white font-sans antialiased min-h-screen flex flex-col select-none">

<header class="sticky top-0 z-50 bg-inkDark/85 backdrop-blur-md border-b border-inkBorder px-4 py-3 flex items-center justify-between">
 <div class="flex items-center space-x-3">
  <div id="headerLogoIcon" class="w-9 h-9 rounded-xl overflow-hidden bg-gradient-to-br from-crimsonRed to-neonGold flex items-center justify-center text-lg cursor-pointer" onclick="router.navigate('game')">⛩️</div>
  <div><span class="font-black text-lg tracking-widest bg-gradient-to-r from-white via-gray-200 to-crimsonRed bg-clip-text text-transparent">INK</span><span id="headerLocationTitle" class="text-[10px] block text-neonGold tracking-widest font-semibold uppercase"></span></div>
 </div>
 <div class="flex items-center space-x-2">
  <div id="userBalanceBadge" class="hidden items-center bg-inkCard border border-inkBorder px-3 py-1 rounded-full text-xs font-bold space-x-1.5"><span class="text-neonGold">文</span><span id="headerInkCount" class="font-mono">0</span><span>🔮</span><span id="headerGems" class="font-mono">0</span></div>
  <button onclick="toggleLanguage()" id="langSwitcherBtn" class="px-2.5 py-1 rounded-lg bg-inkCard border border-inkBorder text-xs font-bold text-gray-300"></button>
 </div>
</header>

<main class="flex-1 flex flex-col pb-24">
<section id="view-landing" class="view-section flex-1 flex flex-col items-center justify-center p-6 text-center">
 <div class="max-w-md mx-auto space-y-6">
  <div class="inline-block w-24 h-24 rounded-3xl overflow-hidden bg-gradient-to-tr from-crimsonRed/20 to-neonGold/20 border border-inkBorder kitsune-glow text-5xl flex items-center justify-center" id="landingAvatarIcon">🦊</div>
  <h1 class="text-4xl font-black uppercase">Seal. Earn. <span class="bg-gradient-to-r from-crimsonRed to-neonGold bg-clip-text text-transparent">Unlock.</span></h1>
  <p class="text-gray-400 text-sm" data-t="Печатай ёкаїв пензлем, збирай монети епох Японії, грай у підземеллі храму — і виграй справжнє тату.|Seal yokai with your brush, earn coins of Japan's eras, play the temple dungeon — and win a real tattoo."></p>
  <div class="flex flex-col sm:flex-row gap-3">
   <button onclick="router.navigate('game')" class="btn flex-1 py-3.5 text-sm" data-t="Грати зараз|Play now"></button>
   <button onclick="authMode('reg');router.navigate('auth')" class="flex-1 py-3.5 rounded-xl bg-inkCard border border-inkBorder font-bold text-sm" data-t="Реєстрація / Вхід|Register / Login"></button>
  </div>
 </div>
</section>

<section id="view-auth" class="view-section hidden flex-1 flex flex-col items-center justify-center p-4">
 <div class="w-full max-w-sm card rounded-3xl p-6 space-y-4">
  <div id="refBanner" class="hidden text-xs text-center bg-neonGold/10 border border-neonGold/30 text-neonGold rounded-xl py-2" data-t="🎁 Тебе запросив друг — +5 🔮 після реєстрації|🎁 A friend invited you — +5 🔮 after sign-up"></div>
  <div id="dots" class="flex justify-center gap-2"><i id="dot1" class="h-1.5 w-10 rounded-full bg-crimsonRed"></i><i id="dot2" class="h-1.5 w-10 rounded-full bg-inkBorder"></i></div>
  <div id="as1" class="space-y-4">
   <h2 class="text-2xl font-black text-center uppercase" data-t="Обери ёкая|Choose your yokai"></h2>
   <div id="authAvatars" class="grid grid-cols-4 gap-2"></div>
   <div class="flex gap-2"><input id="authNick" maxlength="16" data-p="Нікнейм|Nickname" class="inp flex-1"><button type="button" onclick="rndNick()" class="px-4 rounded-xl bg-inkDark border border-inkBorder">🎲</button></div>
   <button onclick="authStep(2)" class="btn w-full py-3.5 text-sm" data-t="Далі →|Next →"></button>
  </div>
  <div id="as2" class="hidden space-y-3">
   <h2 id="as2Title" class="text-2xl font-black text-center uppercase"></h2>
   <button type="button" onclick="social('g')" class="w-full py-3 rounded-xl bg-white text-black font-bold text-sm"><i class="fa-brands fa-google mr-2"></i><span data-t="Продовжити з Google|Continue with Google"></span></button>
   <button type="button" onclick="social('a')" class="w-full py-3 rounded-xl bg-black border border-gray-600 font-bold text-sm"><i class="fa-brands fa-apple mr-2"></i><span data-t="Продовжити з Apple|Continue with Apple"></span></button>
   <div class="text-center text-[11px] text-gray-500">Email</div>
   <form onsubmit="handleAuthSubmit(event)" class="space-y-3">
    <input type="email" id="authEmail" required placeholder="you@example.com" class="inp">
    <input type="password" id="authPass" required minlength="6" data-p="Пароль (від 6 символів)|Password (6+ chars)" class="inp">
    <button type="submit" id="authSubmitBtn" class="btn w-full py-3.5 text-sm"></button>
   </form>
   <button id="backBtn" onclick="authStep(1)" class="w-full text-xs text-gray-400" data-t="← Назад|← Back"></button>
  </div>
  <div class="text-center space-y-1"><button onclick="authMode(mode=='reg'?'login':'reg')" class="text-xs text-neonGold" id="authToggleText"></button><button onclick="router.navigate('game')" class="block mx-auto text-[11px] text-gray-500" data-t="Грати як гість|Play as guest"></button></div>
 </div>
</section>

<section id="view-game" class="view-section hidden flex-1 flex flex-col p-4 max-w-md mx-auto w-full gap-3">
 <div class="card !p-3 flex justify-between items-center">

  <div class="text-right"><span class="text-[10px] text-gray-400 block uppercase" data-t="Сила|Power"></span><span id="clickPowerDisplay" class="text-xs font-bold text-emerald-400"></span></div>
 </div>
 <div class="grid grid-cols-2 gap-2 text-xs font-bold"><button id="tabSeal" onclick="tab('seal')" class="py-2 rounded-xl" data-t="🖌 Печать|🖌 Seal"></button><button id="tabSlot" onclick="tab('slot')" class="py-2 rounded-xl" data-t="🏯 Підземелля|🏯 Dungeon"></button></div>

 <div id="panelSeal" class="space-y-2">
  <div id="clickerZoneBox" class="rounded-3xl p-2">
   <div id="bossBox" class="hidden mb-2"><div class="flex justify-between text-[11px] font-black"><span class="text-crimsonRed">👑 BOSS</span><span id="bossTxt"></span></div><div class="h-2 bg-inkDark rounded-full overflow-hidden"><div id="bossHp" class="h-full bg-gradient-to-r from-crimsonRed to-neonGold transition-all"></div></div></div>
   <div class="relative w-full max-w-[320px] mx-auto"><canvas id="cv" width="320" height="320" class="w-full rounded-3xl bg-inkCard/80 border border-inkBorder"></canvas><span id="activeAvatarDisplay" class="absolute inset-0 flex items-center justify-center text-7xl pointer-events-none"></span></div>

  </div>
 </div>

 <div id="panelSlot" class="hidden dun rounded-3xl p-3 relative overflow-hidden space-y-3">
  <div id="rain" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
  <span class="absolute left-1 top-20 text-2xl" style="animation:flick 1s infinite">🔥</span><span class="absolute right-1 top-20 text-2xl" style="animation:flick 1.3s infinite">🔥</span>
  <div class="text-center font-black tracking-widest text-neonGold" data-t="🏯 ПІДЗЕМЕЛЛЯ ХРАМУ 🏯|🏯 TEMPLE DUNGEON 🏯"></div>
  <div id="slotBox" class="relative mx-auto w-[296px] bg-black/70 border border-neonGold/50 rounded-xl">
   <div id="reels" class="flex gap-1"></div><svg id="lines" class="absolute inset-0 pointer-events-none" width="296" height="174"></svg>
   <div id="winBanner" class="hidden absolute inset-0 flex-col items-center justify-center bg-black/60 text-center z-10"><div id="winT" class="text-3xl font-black text-neonGold" style="animation:pop .4s"></div><div id="winV" class="text-3xl font-mono font-black"></div></div>
  </div>
  <div id="slotInfo" class="text-center text-xs text-gray-300 min-h-[16px]"></div>
  <div class="flex items-center justify-between text-xs px-1">
   <div class="flex items-center gap-1"><button onclick="chBet(-1)" class="btn !px-3">−</button><div class="text-center w-16"><div class="text-[9px] text-gray-400" data-t="СТАВКА|BET"></div><b id="betV" class="font-mono text-neonGold"></b></div><button onclick="chBet(1)" class="btn !px-3">+</button></div>
   <div class="flex gap-1" id="lnBtns"></div>
  </div>
  <div class="flex items-center justify-between gap-2">
   <button onclick="buyBonus()" class="btng flex-1 py-3" id="buyBtn"></button>
   <button id="spinBtn" onclick="spin()" class="w-20 h-20 rounded-full bg-gradient-to-br from-neonGold to-crimsonRed font-black text-sm shadow-[0_0_25px_#ff2a5f] active:scale-90 disabled:opacity-50">SPIN</button>
   <div class="flex-1 text-center"><div class="text-[9px] text-gray-400" data-t="ЗАГАЛОМ|TOTAL"></div><b id="totV" class="font-mono"></b><br><button onclick="mute=!mute;localStorage.ink_mute=mute?1:0;ui()" id="muteBtn" class="text-lg"></button></div>
  </div>
  <p class="text-[10px] text-gray-500 text-center" data-t="Лише за ігрові 文. Виграші слоту не рахуються в прогрес нагород.|Play-money only. Slot wins don't count toward reward progress."></p>
 </div>

 <div class="card !p-3 space-y-2">
  <div class="flex justify-between text-xs"><span class="text-gray-400" data-t="Туш (енергія)|Ink (energy)"></span><span id="energyText" class="text-neonGold font-mono"></span></div>
  <div class="w-full bg-inkDark h-2 rounded-full overflow-hidden border border-inkBorder"><div id="energyBar" class="bg-gradient-to-r from-neonGold to-crimsonRed h-full transition-all"></div></div>
  <div class="pt-2 border-t border-inkBorder/60 flex justify-between items-center text-xs"><div><span class="text-gray-400 block" data-t="До наступної ери:|To next era:"></span><span id="nextLevelNeeded" class="font-bold"></span></div><span id="levelPercentage" class="text-neonGold font-mono font-bold"></span></div>
 </div>
</section>

<section id="view-boosters" class="view-section hidden flex-1 p-4 max-w-md mx-auto w-full space-y-4"><h2 class="text-xl font-black uppercase text-neonGold" data-t="⚡ Еволюція & Бустери|⚡ Evolution & Boosters"></h2><div id="boostersList" class="space-y-3 pb-6"></div></section>
<section id="view-quests" class="view-section hidden flex-1 p-4 max-w-md mx-auto w-full space-y-4"><div class="flex justify-between"><h2 class="text-xl font-black uppercase" data-t="Квести|Quests"></h2><span id="completedQuestsCount" class="text-xs text-neonGold font-mono font-bold"></span></div><div id="questsList" class="space-y-3 pb-6"></div></section>
<section id="view-offers" class="view-section hidden flex-1 p-4 max-w-md mx-auto w-full space-y-4">
 <div class="flex justify-between items-center"><h2 class="text-xl font-black uppercase text-neonGold" data-t="👥 Пришли друга|👥 Invite a friend"></h2><button onclick="router.navigate('admin')" id="adminNavBtn" class="hidden btn">Admin</button></div>
 <div class="card space-y-3 bg-gradient-to-br from-inkCard to-deepPurple/40"><p class="text-xs text-gray-300" data-t="Друг рахується, коли зареєструється за твоїм посиланням і дійде до 3-го рівня.|A friend counts once they sign up via your link and reach level 3."></p><div class="flex gap-2"><input id="refLinkInput" readonly class="inp !py-2.5 text-xs font-mono text-neonGold"><button onclick="copyRefLink()" class="btn" data-t="Копіювати|Copy"></button></div></div>
 <h3 class="text-sm font-black uppercase" data-t="Мої друзі|My friends"></h3><div id="friendsList" class="space-y-2"></div>
 <h3 class="text-sm font-black uppercase pt-2" data-t="Партнери та активності|Partners & tasks"></h3><div id="partnerOffersList" class="space-y-3 pb-6"></div>
</section>
<section id="view-rewards" class="view-section hidden flex-1 p-4 max-w-md mx-auto w-full space-y-4"><h2 class="text-xl font-black uppercase" data-t="Нагороди студії|Studio rewards"></h2><div id="rewardsList" class="space-y-3 pb-6"></div></section>
<section id="view-profile" class="view-section hidden flex-1 p-4 max-w-md mx-auto w-full space-y-4">
 <div class="card flex items-center space-x-4"><div id="profileAvatarBox" class="w-16 h-16 rounded-2xl overflow-hidden flex items-center justify-center text-3xl"></div><div><h3 id="profileEmail" class="font-bold text-sm"></h3><span id="profileVipBadge" class="inline-block mt-1 px-2 py-0.5 bg-crimsonRed/20 border border-crimsonRed/40 text-crimsonRed text-[10px] font-bold rounded-full uppercase"></span></div></div>
 <button id="saveProgBtn" onclick="authMode('reg');router.navigate('auth')" class="w-full py-3 rounded-xl bg-neonGold/10 border border-neonGold/40 text-neonGold font-bold text-sm" data-t="Зберегти прогрес — увійти|Save progress — sign in"></button>
 <div class="card space-y-3"><h4 class="text-xs font-bold text-neonGold uppercase" data-t="Мої аватари|My avatars"></h4><div id="avatarGridSelector" class="grid grid-cols-4 gap-2.5"></div></div>
 <div class="card space-y-3"><h4 class="text-xs font-bold text-neonGold uppercase" data-t="🏆 Топ гравців|🏆 Leaderboard"></h4><div id="leaderboardList" class="space-y-2 text-xs"></div></div>
 <button onclick="handleLogout()" class="w-full py-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 font-bold text-sm" data-t="Вийти з акаунта|Logout"></button>
</section>
<section id="view-admin" class="view-section hidden flex-1 p-4 max-w-md mx-auto w-full space-y-4">
 <div class="flex justify-between"><h2 class="text-xl font-black uppercase text-crimsonRed">Admin</h2><button onclick="router.navigate('offers')" class="text-xs text-gray-400" data-t="← Назад|← Back"></button></div>
 <div class="card space-y-3"><input id="admTitle" placeholder="Title" class="inp"><input id="admUrl" placeholder="https://…" class="inp"><button onclick="addOffer()" class="btn w-full py-2.5">+ Offer</button><p class="text-[11px] text-gray-500">Firestore: submissions/uid_offerId → status "ok"; claims; users.</p></div>
</section>
</main>

<div id="adOv" class="hidden fixed inset-0 z-[60] bg-black/75 items-center justify-center p-6"><div class="w-full max-w-xs card !border-neonGold/40 rounded-3xl text-center space-y-3 kitsune-glow"><div class="text-4xl">📣</div><h3 id="adText" class="font-black"></h3><button onclick="window.open(CFG.promo.url,'_blank')" class="w-full py-2 rounded-xl bg-inkDark border border-inkBorder text-xs font-bold" data-t="Відкрити|Open"></button><button id="adBtn" onclick="adClaim()" class="btng w-full py-3" disabled></button></div></div>
<div id="bonusOv" class="hidden fixed inset-0 z-[70] bg-black/90 flex-col items-center justify-center p-6 text-center gap-4">
 <div class="w-56 h-56 rounded-3xl overflow-hidden shadow-[0_0_80px_#ffb703] flex items-center justify-center text-8xl" style="animation:pulse-glow 2s infinite"><img src="img/bonus.png" data-e="⛩️" onerror="this.outerHTML=this.dataset.e" class="w-full h-full object-cover"></div>
 <h2 id="bonusT" class="text-3xl font-black text-neonGold" style="animation:pop .5s"></h2><div id="bonusS" class="text-3xl font-mono font-black"></div><button id="bonusBtn" onclick="bonusAct()" class="btng px-12 py-3 text-base"></button>
</div>

<nav id="bottomNav" class="hidden fixed bottom-0 left-0 right-0 z-40 bg-inkDark/95 border-t border-inkBorder backdrop-blur-md px-1.5 py-2 flex justify-around">
 <button onclick="router.navigate('game')" class="nav-btn flex flex-col items-center text-gray-400" data-target="game"><i class="fa-solid fa-gamepad"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Гра|Play"></span></button>
 <button onclick="router.navigate('boosters')" class="nav-btn flex flex-col items-center text-gray-400" data-target="boosters"><i class="fa-solid fa-bolt"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Бустери|Boosts"></span></button>
 <button onclick="router.navigate('quests')" class="nav-btn flex flex-col items-center text-gray-400" data-target="quests"><i class="fa-solid fa-scroll"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Квести|Quests"></span></button>
 <button onclick="router.navigate('offers')" class="nav-btn flex flex-col items-center text-gray-400" data-target="offers"><i class="fa-solid fa-user-plus"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Друзі|Friends"></span></button>
 <button onclick="router.navigate('rewards')" class="nav-btn flex flex-col items-center text-gray-400" data-target="rewards"><i class="fa-solid fa-gift"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Нагороди|Rewards"></span></button>
 <button onclick="router.navigate('profile')" class="nav-btn flex flex-col items-center text-gray-400" data-target="profile"><i class="fa-solid fa-user"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Профіль|Profile"></span></button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged,GoogleAuthProvider,OAuthProvider,signInWithPopup,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,collection,getDocs,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ⚠️ ВСТАВ КЛЮЧІ FIREBASE. У Authentication → Sign-in method увімкни Google та Apple (Apple потребує Apple Developer акаунт).
const firebaseConfig={apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT_ID.firebaseapp.com",projectId:"PASTE_PROJECT_ID",storageBucket:"PASTE_PROJECT_ID.appspot.com",messagingSenderId:"PASTE_SENDER_ID",appId:"PASTE_APP_ID"};
const ADMIN_UIDS=["PASTE_ADMIN_UID"];
const CFG={slots:1,every:6,promo:{text:"Підпишись на Instagram студії|Follow the studio on Instagram",url:"https://instagram.com/yyokai.tattoo",gems:2}};
// 🔊 Свої звуки кидай у папку sfx/ (назви нижче). Якщо файлу нема — просто тиша.
const SFX={spin:"sfx/spin.mp3",stop:"sfx/stop.mp3",win:"sfx/win.mp3",big:"sfx/bigwin.mp3",bonus:"sfx/bonus.mp3"};
let app,auth,db;try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app)}catch(e){}

const $=i=>document.getElementById(i),today=()=>new Date().toISOString().slice(0,10),fmt=n=>Math.floor(n).toLocaleString(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let lang=localStorage.ink_lang||"ua";const t=s=>{const a=s.split("|");return lang=="ua"?a[0]:a[1]||a[0]};
let mute=localStorage.ink_mute==1;window.CFG=CFG;
const play=k=>{if(mute||!SFX[k])return;try{const a=new Audio(SFX[k]);a.volume=.7;a.play().catch(()=>{})}catch(e){}};

const cv=$("cv"),cx=cv.getContext("2d"),W=320,C=160,TOL=24;let pts=[],idx=1,err=0,drawing=0,last=null;
function mk(easy){const Rn=Math.random,rot=Rn()*6.283,c=Math.cos(rot),s=Math.sin(rot),k=easy?0:Rn()*4|0;let f;
 if(k==0){const a=1+(Rn()*(easy?2:4)|0),b=1+(Rn()*(easy?2:4)|0),p=.6+Rn()*5,A=.3+Rn()*.08;f=u=>[Math.sin(a*6.283*u+p)*A,Math.sin(b*6.283*u)*A]}
 else if(k==1){const n=2+(Rn()*4|0),th=Math.PI*(n%2?1:2);f=u=>{const a=u*th,r=.4*Math.cos(n*a);return[r*Math.cos(a),r*Math.sin(a)]}}
 else if(k==2){const n=3+(Rn()*5|0),V=[...Array(n)].map((_,i)=>{const a=i/n*6.283,r=.2+Rn()*.2;return[Math.cos(a)*r,Math.sin(a)*r]});V.push(V[0]);f=u=>{const q=u*n,i=Math.min(n-1,q|0),w=q-i;return[V[i][0]+(V[i+1][0]-V[i][0])*w,V[i][1]+(V[i+1][1]-V[i][1])*w]}}
 else{const tn=1.5+Rn()*2.5;f=u=>{const a=u*tn*6.283,r=.05+.35*u;return[Math.cos(a)*r,Math.sin(a)*r]}}
 return u=>{const p=f(u);return[p[0]*c-p[1]*s,p[0]*s+p[1]*c]}}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function guide(){cx.clearRect(0,0,W,W);cx.lineCap=cx.lineJoin="round";cx.setLineDash([2,14]);cx.strokeStyle="rgba(255,183,3,.55)";cx.lineWidth=6;cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke();cx.setLineDash([]);cx.fillStyle="#00f0ff";cx.beginPath();cx.arc(pts[0][0],pts[0][1],9,0,6.3);cx.fill()}
function newSeal(){const f=mk(!!S.boss);pts=[...Array(56)].map((_,i)=>{const p=f(i/55);return[C+p[0]*W,C+p[1]*W]});idx=1;err=0;drawing=0;guide();
 $("activeAvatarDisplay").textContent=S.boss?S.boss.e:ERAS[lv()][4][S.seals%2];$("bossBox").classList.toggle("hidden",!S.boss);if(S.boss){$("bossHp").style.width=S.boss.hp*10+"%";$("bossTxt").textContent=S.boss.hp+"/10"}}
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*W/r.width]};
cv.addEventListener("pointerdown",e=>{e.preventDefault();if(S.energy<10){msg(t("Бракує туші ⚡|Out of ink ⚡"));return}const p=pos(e);if(dist(p,pts[0])>TOL*1.8){msg(t("Почни з блакитної точки|Start at the blue dot"));return}cv.setPointerCapture(e.pointerId);drawing=1;last=p;idx=1;err=0;guide();msg("")});
cv.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);cx.strokeStyle="#ff2a5f";cx.shadowColor="#ff2a5f";cx.shadowBlur=12;cx.lineWidth=7;cx.beginPath();cx.moveTo(last[0],last[1]);cx.lineTo(p[0],p[1]);cx.stroke();cx.shadowBlur=0;last=p;
 for(let j=idx;j<Math.min(idx+3,pts.length);j++){const d=dist(p,pts[j]);if(d<TOL){err+=d;idx=j+1;break}}if(idx>=pts.length){drawing=0;done()}});
["pointerup","pointercancel"].forEach(n=>cv.addEventListener(n,()=>{if(drawing){drawing=0;msg(t("Печать порвалась — ще раз|The seal broke — again"));guide()}}));
function done(){const acc=Math.max(0,1-err/pts.length/TOL),m=acc>.6?2:acc>.3?1.5:1;let g=Math.round(10*(lv()+1)*m*2**S.up.power*mult()),ex="";const crit=Math.random()<Math.min(.5,S.up.crit*.05);if(crit){g*=5;ex+=" 💥×5"}
 S.energy-=10;S.seals++;
 if(S.boss){S.boss.hp--;if(S.boss.hp<=0){const b=Math.round(800*(lv()+1)*2**S.up.power*mult());gain(b);S.gems+=5;S.kills++;S.boss=null;ex+=` · 👑 +${fmt(b)} · +5 🔮`}}else if(S.seals>5&&Math.random()<.07)S.boss={e:YK[Math.random()*YK.length|0],hp:10};
 gain(g);if(acc>.6&&Math.random()<.1+S.up.luck*.03){S.gems++;ex+=" · +1 🔮"}
 msg((acc>.6?t("✨ Ідеально! |✨ Perfect! "):acc>.3?t("Добре! |Good! "):t("Печать тримає. |Sealed. "))+"+"+fmt(g)+" 文"+ex);
 if(S.seals%CFG.every==0)setTimeout(()=>ad(CFG.promo.text,()=>{S.gems+=CFG.promo.gems;S.energy=maxE()},"+"+CFG.promo.gems+" 🔮"),900);

function rB(){const gm=[["rage","😈",t("Ярость Они: ×3 монет 5 хв|Oni Rage: ×3 coins 5 min"),5],["fill","🍶",t("Повна туш|Full ink refill"),2]];
 $("boostersList").innerHTML=gm.map(x=>`<div class="card flex items-center justify-between !border-cyberBlue/40"><div class="flex items-center gap-3"><span class="text-3xl">${x[1]}</span><div class="text-xs font-bold">${x[2]}${x[0]=="rage"&&Date.now()<S.rage?`<div class="text-emerald-400">${Math.ceil((S.rage-Date.now())/1000)}s</div>`:""}</div></div><button class="btng" onclick="buyG('${x[0]}')">${x[3]} 🔮</button></div>`).join("")+
 Object.keys(BO).map(k=>{const l=S.up[k],st=STG[Math.min(3,l/5|0)],b=BO[k],mx=l>=20;return `<div class="card space-y-2" style="border-color:${st[1]};box-shadow:0 0 ${6+l}px ${st[1]}55"><div class="flex items-center justify-between"><div class="flex items-center gap-3"><span class="text-3xl">${b[0]}</span><div><h4 class="font-bold text-sm">${t(b[1])}</h4><span class="text-[10px] font-black" style="color:${st[1]}">${t(st[0])} · Lv ${l}</span></div></div><button class="btng" ${mx?"disabled":""} onclick="buyB('${k}')">${mx?"MAX":fmt(bc(k,l))+" 文"}</button></div><div class="flex justify-between text-[11px]"><span class="text-gray-400">${b[4](l)}</span><span class="text-emerald-400">${mx?"":"→ "+b[4](l+1)}</span></div><div class="h-1.5 bg-inkDark rounded-full overflow-hidden"><div class="h-full" style="width:${l%5*20+(l%5?0:0)}%;background:${st[1]}"></div></div><div class="text-[9px] text-gray-500">${t("До еволюції|To evolution")}: ${5-l%5}</div></div>`}).join("")}
setInterval(()=>{if(S.up.auto>0)gain(2**(S.up.auto-1)*mult());if(S.energy<maxE())S.energy=Math.min(maxE(),S.energy+2**S.up.regen);ui();if(cur=="boosters"&&Date.now()<S.rage)rB()},1000);

// ---------- Квести ----------
const QUESTS=[...Array(100)].map((_,i)=>{const n=i+1;return n%5==0?{id:n,ad:1,tg:2*(n/5),rw:{g:3+(n/10|0)}}:{id:n,tg:10+(n*n/2.5|0),rw:{m:n*300}}});
window.claimQ=id=>{const q=QUESTS[id-1];if(S.qd.includes(id)||(q.ad?S.ads:S.seals)<q.tg)return;S.qd.push(id);if(q.rw.m)gain(q.rw.m);else S.gems+=q.rw.g;save();rend()};
window.watchQ=()=>ad("Підтримай студію — подивись рекламу|Support the studio — watch an ad",()=>{S.gems+=1},"+1 🔮");
function rQ(){$("completedQuestsCount").textContent=S.qd.length+" / 100";$("questsList").innerHTML=QUESTS.map(q=>{const c=S.qd.includes(q.id),v=q.ad?S.ads:S.seals,r=v>=q.tg&&!c;return `<div class="card !p-3 flex items-center justify-between ${q.ad?"!border-cyberBlue/40":""}"><div><h4 class="font-bold text-xs">${q.ad?"📺 "+t("Подивись рекламу|Watch ads")+" ×"+q.tg:"🖌 "+t("Запечатай|Seal")+" "+fmt(q.tg)}</h4><span class="text-[10px] text-neonGold font-mono">+${q.rw.m?fmt(q.rw.m)+" 文":q.rw.g+" 🔮"} • ${fmt(Math.min(v,q.tg))}/${fmt(q.tg)}</span></div><div class="flex gap-1">${q.ad&&!c&&!r?`<button class="btn !bg-cyberBlue/30" onclick="watchQ()">📺</button>`:""}<button onclick="claimQ(${q.id})" ${c?"disabled":""} class="btn ${c?"!bg-gray-800 !text-gray-500":r?"!bg-gradient-to-r from-neonGold to-crimsonRed animate-pulse":"!bg-inkDark border border-inkBorder !text-gray-400"}">${c?"✓":r?t("Забрати|Claim"):"…"}</button></div></div>`}).join("")}

// ---------- Друзі та офери ----------
window.copyRefLink=()=>{const i=$("refLinkInput");i.select();navigator.clipboard.writeText(i.value);alert(t("Скопійовано!|Copied!"))};
window.doOffer=async id=>{if(!user){alert(t("Спочатку увійди в акаунт|Please sign in first"));authMode("reg");router.navigate("auth");return}const o=OFFERS.find(x=>x.id==id);window.open(o.url,"_blank");try{await setDoc(doc(db,"submissions",user.uid+"_"+id),{uid:user.uid,offer:id,status:"pending"});S.offers[id]="pending";rO()}catch(e){alert(e.message)}};
function rO(){$("refLinkInput").value=location.origin+location.pathname+"?ref="+(user?user.uid:"");
 $("friendsList").innerHTML=FR.length?FR.map(f=>`<div class="card !p-3 flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl overflow-hidden flex items-center justify-center text-xl" ${frame(f.a)}>${avHTML(f.a)}</div><div><b class="text-xs">${f.n}</b><div class="text-[10px] text-gray-400">${t("Рівень|Level")} ${lvOf(f.s)+1} ${lvOf(f.s)>=2?"✅":""}</div></div></div><span class="font-mono text-xs text-neonGold">${fmt(f.s)} 文</span></div>`).join(""):`<p class="text-xs text-gray-500">${t("Поки нікого. Поділись посиланням!|No friends yet. Share your link!")}</p>`;
 $("partnerOffersList").innerHTML=OFFERS.map(o=>{const s=S.offers[o.id];return `<div class="card flex items-center justify-between"><div><span class="text-[10px] text-neonGold font-bold">${o.cat||"PARTNER"}</span><h4 class="font-bold text-sm">${t(o.title)}</h4><span class="text-[10px] text-crimsonRed">${t("Зараховується після перевірки|Counts after verification")}</span></div><button ${s?"disabled":""} onclick="doOffer('${o.id}')" class="btn ${s=="ok"?"!bg-emerald-600":s?"!bg-gray-800 !text-gray-400":""}">${s=="ok"?"✓":s?t("Перевірка|Pending"):"START"}</button></div>`}).join("")}
window.addOffer=async()=>{const a=$("admTitle").value,u=$("admUrl").value;if(!a||!u)return;try{await addDoc(collection(db,"offers"),{title:a,url:u,cat:"PARTNER"});alert("OK")}catch(e){alert(e.message)}};
async function loadFriends(){FR=[];try{const q=await getDocs(query(collection(db,"referrals"),where("by","==",user.uid)));for(const d of q.docs){try{const u=await getDoc(doc(db,"users",d.id));FR.push(u.exists()?{n:u.data().nick||"?",a:u.data().av||"fox",s:u.data().total||0}:{n:"…",a:"fox",s:0})}catch(e){}}}catch(e){}S.friends=FR.filter(f=>lvOf(f.s)>=2).length}

// ---------- Нагороди ----------
const rows=r=>r.map(x=>`<div><div class="flex justify-between text-[11px]"><span class="text-gray-300">${t(x[0])}</span><span class="font-mono ${x[1]>=x[2]?"text-emerald-400":"text-neonGold"}">${fmt(Math.min(x[1],x[2]))}/${fmt(x[2])}</span></div><div class="h-1.5 bg-inkDark rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-neonGold to-crimsonRed" style="width:${Math.min(100,x[1]/x[2]*100)}%"></div></div></div>`).join("");
window.claim=async(id,c)=>{if(S.claimed.includes(id))return;if(!user){alert(t("Спочатку увійди в акаунт|Please sign in first"));authMode("reg");router.navigate("auth");return}if(S.mon<c){alert(t("Недостатньо 文|Not enough 文"));return}
 try{await addDoc(collection(db,"claims"),{uid:user.uid,email:user.email||"",nick:S.nick,tier:id,total:S.total,days:S.days,ts:serverTimestamp()});S.mon-=c;S.claimed.push(id);save();rend();alert(t("Заявку надіслано! Студія перевірить умови.|Request sent! The studio will verify the conditions."))}catch(e){alert(e.message)}};
window.buyAv=i=>{const a=AVS.find(x=>x.i==i);if(S.mon<a.p||S.own.includes(i))return;S.mon-=a.p;S.own.push(i);S.av=i;save();rend()};
function rR(){const F=t("Друзів (3-й рівень)|Friends (level 3)"),B=t("Баланс 文|Balance 文");
 const L=[...[1,2,3,4].map(n=>["d"+n*10,"🏷 "+t("Знижка|Discount")+" "+n*10+"% "+t("на татуювання|on tattoo"),[[F,S.friends,n]],0]),
 ["mini","🎁 "+t("Міні-тату (до 1500 грн)|Mini tattoo (up to 1500 UAH)"),[[t("Зібрати 文|Earn 文"),S.total,125e3],[t("Днів у грі|Days played"),S.days,14],[t("Завдань партнерів|Partner tasks"),okN(),3],[F,S.friends,1]],0],
 ["big","👑 "+t("Велике тату (7000 грн)|Big tattoo (7000 UAH)"),[[t("Зібрати 文|Earn 文"),S.total,12e5],[t("Днів у грі|Days played"),S.days,30],[t("Завдань партнерів|Partner tasks"),okN(),7],[F,S.friends,5],[t("Реклам переглянуто|Ads watched"),S.ads,30],[t("Босів переможено|Bosses defeated"),S.kills,10]],0],
 ["flash","🎴 "+t("Ексклюзивний флеш-ескіз|Exclusive flash sketch"),[[B,S.mon,25e4]],25e4]];
 $("rewardsList").innerHTML=`<p class="text-[11px] text-gray-400">${t("Місць на велику нагороду цього місяця|Big-reward slots this month")}: <b class="text-neonGold">${CFG.slots}</b></p>`+L.map(([id,ti,r,c])=>{const all=r.every(x=>x[1]>=x[2]),cl=S.claimed.includes(id);return `<div class="card space-y-3"><h3 class="font-black text-sm">${ti}</h3>${rows(r)}<button onclick="claim('${id}',${c})" ${all&&!cl?"":"disabled"} class="btng w-full py-2.5 ${all&&!cl?"":"!from-gray-800 !to-gray-800 !text-gray-500"}">${cl?t("Заявку подано|Request sent"):all?t("Забрати нагороду|Claim reward"):t("Умови не виконано|Conditions not met")}</button></div>`}).join("")+
 `<h3 class="text-sm font-black uppercase pt-2">${t("💎 Магазин аватарів|💎 Avatar shop")}</h3><div class="grid grid-cols-2 gap-3">`+AVS.filter(a=>a.p).map(a=>{const own=S.own.includes(a.i),[rn,col]=RAR[a.r];return `<div class="card !p-3 text-center space-y-2" style="border-color:${col};box-shadow:0 0 ${a.r*8}px ${col}66"><div class="w-20 h-20 mx-auto rounded-2xl overflow-hidden flex items-center justify-center text-5xl kitsune-glow" ${frame(a.i)}>${avHTML(a.i)}</div><div class="text-[10px] font-black" style="color:${col}">${t(rn)}</div><b class="text-xs">${a.n}</b><button onclick="buyAv('${a.i}')" ${own?"disabled":""} class="btng w-full">${own?"✓":fmt(a.p)+" 文"}</button></div>`}).join("")+`</div>`}

// ---------- Профіль ----------
function avGrid(el,items,sel,cb){el.innerHTML=items.map(a=>`<button type="button" data-i="${a.i}" class="aspect-square rounded-2xl flex items-center justify-center text-3xl overflow-hidden ${sel()==a.i?"ring-2 ring-white":""}" ${frame(a.i)}>${avHTML(a.i)}</button>`).join("");el.querySelectorAll("button").forEach(b=>b.onclick=()=>{cb(b.dataset.i);avGrid(el,items,sel,cb)})}
function rP(){$("profileEmail").textContent=(S.nick||t("Гість|Guest"))+(user&&user.email?" · "+user.email:"");$("profileVipBadge").textContent=t("Рівень|Level")+" "+(lv()+1)+" • "+S.days+" "+t("дн.|d.");$("saveProgBtn").classList.toggle("hidden",!!user);
 $("profileAvatarBox").innerHTML=avHTML(S.av);$("profileAvatarBox").setAttribute("style",frame(S.av).slice(7,-1));
 avGrid($("avatarGridSelector"),AVS.filter(a=>S.own.includes(a.i)),()=>S.av,i=>{S.av=i;save();ui();$("profileAvatarBox").innerHTML=avHTML(i)});
 const Lb=[{n:(S.nick||"YYOKAI")+" ("+t("Ти|You")+")",a:S.av,s:S.total,me:1},{n:"CyberSamurai",a:"oni",s:1450000},{n:"KitsuneQueen",a:"fox",s:890000}].sort((a,b)=>b.s-a.s);
 $("leaderboardList").innerHTML=Lb.map((l,i)=>`<div class="flex items-center justify-between p-2.5 rounded-xl border ${l.me?"bg-crimsonRed/10 border-crimsonRed/40":"bg-inkDark border-inkBorder"}"><div class="flex items-center gap-2"><span class="font-mono text-neonGold font-bold">#${i+1}</span><span class="w-7 h-7 rounded-lg overflow-hidden flex items-center justify-center">${avHTML(l.a)}</span><b>${l.n}</b></div><span class="font-mono text-crimsonRed font-bold">${fmt(l.s)} 文</span></div>`).join("")}

// ---------- Авторизація: Google / Apple / email, пам'ять у Firebase ----------
const NICKS=["Kage","Tsuki","Yuki","Kuro","Akai","Raiden","Hoshi","Sora"];
window.rndNick=()=>{$("authNick").value=NICKS[Math.random()*8|0]+(10+Math.random()*89|0)};
window.authStep=n=>{$("as1").classList.toggle("hidden",n!=1);$("as2").classList.toggle("hidden",n!=2);$("dot1").className="h-1.5 w-10 rounded-full "+(n==1?"bg-crimsonRed":"bg-crimsonRed/50");$("dot2").className="h-1.5 w-10 rounded-full "+(n==2?"bg-crimsonRed":"bg-inkBorder")};
window.authMode=(m,keep)=>{mode=m;const reg=m=="reg";$("dots").classList.toggle("hidden",!reg);$("backBtn").classList.toggle("hidden",!reg);
 $("as2Title").textContent=reg?t("Збережи прогрес|Save your progress"):t("З поверненням|Welcome back");$("authSubmitBtn").textContent=reg?t("Створити акаунт|Create account"):t("Увійти|Sign in");$("authToggleText").textContent=reg?t("Вже є акаунт? Увійти|Have an account? Sign in"):t("Немає акаунта? Реєстрація|No account? Register");
 if(keep)return;if(reg)authStep(1);else{$("as1").classList.add("hidden");$("as2").classList.remove("hidden")}};
window.social=async k=>{try{await signInWithPopup(auth,k=="g"?new GoogleAuthProvider():new OAuthProvider("apple.com"))}catch(e){alert(e.message)}};
window.handleAuthSubmit=async e=>{e.preventDefault();const em=$("authEmail").value,pw=$("authPass").value;try{mode=="reg"?await createUserWithEmailAndPassword(auth,em,pw):await signInWithEmailAndPassword(auth,em,pw)}catch(x){alert(x.message)}};
window.handleLogout=async()=>{try{await signOut(auth)}catch(e){}user=null;FR=[];router.navigate("landing")};
if(auth){setPersistence(auth,browserLocalPersistence).catch(()=>{});
 onAuthStateChanged(auth,async u=>{user=u;if(!u){$("adminNavBtn").classList.add("hidden");return}
  $("adminNavBtn").classList.toggle("hidden",!ADMIN_UIDS.includes(u.uid));let fresh=0;
  try{const r=await getDoc(doc(db,"users",u.uid));if(r.exists()){const D=r.data();if((D.total||0)>=S.total){const{offers,...x}=D;S={...S,...x,up:{...S.up,...D.up}}}}else fresh=1}catch(e){}
  if(fresh){S.nick=S.nick||$("authNick").value||u.displayName||"Yokai";S.av=pickAv;if(refId&&refId!=u.uid){S.gems+=5;try{await setDoc(doc(db,"referrals",u.uid),{by:refId,ts:serverTimestamp()})}catch(e){}}}
  await loadFriends();try{(await getDocs(query(collection(db,"submissions"),where("uid","==",u.uid)))).forEach(d=>S.offers[d.data().offer]=d.data().status)}catch(e){}
  try{const o=[];(await getDocs(collection(db,"offers"))).forEach(d=>o.push({id:d.id,...d.data()}));if(o.length)OFFERS=o}catch(e){}
  save();await push();router.navigate("game")})}

// ---------- Старт ----------
avGrid($("authAvatars"),AVS.filter(a=>!a.p),()=>pickAv,i=>{pickAv=i});translateUI();newSeal();
if(refId){$("refBanner").classList.remove("hidden");authMode("reg");router.navigate("auth")}else router.navigate("landing");
</script></body></html>

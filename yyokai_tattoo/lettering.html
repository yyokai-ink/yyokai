<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YYOKAI | Обрати власний надпис</title>
<meta name="description" content="Конструктор напису — обери шрифт і збережи прев'ю. YYOKAI, Львів.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;900&family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#060605;
    --panel:#0e0e0d;
    --white:#f4f1ea;
    --white-dim:rgba(244,241,234,0.55);
    --red:#ff6a55;
    --red-deep:#a13324;
    --line:rgba(244,241,234,0.09);
    --ease:cubic-bezier(0.16,1,0.3,1);
    --gutter:clamp(20px,6vw,64px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;outline:none;-webkit-tap-highlight-color:transparent;}
  html{background:var(--black);overscroll-behavior-x:none;}
  body{background:var(--black);color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden;line-height:1.5;
    overscroll-behavior-x:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;max-width:100vw;
    min-height:100svh;display:flex;flex-direction:column;}
  a{color:inherit;}
  ::selection{background:var(--red);color:var(--black);}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- TOP BAR (як на решті сайту) ---------- */
  .menu-btn{position:fixed;top:26px;right:24px;z-index:2000;width:26px;height:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;}
  .menu-btn span{display:block;width:100%;height:1px;background:var(--white);transition:transform .35s var(--ease),opacity .35s;}
  .menu-btn.active span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
  .menu-btn.active span:nth-child(2){opacity:0;}
  .menu-btn.active span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

  .brand-mark{position:fixed;top:24px;left:24px;z-index:2000;font-family:'Unbounded',sans-serif;font-size:13px;letter-spacing:.04em;text-decoration:none;color:var(--white);}

  .sound-btn{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(14,14,13,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .3s,background .3s;}
  .sound-btn:hover{border-color:var(--red-deep);}
  .sound-btn svg{width:15px;height:15px;}
  .sound-btn .icon-off{display:none;}
  .sound-btn.muted .icon-on{display:none;}
  .sound-btn.muted .icon-off{display:block;}

  .nav-overlay{position:fixed;inset:0;background:var(--black);z-index:1999;display:flex;flex-direction:column;justify-content:center;padding:0 var(--gutter);transform:translateY(-102%);transition:transform .55s var(--ease);}
  .nav-overlay.active{transform:translateY(0);}
  .nav-overlay a{display:block;font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.5rem,6vw,2.6rem);color:var(--white-dim);text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line);transition:color .3s var(--ease),padding-left .3s var(--ease),text-shadow .3s var(--ease);}
  .nav-overlay a:hover,.nav-overlay a:focus-visible{color:var(--white);padding-left:14px;text-shadow:0 0 22px rgba(244,241,234,0.45);}
  .nav-overlay a.accent{color:var(--red);}
  .nav-foot{margin-top:30px;font-size:12px;color:var(--white-dim);}

  .cta-fixed{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--black);padding:16px 36px;border-radius:100px;text-decoration:none;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:600;z-index:1500;box-shadow:0 10px 30px rgba(255,106,85,.35);white-space:nowrap;transition:transform .25s var(--ease);}
  .cta-fixed:hover{transform:translateX(-50%) translateY(-2px);}

  /* ---------- IN-APP BROWSER BANNER ---------- */
  .browser-banner{position:fixed;top:0;left:0;right:0;z-index:2500;background:var(--red);color:var(--black);
    font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;padding:10px var(--gutter);text-align:center;
    display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
  .browser-banner.show{display:flex;}
  .browser-banner button{background:var(--black);color:var(--white);border:none;border-radius:100px;padding:6px 14px;font-family:'Unbounded',sans-serif;font-size:10px;font-weight:600;cursor:pointer;}

  /* ---------- PAGE ---------- */
  .page-head{position:relative;padding:100px var(--gutter) 8px;text-align:center;}
  .page-head .mono{font-size:11px;color:var(--red);}
  .page-head h1{font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.3rem,4vw,1.8rem);margin-top:8px;}

  .builder{flex:1;display:flex;flex-direction:column;max-width:640px;margin:0 auto;width:100%;padding:24px var(--gutter) 160px;gap:20px;}

  .preview-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:36px 20px;
    display:flex;align-items:center;justify-content:center;min-height:140px;cursor:pointer;text-align:center;overflow:hidden;}
  .preview-card span{font-size:clamp(1.6rem,7vw,2.6rem);color:var(--white);word-break:break-word;line-height:1.2;transition:font-size .2s ease;}
  .preview-hint{text-align:center;font-size:.75rem;color:var(--white-dim);margin-top:-8px;}

  .input-wrap{position:relative;}
  #user-input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:100px;color:var(--white);
    padding:16px 22px;text-align:center;font-size:15px;font-family:'Inter',sans-serif;transition:border-color .3s;}
  #user-input:focus{border-color:var(--red-deep);}
  #user-input::placeholder{color:var(--white-dim);}

  .font-list-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;}
  .font-list-head span{font-size:11px;color:var(--white-dim);}
  .scroll-area{max-height:44vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);}
  .font-node{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s,padding-left .2s;}
  .font-node:last-child{border-bottom:none;}
  .font-node:hover{background:#161311;}
  .font-node span:first-child{font-size:1.3rem;color:var(--white);}
  .font-node span:last-child{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--white-dim);white-space:nowrap;}
  .font-node.active{background:#161311;border-left:2px solid var(--red);padding-left:16px;}
  .font-node.active span:last-child{color:var(--red);}

  .save-btn{display:block;width:100%;padding:16px;background:transparent;border:1px solid var(--red-deep);color:var(--white);
    font-family:'Unbounded',sans-serif;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    border-radius:100px;cursor:pointer;transition:background .3s,border-color .3s,color .3s;text-align:center;}
  .save-btn:hover{background:var(--red);border-color:var(--red);color:var(--black);}

  #copy-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:2600;
    background:var(--panel);border:1px solid var(--red-deep);color:var(--white);padding:10px 20px;border-radius:100px;
    font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;}
  #copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>
<body>

<div class="browser-banner" id="browserBanner">
  <span id="bannerText">Ти в Instagram-браузері — для збереження відкрий сторінку в звичайному браузері</span>
  <button id="bannerBtn">Відкрити</button>
</div>

<div id="copy-toast">Скопійовано</div>

<audio id="bg-music" loop preload="none"><source src="Myzukalettering.mp3" type="audio/mpeg"></audio>
<button class="sound-btn muted" id="soundBtn" aria-label="Увімкнути/вимкнути музику">
  <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="#f4f1ea" stroke-width="1.6"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="#f4f1ea" stroke-width="1.6"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
</button>

<a href="index.html" class="brand-mark">YYOKAI</a>
<div class="menu-btn" id="burger" onclick="toggleMenu()"><span></span><span></span><span></span></div>

<nav class="nav-overlay" id="nav">
  <a href="esciz.html">власні ескізи</a>
  <a href="portfolio.html">портфоліо</a>
  <a href="booking.html" class="accent">записатись</a>
  <a href="https://www.instagram.com/yyokai.ink?igsh=MXhhNGJvNmZ5ZnljNQ==" target="_blank" rel="noopener">консультація</a>
  <div class="nav-foot mono">yyokai.tattoo — Львів</div>
</nav>

<div class="page-head">
  <div class="mono">lettering</div>
  <h1>Обрати власний надпис</h1>
</div>

<div class="builder">
  <div class="preview-card" id="main-display" onclick="copyText()">Memento Mori</div>
  <p class="preview-hint">Натисни на напис, щоб скопіювати текст</p>

  <div class="input-wrap">
    <input type="text" id="user-input" placeholder="Введи текст..." oninput="syncText()" maxlength="100">
  </div>

  <div class="font-list-head">
    <span class="mono">оберіть шрифт</span>
    <span class="mono" id="fontCount"></span>
  </div>
  <div class="scroll-area">
    <div id="font-list"></div>
  </div>

  <button class="save-btn" id="saveBtn" onclick="handleSave()">Зберегти як PNG</button>
</div>

<a href="booking.html" class="cta-fixed">Записатись</a>

<script>
  const tattooFonts = [
    {id:'UnifrakturMaguntia', tag:'GOTHIC'},
    {id:'MedievalSharp', tag:'GOTHIC'},
    {id:'Ponomar', tag:'GOTHIC'},
    {id:'Monomakh', tag:'GOTHIC'},
    {id:'Shafarik', tag:'GOTHIC'},
    {id:'Ballet', tag:'SCRIPT'},
    {id:'Great Vibes', tag:'SCRIPT'},
    {id:'Pinyon Script', tag:'SCRIPT'},
    {id:'Monsieur La Doulaise', tag:'SCRIPT'},
    {id:'Mr De Haviland', tag:'SCRIPT'},
    {id:'Herr Von Muellerhoff', tag:'SCRIPT'},
    {id:'Mrs Saint Delafield', tag:'SCRIPT'},
    {id:'Tangerine', tag:'SCRIPT'},
    {id:'Allison', tag:'SCRIPT'},
    {id:'Sacramento', tag:'SCRIPT'},
    {id:'Allura', tag:'SCRIPT'},
    {id:'Whisper', tag:'SCRIPT'},
    {id:'Parisienne', tag:'SCRIPT'},
    {id:'Playball', tag:'SCRIPT'},
    {id:'Mr Dafoe', tag:'SCRIPT'},
    {id:'Ephesis', tag:'SCRIPT'},
    {id:'Quintessential', tag:'SCRIPT'},
    {id:'Corinthia', tag:'SCRIPT'},
    {id:'Montez', tag:'SCRIPT'},
    {id:'League Script', tag:'SCRIPT'},
    {id:'Meie Script', tag:'SCRIPT'},
    {id:'Lavishly Yours', tag:'SCRIPT'},
    {id:'Stalemate', tag:'SCRIPT'},
    {id:'Imperial Script', tag:'SCRIPT'},
    {id:'Mea Culpa', tag:'SCRIPT'},
    {id:'Mr Bedfort', tag:'SCRIPT'},
    {id:'Miss Fajardose', tag:'SCRIPT'},
    {id:'Fleur De Leah', tag:'SCRIPT'},
    {id:'Updock', tag:'SCRIPT'},
    {id:'Noto Sans TC', tag:'ASIA'},
    {id:'Nanum Myeongjo', tag:'ASIA'},
    {id:'Lobster Two', tag:'VINTAGE'},
    {id:'Jacques Francois Shadow', tag:'VINTAGE'},
    {id:'Emblema One', tag:'VINTAGE'},
    {id:'Ewert', tag:'VINTAGE'},
    {id:'Jacquard 24 Charted', tag:'VINTAGE'},
    {id:'Creepster', tag:'HORROR'},
    {id:'Rampart One', tag:'DISPLAY'},
    {id:'Sonsie One', tag:'DISPLAY'},
    {id:'Joti One', tag:'DISPLAY'},
    {id:'Sankofa Display', tag:'DISPLAY'},
    {id:'Dancing Script', tag:'HAND'},
    {id:'Caveat', tag:'HAND'},
    {id:'Kaushan Script', tag:'HAND'},
    {id:'Homemade Apple', tag:'HAND'},
    {id:'Nothing You Could Do', tag:'HAND'},
    {id:'Amatic SC', tag:'HAND'},
    {id:'Cookie', tag:'HAND'},
    {id:'Caramel', tag:'HAND'},
    {id:'Molle', tag:'HAND'},
    {id:'Playwrite ES', tag:'HAND'},
    {id:'Playwrite NZ Guides', tag:'HAND'},
    {id:'Libre Baskerville', tag:'ROMAN'},
    {id:'DM Serif Display', tag:'ROMAN'},
    {id:'Quattrocento', tag:'ROMAN'},
    {id:'Quando', tag:'ROMAN'},
    {id:'Belleza', tag:'ROMAN'},
    {id:'Bona Nova SC', tag:'ROMAN'},
    {id:'Italiana', tag:'ROMAN'},
    {id:'Libre Caslon Display', tag:'ROMAN'},
    {id:'Bodoni Moda SC', tag:'ROMAN'},
    {id:'Elsie Swash Caps', tag:'ROMAN'},
    {id:'Diplomata SC', tag:'ROMAN'},
    {id:'Saira Stencil One', tag:'TECH'},
    {id:'Russo One', tag:'TECH'},
    {id:'Gruppo', tag:'TECH'},
    {id:'Contrail One', tag:'TECH'},
    {id:'Dorsa', tag:'TECH'},
    {id:'Bungee Outline', tag:'TECH'},
    {id:'Josefin Slab', tag:'MODERN'},
    {id:'Press Start 2P', tag:'PIXEL'},
    {id:'Silkscreen', tag:'PIXEL'},
    {id:'Sedgwick Ave Display', tag:'STREET'},
    {id:'Bangers', tag:'COMIC'}
  ];

  let currentFont = null;

  function loadPreviews(fonts){
    const size = 20;
    for (let i = 0; i < fonts.length; i += size){
      const chunk = fonts.slice(i, i + size);
      const names = chunk.map(f => f.id.replace(/ /g, '+')).join('|');
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css?family=${names}&display=swap`;
      document.head.appendChild(link);
    }
  }
  loadPreviews(tattooFonts);

  const list = document.getElementById('font-list');
  document.getElementById('fontCount').textContent = tattooFonts.length + ' шрифтів';

  tattooFonts.forEach(f => {
    const node = document.createElement('div');
    node.className = 'font-node';
    node.innerHTML = `<span style="font-family:'${f.id}'">Style</span><span>${f.tag}</span>`;
    node.onclick = () => {
      currentFont = f.id;
      document.getElementById('main-display').style.fontFamily = `'${f.id}', sans-serif`;
      document.querySelectorAll('.font-node').forEach(n => n.classList.remove('active'));
      node.classList.add('active');
    };
    list.appendChild(node);
  });

  function syncText(){
    const val = document.getElementById('user-input').value;
    const display = document.getElementById('main-display');
    display.innerText = val || 'MEMENTO MORI';
  }

  function toggleMenu(){
    document.getElementById('burger').classList.toggle('active');
    document.getElementById('nav').classList.toggle('active');
  }

  /* звук */
  (function(){
    const audio = document.getElementById('bg-music');
    const btn = document.getElementById('soundBtn');
    btn.addEventListener('click', function(){
      if(audio.paused){ audio.play().catch(function(){}); } else { audio.pause(); }
    });
    audio.addEventListener('play', function(){ btn.classList.remove('muted'); });
    audio.addEventListener('pause', function(){ btn.classList.add('muted'); });
  })();

  function copyText(){
    const display = document.getElementById('main-display');
    navigator.clipboard.writeText(display.innerText).catch(function(){});
    const toast = document.getElementById('copy-toast');
    toast.textContent = 'Скопійовано';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1200);
  }

  /* ============================================================
     👉 ЗБЕРЕЖЕННЯ PNG
     Instagram (і Facebook) відкривають сайти у власному вбудованому
     браузері, а не в Safari/Chrome — і в ньому завантаження файлів
     часто просто ігнорується браузером. Тому: якщо визначаємо, що
     людина зараз у такому вбудованому браузері — пропонуємо спершу
     відкрити сторінку по-справжньому (в Chrome на Android це working
     через "intent://"; на iOS єдиний надійний спосіб — вручну через
     кнопку "..." → "Відкрити в браузері", бо iOS не дозволяє сайтам
     самим перекидати з вбудованого браузера Instagram у Safari).
     ============================================================ */
  function isInAppBrowser(){
    const ua = navigator.userAgent || '';
    return /Instagram|FBAN|FBAV|Line\//i.test(ua) || /; wv\)/i.test(ua);
  }
  function isAndroid(){ return /android/i.test(navigator.userAgent || ''); }

  function openInRealBrowser(){
    if(isAndroid()){
      const url = window.location.href.replace(/^https?:\/\//, '');
      window.location.href = 'intent://' + url + '#Intent;scheme=https;package=com.android.chrome;end';
    } else {
      alert('Натисни "···" у верхньому правому куті екрана і вибери "Відкрити в браузері" (Safari) — тоді збереження запрацює.');
    }
  }

  (function(){
    if(isInAppBrowser()){
      const banner = document.getElementById('browserBanner');
      banner.classList.add('show');
      if(!isAndroid()){
        document.getElementById('bannerText').textContent = 'Ти в Instagram-браузері — для збереження натисни "···" і відкрий сторінку в Safari';
      }
      document.getElementById('bannerBtn').addEventListener('click', openInRealBrowser);
    }
  })();

  async function handleSave(){
    if(isInAppBrowser()){
      openInRealBrowser();
      return;
    }

    const display = document.getElementById('main-display');
    const text = display.innerText || 'MEMENTO MORI';
    const fontFamily = currentFont || 'Unbounded';
    const fontSize = 84;

    try{
      await document.fonts.load(`900 ${fontSize}px "${fontFamily}"`);
      await document.fonts.ready;
    }catch(e){}

    const measureCanvas = document.createElement('canvas');
    const mctx = measureCanvas.getContext('2d');
    mctx.font = `900 ${fontSize}px "${fontFamily}"`;
    const textWidth = mctx.measureText(text).width;

    const paddingX = 90, paddingY = 70;
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(textWidth) + paddingX * 2;
    canvas.height = fontSize + paddingY * 2;

    const ctx = canvas.getContext('2d');
    ctx.font = `900 ${fontSize}px "${fontFamily}"`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000000';
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);

    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = 'yyokai-lettering.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
</body>
</html>

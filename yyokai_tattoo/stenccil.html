<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YYO KAI — Professional Tattoo Stencil Studio</title>
  <style>
    /* 1. Базові налаштування та фіксація горизонтального скролу */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: #080808;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    }

    /* 2. Верхній хедер з керуванням музикою та анімованим бургером */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      z-index: 100;
      background: linear-gradient(180deg, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0) 100%);
      backdrop-filter: blur(4px);
    }

    .audio-header-control {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 18, 18, 0.7);
      border: 1px solid rgba(255, 42, 42, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    .music-btn {
      background: #ff2a2a;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.75rem;
      box-shadow: 0 0 8px rgba(255, 42, 42, 0.5);
      transition: background 0.2s;
    }

    /* Анімація перетворення бургера в хрестик */
    .burger-btn {
      background: transparent;
      border: none;
      width: 32px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 102;
    }
    .burger-btn span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: #ff2a2a;
      border-radius: 2px;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 0 6px rgba(255, 42, 42, 0.4);
    }
    .burger-btn.open span:nth-child(1) {
      transform: translateY(10.5px) rotate(45deg);
    }
    .burger-btn.open span:nth-child(2) {
      opacity: 0;
    }
    .burger-btn.open span:nth-child(3) {
      transform: translateY(-10.5px) rotate(-45deg);
    }

    /* Меню */
    .side-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 280px;
      height: 100%;
      background-color: #121212;
      border-left: 1px solid rgba(255, 42, 42, 0.2);
      box-shadow: -10px 0 30px rgba(0,0,0,0.9);
      z-index: 101;
      padding: 90px 30px 30px;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .side-menu.active {
      right: 0;
    }
    .side-menu ul {
      list-style: none;
    }
    .side-menu li {
      margin-bottom: 24px;
    }
    .side-menu a {
      color: #e0e0e0;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .side-menu a:hover {
      color: #ff2a2a;
    }

    /* 3. Головна секція з плавним виходом YYO KAI */
    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 20px 20px;
      background: radial-gradient(circle at center, #2e0808 0%, #080808 70%);
    }

    .logo-text {
      font-size: 3.8rem;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 42, 42, 0.4);
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      animation: logoFadeIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes logoFadeIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .subtitle {
      color: #888;
      font-size: 0.85rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-top: 20px;
    }

    /* 4. Генератор професійного трансферу */
    .stencil-section {
      max-width: 950px;
      margin: 0 auto;
      padding: 20px 20px 80px;
    }
    .upload-box {
      border: 2px dashed rgba(255, 42, 42, 0.5);
      background: #111;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .upload-box:hover {
      border-color: #ff2a2a;
      background: #180a0a;
    }
    .upload-box input {
      display: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin: 25px 0;
      background: #121212;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #222;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-group label {
      font-size: 0.85rem;
      color: #aaa;
    }
    .control-group input[type="range"] {
      accent-color: #ff2a2a;
    }

    .canvas-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }
    .canvas-container {
      flex: 1 1 320px;
      max-width: 450px;
      background: #111;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #222;
      text-align: center;
    }
    .canvas-container h4 {
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #777;
      letter-spacing: 1px;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 4px;
      background: #ffffff;
    }

    .btn-download {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 30px auto 0;
      padding: 16px;
      background: #ff2a2a;
      color: #fff;
      font-weight: bold;
      letter-spacing: 1px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 42, 42, 0.4);
      transition: background 0.2s;
    }
    .btn-download:hover {
      background: #e02222;
    }
  </style>
</head>
<body>

  <header>
    <div class="audio-header-control">
      <span>МУЗИКА</span>
      <button class="music-btn" id="musicToggle" onclick="toggleAudio()">УВІМК</button>
    </div>

    <button class="burger-btn" id="burgerBtn" onclick="toggleMenu()" aria-label="Меню">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <div class="side-menu" id="sideMenu">
    <ul>
      <li><a href="#hero">Головна</a></li>
      <li><a href="#stencil">Генератор трансферу</a></li>
      <li><a href="#portfolio">Портфоліо</a></li>
      <li><a href="#contacts">Контакти</a></li>
    </ul>
  </div>

  <section class="hero" id="hero">
    <div class="logo-text">
      YYO<br />KAI
    </div>
    <div class="subtitle">ПОРТФОЛІО &amp; СТУДІЯ СТЕНСИЛІВ</div>
  </section>

  <section class="stencil-section" id="stencil">
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <p style="font-size: 1.1rem; font-weight: bold;">Натисніть або перетягніть фото / портрет</p>
      <p style="font-size: 0.8rem; color: #777; margin-top: 5px;">Підтримує JPG, PNG</p>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="threshold">Чіткість деталей (Поріг): <span id="threshVal">35</span></label>
        <input type="range" id="threshold" min="10" max="80" value="35" />
      </div>
      <div class="control-group">
        <label for="detail">Контраст портрета: <span id="detailVal">1.2</span></label>
        <input type="range" id="detail" min="0.5" max="2.5" step="0.1" value="1.2" />
      </div>
    </div>

    <div class="canvas-wrapper">
      <div class="canvas-container">
        <h4>ОРИГІНАЛ</h4>
        <canvas id="origCanvas"></canvas>
      </div>
      <div class="canvas-container">
        <h4>ГОТОВИЙ ТРАНСФЕР</h4>
        <canvas id="stencilCanvas"></canvas>
      </div>
    </div>

    <button class="btn-download" id="downloadBtn" style="display: none;" onclick="downloadStencil()">ЗАВАНТАЖИТИ ТРАНСФЕР</button>
  </section>

  <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=deep-space-110258.mp3"></audio>

  <script>
    // 1. Анімація кнопки-бургера та відкриття меню
    function toggleMenu() {
      const burger = document.getElementById('burgerBtn');
      const menu = document.getElementById('sideMenu');
      burger.classList.toggle('open');
      menu.classList.toggle('active');
    }

    // 2. Вмикання музики зверху та автозапуск при першому дотику
    const audio = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicToggle');
    let hasInteracted = false;

    document.body.addEventListener('click', () => {
      if (!hasInteracted) {
        audio.play().then(() => {
          musicBtn.innerText = 'ВИМК';
        }).catch(() => {});
        hasInteracted = true;
      }
    }, { once: true });

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        musicBtn.innerText = 'ВИМК';
      } else {
        audio.pause();
        musicBtn.innerText = 'УВІМК';
      }
    }

    // 3. Професійний алгоритм обробки контурів (Adaptive Sobel + Contrast)
    const fileInput = document.getElementById('fileInput');
    const origCanvas = document.getElementById('origCanvas');
    const stencilCanvas = document.getElementById('stencilCanvas');
    const origCtx = origCanvas.getContext('2d');
    const stencilCtx = stencilCanvas.getContext('2d');

    const threshInput = document.getElementById('threshold');
    const detailInput = document.getElementById('detail');
    let loadedImg = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImg = new Image();
        loadedImg.onload = () => {
          const maxDim = 1400;
          let w = loadedImg.width;
          let h = loadedImg.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          origCanvas.width = stencilCanvas.width = w;
          origCanvas.height = stencilCanvas.height = h;

          origCtx.drawImage(loadedImg, 0, 0, w, h);
          processStencil();
          document.getElementById('downloadBtn').style.display = 'block';
        };
        loadedImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    threshInput.addEventListener('input', (e) => {
      document.getElementById('threshVal').innerText = e.target.value;
      if (loadedImg) processStencil();
    });

    detailInput.addEventListener('input', (e) => {
      document.getElementById('detailVal').innerText = e.target.value;
      if (loadedImg) processStencil();
    });

    function processStencil() {
      const w = origCanvas.width;
      const h = origCanvas.height;
      const srcData = origCtx.getImageData(0, 0, w, h);
      const src = srcData.data;

      const contrast = parseFloat(detailInput.value);
      const threshold = parseInt(threshInput.value);

      // 1. Градієнт сірого з підсиленням контрасту для портретів
      const gray = new Float32Array(w * h);
      for (let i = 0; i < src.length; i += 4) {
        let g = 0.299 * src[i] + 0.587 * src[i + 1] + 0.114 * src[i + 2];
        g = ((g / 255 - 0.5) * contrast + 0.5) * 255;
        gray[i / 4] = Math.min(255, Math.max(0, g));
      }

      // 2. Двовимірне виділення контурів оператором Собеля
      const output = stencilCtx.createImageData(w, h);
      const outData = output.data;

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;

          const gx =
            -gray[idx - w - 1] + gray[idx - w + 1]
            - 2 * gray[idx - 1] + 2 * gray[idx + 1]
            - gray[idx + w - 1] + gray[idx + w + 1];

          const gy =
            -gray[idx - w - 1] - 2 * gray[idx - w] - gray[idx - w + 1]
            + gray[idx + w - 1] + 2 * gray[idx + w] + gray[idx + w + 1];

          const mag = Math.sqrt(gx * gx + gy * gy);
          const outIdx = idx * 4;

          // Отримання чітких чорних ліній на чистому білому тлі
          const isEdge = mag > threshold;
          const val = isEdge ? 0 : 255;

          outData[outIdx] = val;
          outData[outIdx + 1] = val;
          outData[outIdx + 2] = val;
          outData[outIdx + 3] = 255;
        }
      }
      stencilCtx.putImageData(output, 0, 0);
    }

    function downloadStencil() {
      const link = document.createElement('a');
      link.download = 'yyokai-stencil.png';
      link.href = stencilCanvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>

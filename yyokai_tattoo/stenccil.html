<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YYOKAI — Stencil Generator</title>
  <style>
    /* 1. Сброс и жесткое ограничение скролла по горизонтали */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: #080808;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 2. Верхняя панель и Бургер-меню */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 18px 24px;
      z-index: 100;
      background: linear-gradient(180deg, rgba(8,8,8,0.9) 0%, rgba(8,8,8,0) 100%);
    }
    .burger-btn {
      background: transparent;
      border: 1px solid #ff2a2a;
      color: #ff2a2a;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 42, 42, 0.3);
      transition: all 0.3s ease;
    }
    .burger-btn span {
      width: 22px;
      height: 2px;
      background-color: #ff2a2a;
      border-radius: 2px;
    }

    /* Выдвижное меню */
    .side-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 280px;
      height: 100%;
      background-color: #121212;
      border-left: 1px solid #ff2a2a33;
      box-shadow: -5px 0 25px rgba(0,0,0,0.8);
      z-index: 101;
      padding: 80px 24px 24px;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .side-menu.active {
      right: 0;
    }
    .side-menu ul {
      list-style: none;
    }
    .side-menu li {
      margin-bottom: 20px;
    }
    .side-menu a {
      color: #ccc;
      text-decoration: none;
      font-size: 1.1rem;
      transition: color 0.2s;
    }
    .side-menu a:hover {
      color: #ff2a2a;
    }
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: #ff2a2a;
      font-size: 1.8rem;
      cursor: pointer;
    }

    /* 3. Переключатель музыки */
    .audio-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99;
      background: rgba(18, 18, 18, 0.85);
      border: 1px solid #ff2a2a55;
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    .music-btn {
      background: #ff2a2a;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(255, 42, 42, 0.5);
    }

    /* 4. Главный блок Hero с мягким выходом логотипа */
    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: radial-gradient(circle at center, #2a0808 0%, #080808 70%);
    }

    /* Анимация плавного появления и подъема логотипа */
    .logo-container {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      animation: logoFadeIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-bottom: 15px;
    }
    .logo-container img {
      max-width: 260px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(255, 42, 42, 0.4));
    }
    .subtitle {
      color: #888;
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 10px;
    }

    @keyframes logoFadeIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 5. Инструмент генерации трансфера */
    .stencil-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 20px 100px;
    }
    .upload-box {
      border: 2px dashed #ff2a2a88;
      background: #121212;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s;
    }
    .upload-box:hover {
      border-color: #ff2a2a;
      background: #1a0d0d;
    }
    .upload-box input {
      display: none;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 25px 0;
      background: #121212;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #222;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-group label {
      font-size: 0.85rem;
      color: #aaa;
    }
    .control-group input[type="range"] {
      accent-color: #ff2a2a;
    }
    .canvas-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }
    .canvas-container {
      flex: 1 1 300px;
      max-width: 450px;
      background: #111;
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #222;
      text-align: center;
    }
    .canvas-container h4 {
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #888;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 4px;
      background: #fff;
    }
    .btn-download {
      display: inline-block;
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      background: #ff2a2a;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 42, 42, 0.4);
      transition: background 0.2s;
    }
    .btn-download:hover {
      background: #e02222;
    }
  </style>
</head>
<body>

  <header>
    <button class="burger-btn" onclick="toggleMenu()" aria-label="Открыть меню">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <div class="side-menu" id="sideMenu">
    <button class="close-btn" onclick="toggleMenu()">&times;</button>
    <ul>
      <li><a href="#hero">Главная</a></li>
      <li><a href="#stencil">Генератор трансфера</a></li>
      <li><a href="#landings">Мои Лендинги</a></li>
      <li><a href="#contacts">Контакты</a></li>
    </ul>
  </div>

  <section class="hero" id="hero">
    <div class="logo-container">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 120'><text x='50%' y='45%' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='42' text-anchor='middle'>YYO</text><text x='50%' y='85%' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='42' text-anchor='middle'>KAI</text></svg>" alt="YYOKAI Logo" />
    </div>
    <div class="subtitle">ПОРТФОЛИО &amp; СТЕНСИЛ СТУДИЯ</div>
  </section>

  <section class="stencil-section" id="stencil">
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <p style="font-size: 1.1rem; font-weight: bold;">Нажмите или перетащите эскиз / фото портрета</p>
      <p style="font-size: 0.8rem; color: #777; margin-top: 5px;">Поддерживает JPG, PNG</p>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="threshold">Детализация (Порог): <span id="threshVal">120</span></label>
        <input type="range" id="threshold" min="30" max="220" value="120" />
      </div>
      <div class="control-group">
        <label for="blur">Сглаживание теней: <span id="blurVal">1</span></label>
        <input type="range" id="blur" min="0" max="4" value="1" />
      </div>
    </div>

    <div class="canvas-wrapper">
      <div class="canvas-container">
        <h4>ОРИГИНАЛ</h4>
        <canvas id="origCanvas"></canvas>
      </div>
      <div class="canvas-container">
        <h4>ГОТОВЫЙ ТРАНСФЕР</h4>
        <canvas id="stencilCanvas"></canvas>
      </div>
    </div>

    <button class="btn-download" id="downloadBtn" style="display: none;" onclick="downloadStencil()">CКАЧАТЬ ТРАНСФЕР</button>
  </section>

  <div class="audio-control">
    <span>МУЗЫКА</span>
    <button class="music-btn" id="musicToggle" onclick="toggleAudio()">ВКЛ</button>
  </div>

  <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script>
    // 1. Управление меню
    function toggleMenu() {
      document.getElementById('sideMenu').classList.toggle('active');
    }

    // 2. Логика автозапуска музыки при первом клике
    const audio = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicToggle');
    let hasInteracted = false;

    document.body.addEventListener('click', () => {
      if (!hasInteracted) {
        audio.play().then(() => {
          musicBtn.innerText = 'ВЫКЛ';
        }).catch(() => {});
        hasInteracted = true;
      }
    }, { once: true });

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        musicBtn.innerText = 'ВЫКЛ';
      } else {
        audio.pause();
        musicBtn.innerText = 'ВКЛ';
      }
    }

    // 3. Алгоритм подготовки стенсила для портретов и сложных работ
    const fileInput = document.getElementById('fileInput');
    const origCanvas = document.getElementById('origCanvas');
    const stencilCanvas = document.getElementById('stencilCanvas');
    const origCtx = origCanvas.getContext('2d');
    const stencilCtx = stencilCanvas.getContext('2d');
    
    const threshInput = document.getElementById('threshold');
    const blurInput = document.getElementById('blur');
    let loadedImg = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImg = new Image();
        loadedImg.onload = () => {
          // Масштабирование кадра под стандартное разрешение
          const maxDim = 1200;
          let w = loadedImg.width;
          let h = loadedImg.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          origCanvas.width = stencilCanvas.width = w;
          origCanvas.height = stencilCanvas.height = h;

          origCtx.drawImage(loadedImg, 0, 0, w, h);
          processStencil();
          document.getElementById('downloadBtn').style.display = 'block';
        };
        loadedImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    threshInput.addEventListener('input', (e) => {
      document.getElementById('threshVal').innerText = e.target.value;
      if (loadedImg) processStencil();
    });

    blurInput.addEventListener('input', (e) => {
      document.getElementById('blurVal').innerText = e.target.value;
      if (loadedImg) processStencil();
    });

    // Обработка изображения фильтром Sobel (четкие линии деталей)
    function processStencil() {
      const w = origCanvas.width;
      const h = origCanvas.height;
      const srcData = origCtx.getImageData(0, 0, w, h);
      const src = srcData.data;
      
      // Оттенки серого
      const gray = new Float32Array(w * h);
      for (let i = 0; i < src.length; i += 4) {
        gray[i / 4] = 0.299 * src[i] + 0.587 * src[i + 1] + 0.114 * src[i + 2];
      }

      // Однопроходный оператор Собеля для градиента
      const output = stencilCtx.createImageData(w, h);
      const outData = output.data;
      const threshold = parseInt(threshInput.value);

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;

          // Матрица Собеля X и Y
          const gx =
            -gray[idx - w - 1] + gray[idx - w + 1]
            - 2 * gray[idx - 1] + 2 * gray[idx + 1]
            - gray[idx + w - 1] + gray[idx + w + 1];

          const gy =
            -gray[idx - w - 1] - 2 * gray[idx - w] - gray[idx - w + 1]
            + gray[idx + w - 1] + 2 * gray[idx + w] + gray[idx + w + 1];

          const mag = Math.sqrt(gx * gx + gy * gy);
          const outIdx = idx * 4;

          // Инвертированные линии (черный контур на белом фоне)
          const val = mag > (255 - threshold) ? 0 : 255;

          outData[outIdx] = val;
          outData[outIdx + 1] = val;
          outData[outIdx + 2] = val;
          outData[outIdx + 3] = 255;
        }
      }
      stencilCtx.putImageData(output, 0, 0);
    }

    function downloadStencil() {
      const link = document.createElement('a');
      link.download = 'yyokai-stencil.png';
      link.href = stencilCanvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>

# Безкоштовні «серверні» задачі INKAI на GitHub Actions (замість платних Cloud Functions)
name: inkai-jobs
on:
  schedule:
    - cron: "*/15 * * * *"      # кожні 15 хв; скрипт сам вирішує, що саме зараз робити (за київським часом)
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd scripts && npm i --silent
      - run: node scripts/jobs.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}

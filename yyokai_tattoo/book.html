<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YYOKAI | Запис на тату</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--accent:#e5092f;--line:rgba(255,255,255,.14)}
html,body{background:#000}
body{color:#f6f1ef;font:14px/1.45 Arial,sans-serif;min-height:100vh;overflow-x:hidden;
 background:radial-gradient(circle at 50% -10%,rgba(229,9,47,.38),transparent 38%),linear-gradient(180deg,#050505 0%,#100206 45%,#000 100%)}
body::before{content:"妖 鬼 狐 墨 夜 予約";position:fixed;inset:0;z-index:0;pointer-events:none;color:rgba(255,255,255,.022);font-size:70px;letter-spacing:26px;line-height:1.5;transform:rotate(-12deg) scale(1.15)}
.w{position:relative;z-index:1;width:100%;max-width:480px;margin:auto;padding:14px 14px 40px}
.back{position:absolute;left:14px;top:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:#fff;font-size:24px;line-height:1;padding-bottom:3px;background:rgba(0,0,0,.6);border:1px solid var(--line);backdrop-filter:blur(10px);z-index:5}
.logo{position:relative;width:max-content;margin:4px auto 0;font-size:28px;font-weight:900;letter-spacing:.12em;color:#fff;text-shadow:0 0 22px rgba(229,9,47,.55)}
.logo::before,.logo::after{content:"YYOKAI";position:absolute;inset:0;opacity:.34;pointer-events:none}
.logo::before{color:var(--accent);animation:gA 2.8s infinite}
.logo::after{color:#fff;animation:gB 3.3s infinite reverse}
@keyframes gA{0%,92%,100%{clip-path:inset(0);transform:none}93%{clip-path:inset(12% 0 64% 0);transform:translate(-2px,1px)}95%{clip-path:inset(60% 0 18% 0);transform:translate(2px,-1px)}97%{clip-path:inset(30% 0 38% 0);transform:translate(-1px,0)}}
@keyframes gB{0%,94%,100%{clip-path:inset(0);transform:none}95%{clip-path:inset(44% 0 30% 0);transform:translate(1px,0)}97%{clip-path:inset(15% 0 58% 0);transform:translate(-1px,0)}}
.sub{text-align:center;color:#bdb3b0;margin:8px auto 12px;font-size:12.5px}
.card{position:relative;overflow:hidden;margin-top:10px;padding:14px;border-radius:22px;
 background:radial-gradient(circle at 85% 0%,rgba(229,9,47,.2),transparent 38%),linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
 border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px)}
.step{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.step:first-child{margin-top:0}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--accent);box-shadow:0 0 12px rgba(229,9,47,.6)}
label{display:block;color:#999;font-size:11px;font-weight:800;margin:10px 0 5px}
input,textarea{display:block;width:100%;min-width:0;max-width:100%;border-radius:13px;padding:10px 12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.45);color:#fff;font-size:16px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(229,9,47,.15)}
textarea{min-height:76px;resize:vertical}
input[type=file]{padding:8px;font-size:13px;color:#aaa}
input[type=file]::file-selector-button{margin-right:10px;border:0;border-radius:999px;padding:7px 13px;background:#fff;color:#050505;font-weight:800;font-size:12px;font-family:inherit}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .ch b{font-size:14px;text-transform:capitalize}
.cal .ch button{width:32px;height:32px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-size:18px}
.cal .ch button:disabled{opacity:.25}
.wk7,.cd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk7 span{text-align:center;color:#777;font-size:10px;font-weight:800;margin-bottom:2px}
.cd button{aspect-ratio:1;border-radius:11px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#fff;font-weight:800;font-size:13px}
.cd button.sel{background:var(--accent);border-color:var(--accent);box-shadow:0 0 16px rgba(229,9,47,.5)}
.cd button.x{color:#666;text-decoration:line-through;background:repeating-linear-gradient(45deg,rgba(255,255,255,.02),rgba(255,255,255,.02) 4px,rgba(255,255,255,.07) 4px,rgba(255,255,255,.07) 8px)}
.cd button:disabled{cursor:default}.cd button.past{opacity:.2;text-decoration:none}
.cd i{visibility:hidden}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.hint{width:100%;text-align:center;color:#888;font-size:12px}
.slot{min-width:92px;padding:10px 4px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-weight:800;font-size:14px}
.slot.sel{background:var(--accent);border-color:var(--accent);box-shadow:0 0 16px rgba(229,9,47,.5)}
.slot:disabled{opacity:.3;text-decoration:line-through}
.phone{display:flex;align-items:stretch;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.45);overflow:hidden}
.phone:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(229,9,47,.15)}
.phone span{display:grid;place-items:center;padding:0 10px 0 12px;font-weight:800;font-size:15px;background:rgba(229,9,47,.22);border-right:1px solid rgba(255,255,255,.12)}
.phone input{border:0;border-radius:0;background:transparent;box-shadow:none!important}
.btn{width:100%;margin-top:16px;border:0;border-radius:999px;padding:13px;background:#fff;color:#050505;font-weight:900;font-size:14px;letter-spacing:.03em}
.btn:disabled{opacity:.5}
.msg{margin-top:10px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid rgba(229,9,47,.4);display:none;font-size:13px}
.req{display:flex;gap:11px;align-items:center;padding:11px 12px;margin-top:8px;border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,rgba(0,0,0,.3))}
.req .ic{font-size:26px;line-height:1}
.req b{display:block;font-size:13px}
.req .tx{margin-top:2px;font-size:13px;font-weight:800;color:var(--c)}
.req .nt{margin-top:4px;font-size:12px;color:#ddd}
.req.pulse .ic{animation:pl 1.6s infinite}
@keyframes pl{50%{transform:scale(1.15)}}
.again{display:none;width:100%;margin-top:10px;border:1px solid var(--line);border-radius:999px;padding:12px;background:rgba(255,255,255,.07);color:#fff;font-weight:800;font-size:13px}
.fh{color:#777;font-size:11px;margin-top:5px}
.hp{position:absolute;left:-9999px}

label.c{text-align:center;margin:12px 0 8px}
.dt{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.45);color:#fff;font-size:14px;text-align:left}
.dt b{flex:1;font-weight:600;color:#aaa}.dt.has b{color:#fff;font-weight:800}
.dt em{font-style:normal;color:#aaa;transition:.2s}.dt.open em{transform:rotate(180deg)}
.dt.open{border-color:var(--accent)}
.dtp{display:none;margin-top:8px;padding:12px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08)}
.dtp.open{display:block;animation:sd .25s ease}
@keyframes sd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.req{flex-wrap:wrap}
.pay{flex-basis:100%;padding:11px 12px;border-radius:14px;background:rgba(0,0,0,.4);border:1px dashed rgba(255,255,255,.22);font-size:12.5px;line-height:1.5;color:#e8e0dd}
.pay h4{font-size:13.5px;color:#fff;margin-bottom:3px}
.cr{display:flex;align-items:center;gap:8px;margin:8px 0;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.08)}
.cr code{flex:1;font:700 15px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.05em;color:#fff}
.cr button{border:0;border-radius:999px;padding:7px 13px;background:#fff;color:#050505;font-weight:800;font-size:12px;white-space:nowrap}
.pay .ok{display:block;margin-top:6px;color:#bdb3b0}
</style>

</head>
<body>
<div class="w">
  <a class="back" href="./" aria-label="На головну">‹</a>
  <div class="logo">YYOKAI</div>
  <div class="sub">Заявка на тату · майстер підтвердить запис</div>

  <div class="card" id="mine" style="display:none"><div class="step"><i>✓</i>Мої заявки</div><div id="mineList"></div></div>
  <button class="again" id="again" onclick="again()">＋ Нова заявка</button>

  <div class="card" id="formCard">
    <div class="step"><i>1</i>Дата і час</div>
    <button class="dt" id="dt" onclick="toggleDT()"><span>📅</span><b id="dtv">Обери дату і час</b><em>▾</em></button>
    <div class="dtp" id="dtp">
      <div class="cal">
        <div class="ch"><button id="pm" onclick="cm(-1)">‹</button><b id="cmt"></b><button onclick="cm(1)">›</button></div>
        <div class="wk7"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Нд</span></div>
        <div class="cd" id="cd"></div>
      </div>
      <label class="c">Вільний час</label>
      <div class="slots" id="slots"><span class="hint">Завантаження…</span></div>
    </div>

    <div class="step"><i>2</i>Контакти</div>
    <label style="margin-top:0">Імʼя *</label><input id="name" autocomplete="name">
    <label>Телефон *</label>
    <div class="phone"><span>+380</span><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="XX XXX XX XX" maxlength="12"></div>
    <label>Нік Telegram / Instagram</label><input id="contact" placeholder="@username">

    <div class="step"><i>3</i>Ідея</div>
    <label style="margin-top:0">Місце на тілі та розмір</label><input id="place" placeholder="Рука, 10x15 см">
    <label>Ідея тату</label><textarea id="idea" placeholder="Стиль, референси, побажання..."></textarea>
    <label>Фото / референси (до 3)</label><input id="photo" type="file" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif" onchange="chkPhotos()">
    <div class="fh" id="pcount">До 3 фото, кожне до 50 MB</div>

    <input class="hp" id="hp" tabindex="-1" autocomplete="off">
    <button class="btn" id="go" onclick="send()">Надіслати заявку</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const SB_URL="https://jtilygljejobpljcfqrd.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWx5Z2xqZWpvYnBsamNmcXJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MjAwNTEsImV4cCI6MjExMTE5NjA1MX0.crPkRj0M5DV8kFbCU6i07P5uK71Oe54IuXfbI57bHeQ";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const ST={
  pending:["⏳","Очікуйте відповіді від майстра","#ff9f1c"],
  waiting:["💳","Очікуємо передоплату","#ffd166"],
  confirmed:["✅","Запис підтверджено, чекаємо тебе!","#7dffb1"],
  in_progress:["🎨","Сеанс у процесі","#8ecbff"],
  done:["✔️","Сеанс проведено. Дякуємо!","#b7ff7a"],
  cancelled:["❌","Запис скасовано майстром","#ff6b7a"]};
const PAY={card:"4149609059817330",amount:500};
let SL=["11:00","13:00","16:00"],view=new Date(),sel=null,picked=null,busyM=[];
view=new Date(view.getFullYear(),view.getMonth(),1);

function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function say(t){const m=$("msg");m.textContent=t;m.style.display="block"}
const today=fmt(new Date());
function nowT(){const n=new Date();return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0")}

$("phone").addEventListener("input",e=>{
  let v=e.target.value.replace(/\D/g,"");
  if(v.startsWith("380"))v=v.slice(3);else if(v.startsWith("0"))v=v.slice(1);
  v=v.slice(0,9);
  e.target.value=[v.slice(0,2),v.slice(2,5),v.slice(5,7),v.slice(7,9)].filter(Boolean).join(" ");
});

function busySet(k){return new Set(busyM.filter(x=>x.date===k).map(x=>x.time))}
function freeSlots(k){
  const set=busySet(k);if(set.has(null))return [];
  return SL.filter(s=>!set.has(s)&&!(k===today&&s<=nowT()));
}

async function loadMonth(auto){
  const y=view.getFullYear(),m=view.getMonth();
  const {data,error}=await sb.rpc("busy_slots",{d1:fmt(new Date(y,m,1)),d2:fmt(new Date(y,m+1,0))});
  if(error){say("Не вдалося завантажити календар: "+error.message);return}
  busyM=data||[];
  if(auto&&!sel){
    for(let d=new Date(Math.max(new Date(),new Date(y,m,1)));d.getMonth()===m;d.setDate(d.getDate()+1)){
      if(freeSlots(fmt(d)).length){sel=fmt(d);break}
    }
  }
  renderCal();renderSlots();
}
function renderCal(){
  const y=view.getFullYear(),m=view.getMonth();
  $("cmt").textContent=view.toLocaleDateString("uk-UA",{month:"long",year:"numeric"});
  $("pm").disabled=(y===new Date().getFullYear()&&m===new Date().getMonth());
  const lead=(new Date(y,m,1).getDay()||7)-1,days=new Date(y,m+1,0).getDate();
  let h="";for(let i=0;i<lead;i++)h+="<i></i>";
  for(let d=1;d<=days;d++){
    const k=fmt(new Date(y,m,d)),past=k<today,free=past?[]:freeSlots(k);
    const cls=(past?"past ":"")+(!past&&!free.length?"x ":"")+(k===sel?"sel":"");
    h+=`<button class="${cls}" ${free.length?`onclick="pick('${k}')"`:"disabled"}>${d}</button>`;
  }
  $("cd").innerHTML=h;
}
function pick(k){sel=k;picked=null;$("msg").style.display="none";renderCal();renderSlots();updDT()}
function cm(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);sel=null;picked=null;updDT();loadMonth(true)}
function toggleDT(o){const p=$("dtp"),b=$("dt"),v=o===undefined?!p.classList.contains("open"):o;p.classList.toggle("open",v);b.classList.toggle("open",v)}
function updDT(){
  const b=$("dt");
  if(sel&&picked){$("dtv").textContent=new Date(sel+"T00:00").toLocaleDateString("uk-UA",{weekday:"short",day:"numeric",month:"long"})+" · "+picked;b.classList.add("has")}
  else{$("dtv").textContent="Обери дату і час";b.classList.remove("has")}
}
function chkPhotos(){
  const inp=$("photo");let fl=[...inp.files];
  if(fl.length>3){
    try{const dt=new DataTransfer();fl.slice(0,3).forEach(f=>dt.items.add(f));inp.files=dt.files}catch(e){}
    fl=fl.slice(0,3);say("Максимум 3 фото, обрано перші 3.");
  }
  $("pcount").textContent=fl.length?"Обрано: "+fl.length+" з 3":"До 3 фото, кожне до 50 MB";
}
function renderSlots(){
  const box=$("slots");
  if(!sel){box.innerHTML='<span class="hint">Обери дату у календарі. Закреслені дні недоступні.</span>';return}
  const set=busySet(sel);
  box.innerHTML="";
  SL.forEach(s=>{
    const b=document.createElement("button");b.className="slot"+(s===picked?" sel":"");b.textContent=s;
    b.disabled=set.has(s)||set.has(null)||(sel===today&&s<=nowT());
    b.onclick=()=>{picked=s;renderSlots();updDT();setTimeout(()=>toggleDT(false),250)};
    box.appendChild(b);
  });
}

async function send(){
  if($("hp").value)return;
  const name=$("name").value.trim(),digits=$("phone").value.replace(/\D/g,"");
  if(!sel||!picked){toggleDT(true);return say("Обери дату і час.")}
  if(name.length<2)return say("Вкажи імʼя.");
  if(digits.length!==9)return say("Введи номер повністю: 9 цифр після +380.");
  $("go").disabled=true;say("Надсилаю...");
  try{
    const urls=[],files=[...$("photo").files].slice(0,3);
    for(let i=0;i<files.length;i++){
      const f=files[i];
      if(f.size>50*1024*1024)throw new Error("Фото більше 50 MB");
      say("Завантажую фото "+(i+1)+" з "+files.length+"…");
      const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
      const path=crypto.randomUUID()+"."+ext;
      const up=await sb.storage.from("refs").upload(path,f,{contentType:f.type||"image/jpeg"});
      if(up.error)throw up.error;
      urls.push(sb.storage.from("refs").getPublicUrl(path).data.publicUrl);
    }
    say("Надсилаю...");
    const {data,error}=await sb.rpc("create_request",{
      p_date:sel,p_time:picked,p_name:name,p_phone:"+380"+digits,
      p_telegram:$("contact").value.trim(),p_instagram:"",
      p_placement:$("place").value.trim(),p_size:"",p_idea:$("idea").value.trim(),p_photo_url:urls[0]||null,p_photos:urls.length?urls:null
    });
    if(error)throw error;
    const list=JSON.parse(localStorage.getItem("yyokai_req")||"[]");
    list.unshift({id:data,date:sel,time:picked,name});
    localStorage.setItem("yyokai_req",JSON.stringify(list.slice(0,10)));
    $("name").value=$("phone").value=$("contact").value=$("place").value=$("idea").value=$("photo").value="";
    $("msg").style.display="none";picked=null;updDT();$("pcount").textContent="До 3 фото, кожне до 50 MB";
    $("formCard").style.display="none";$("again").style.display="block";
    await showMine();
    window.scrollTo({top:0,behavior:"smooth"});
    loadMonth(false);
  }catch(e){
    const m=e.message||"";
    say(m.includes("slot_taken")?"Цей час щойно зайняли, обери інший.":m.includes("slot_closed")?"Цей час закритий.":"Не вдалося надіслати: "+m);
    loadMonth(false);
  }
  $("go").disabled=false;
}
function again(){$("formCard").style.display="block";$("again").style.display="none";window.scrollTo({top:$("formCard").offsetTop-10,behavior:"smooth"})}

function copyCard(btn){
  const t=PAY.card,done=()=>{btn.textContent="Скопійовано ✓";setTimeout(()=>btn.textContent="Копіювати",2200)};
  const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){btn.textContent=t}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb();
}
function payHtml(r){
  const d=r.date.slice(8)+"."+r.date.slice(5,7),purpose=(r.name?r.name:"Імʼя")+", "+d+", "+r.time;
  const c=PAY.card.replace(/(\d{4})(?=\d)/g,"$1 ");
  return `<div class="pay"><h4>💳 Передоплата ${PAY.amount} грн</h4>
    Для підтвердження запису внесіть передоплату. Це не додаткова плата: сума повністю зараховується у вартість сеансу.
    <div class="cr"><code>${c}</code><button onclick="copyCard(this)">Копіювати</button></div>
    У призначенні платежу вкажіть імʼя, дату та час сеансу: <b>${esc(purpose)}</b>
    <span class="ok">Після оплати майстер підтвердить дату і час, статус зміниться тут.</span></div>`;
}
let lastMine="";
async function showMine(){
  const list=JSON.parse(localStorage.getItem("yyokai_req")||"[]");
  if(!list.length)return;
  const rows=await Promise.all(list.map(async r=>{
    const {data}=await sb.rpc("get_status",{p_id:r.id});
    const x=data&&data[0];
    if(!x)return "";
    const [ic,tx,c]=ST[x.status]||["•",x.status,"#fff"];
    return `<div class="req ${x.status==="pending"?"pulse":""}" style="--c:${c}"><div class="ic">${ic}</div><div>
      <b>${r.date.split("-").reverse().join(".")} · ${esc(r.time)}</b><div class="tx">${tx}</div>
      ${x.note?`<div class="nt">${esc(x.note)}</div>`:""}</div>
      ${x.status==="pending"||x.status==="waiting"?payHtml(r):""}</div>`;
  }));
  const html=rows.join("");
  if(html&&html!==lastMine){lastMine=html;$("mineList").innerHTML=html;$("mine").style.display="block"}
}

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YYOKAI | Запис на тату</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--accent:#e5092f;--line:rgba(255,255,255,.15)}
html,body{background:#000}
body{color:#f6f1ef;font-family:Arial,sans-serif;min-height:100vh;overflow-x:hidden;
 background:radial-gradient(circle at 50% -10%,rgba(229,9,47,.42),transparent 38%),linear-gradient(180deg,#050505 0%,#100206 45%,#000 100%)}
body::before{content:"妖 鬼 狐 墨 夜 予約";position:fixed;inset:0;z-index:0;pointer-events:none;color:rgba(255,255,255,.025);font-size:78px;letter-spacing:30px;line-height:1.5;transform:rotate(-12deg) scale(1.15)}
.w{position:relative;z-index:1;width:100%;max-width:560px;margin:auto;padding:22px 16px 48px}
.logo{position:relative;width:max-content;margin:6px auto 0;font-size:40px;font-weight:950;letter-spacing:.12em;color:#fff;text-shadow:0 0 26px rgba(229,9,47,.55)}
.logo::before,.logo::after{content:"YYOKAI";position:absolute;inset:0;opacity:.34;pointer-events:none}
.logo::before{color:var(--accent);animation:gA 2.8s infinite}
.logo::after{color:#fff;animation:gB 3.3s infinite reverse}
@keyframes gA{0%,92%,100%{clip-path:inset(0);transform:none}93%{clip-path:inset(12% 0 64% 0);transform:translate(-2px,1px)}95%{clip-path:inset(60% 0 18% 0);transform:translate(2px,-1px)}97%{clip-path:inset(30% 0 38% 0);transform:translate(-1px,0)}}
@keyframes gB{0%,94%,100%{clip-path:inset(0);transform:none}95%{clip-path:inset(44% 0 30% 0);transform:translate(1px,0)}97%{clip-path:inset(15% 0 58% 0);transform:translate(-1px,0)}}
.sub{text-align:center;color:#cfc6c3;margin:12px auto 20px;font-size:15px;line-height:1.5}
.card{position:relative;overflow:hidden;margin-top:14px;padding:20px;border-radius:30px;
 background:radial-gradient(circle at 85% 0%,rgba(229,9,47,.24),transparent 36%),linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
 border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(20px);box-shadow:0 0 42px rgba(229,9,47,.1)}
.step{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.step:first-child{margin-top:0}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--accent);box-shadow:0 0 16px rgba(229,9,47,.6)}
label{display:block;color:#aaa;font-size:12px;font-weight:900;margin:14px 0 7px}
input,textarea{display:block;width:100%;min-width:0;max-width:100%;border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.45);color:#fff;font-size:16px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(229,9,47,.15)}
input[type=date]{height:54px;padding:0 14px;text-align:left;line-height:54px}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7}
textarea{min-height:100px;resize:vertical}
input[type=file]{padding:10px;font-size:14px;color:#aaa}
input[type=file]::file-selector-button{margin-right:12px;border:0;border-radius:999px;padding:10px 16px;background:#fff;color:#050505;font-weight:900;font-family:inherit}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.hint{grid-column:1/-1;color:#888;font-size:14px;padding:6px 0}
.slot{padding:14px 4px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-weight:900;font-size:15px;transition:.15s}
.slot.sel{background:var(--accent);border-color:var(--accent);box-shadow:0 0 22px rgba(229,9,47,.5)}
.slot:disabled{opacity:.22;text-decoration:line-through}
.btn{width:100%;margin-top:22px;border:0;border-radius:999px;padding:17px;background:#fff;color:#050505;font-weight:900;font-size:16px;letter-spacing:.04em}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.msg{margin-top:14px;padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(229,9,47,.4);display:none;font-size:14px;line-height:1.4}
.st{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px}
.st:last-child{border:0}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="w">
  <div class="logo">YYOKAI</div>
  <div class="sub">Заявка на тату · майстер підтвердить запис</div>

  <div class="card" id="mine" style="display:none"><div class="step"><i>✓</i>Мої заявки</div><div id="mineList"></div></div>

  <div class="card">
    <div class="step"><i>1</i>Дата і час</div>
    <input id="date" type="date">
    <label>Вільний час</label>
    <div class="slots" id="slots"><span class="hint">Завантаження…</span></div>

    <div class="step"><i>2</i>Контакти</div>
    <label style="margin-top:0">Імʼя *</label><input id="name" autocomplete="name">
    <label>Телефон *</label><input id="phone" type="tel" placeholder="+380..." autocomplete="tel">
    <label>Telegram / Instagram</label><input id="contact" placeholder="@username">

    <div class="step"><i>3</i>Ідея</div>
    <label style="margin-top:0">Місце на тілі та розмір</label><input id="place" placeholder="Рука, 10x15 см">
    <label>Ідея тату</label><textarea id="idea" placeholder="Стиль, референси, побажання..."></textarea>
    <label>Фото / референс</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp">

    <input class="hp" id="hp" tabindex="-1" autocomplete="off">
    <button class="btn" id="go" onclick="send()">Надіслати заявку</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
// ====== НАСТРОЙКИ (те ж, що в crm.html) ======
const SB_URL="https://jtilygljejobpljcfqrd.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWx5Z2xqZWpvYnBsamNmcXJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MjAwNTEsImV4cCI6MjExMTE5NjA1MX0.crPkRj0M5DV8kFbCU6i07P5uK71Oe54IuXfbI57bHeQ";
const SLOTS=["10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"];
// ============================================

const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const ST={pending:"⏳ Очікує підтвердження",waiting:"💳 Очікує передоплату",confirmed:"✅ Підтверджено",in_progress:"🎨 В процесі",done:"Завершено",cancelled:"❌ Скасовано"};
let picked=null,busy=[];

function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function say(t){const m=$("msg");m.textContent=t;m.style.display="block"}

const today=fmt(new Date());
$("date").min=today;$("date").value=today;
$("date").onchange=loadSlots;

async function loadSlots(){
  picked=null;const d=$("date").value;
  if(!d)return;
  const {data,error}=await sb.rpc("busy_slots",{d1:d,d2:d});
  if(error){say("Не вдалося завантажити час: "+error.message);return}
  busy=data||[];
  const dayOff=busy.some(x=>x.time===null);
  const now=new Date(),nowT=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  $("slots").innerHTML="";
  SLOTS.forEach(s=>{
    const b=document.createElement("button");b.className="slot";b.textContent=s;
    b.disabled=dayOff||busy.some(x=>x.time===s)||(d===today&&s<=nowT);
    b.onclick=()=>{picked=s;document.querySelectorAll(".slot").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")};
    $("slots").appendChild(b);
  });
  if(dayOff)say("На цю дату запису немає — обери іншу.");else $("msg").style.display="none";
}

async function send(){
  if($("hp").value)return;
  const name=$("name").value.trim(),phone=$("phone").value.trim();
  if(!picked)return say("Обери час.");
  if(name.length<2)return say("Вкажи імʼя.");
  if(phone.length<6)return say("Вкажи телефон.");
  $("go").disabled=true;say("Надсилаю...");
  try{
    let url=null;const f=$("photo").files[0];
    if(f){
      if(f.size>5*1024*1024)throw new Error("Фото більше 5 MB");
      const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
      const path=crypto.randomUUID()+"."+ext;
      const up=await sb.storage.from("refs").upload(path,f,{contentType:f.type});
      if(up.error)throw up.error;
      url=sb.storage.from("refs").getPublicUrl(path).data.publicUrl;
    }
    const c=$("contact").value.trim();
    const {data,error}=await sb.rpc("create_request",{
      p_date:$("date").value,p_time:picked,p_name:name,p_phone:phone,
      p_telegram:c.startsWith("@")&&!c.includes("insta")?c:c,p_instagram:"",
      p_placement:$("place").value.trim(),p_size:"",p_idea:$("idea").value.trim(),p_photo_url:url
    });
    if(error)throw error;
    const list=JSON.parse(localStorage.getItem("yyokai_req")||"[]");
    list.unshift({id:data,date:$("date").value,time:picked});
    localStorage.setItem("yyokai_req",JSON.stringify(list.slice(0,10)));
    say("Заявку надіслано ✓ Майстер звʼяжеться з тобою. Статус нижче.");
    $("name").value=$("phone").value=$("contact").value=$("place").value=$("idea").value=$("photo").value="";
    loadSlots();showMine();
  }catch(e){
    const m=e.message||"";
    say(m.includes("slot_taken")?"Цей час щойно зайняли — обери інший.":m.includes("slot_closed")?"Цей час закритий.":"Не вдалося надіслати: "+m);
    loadSlots();
  }
  $("go").disabled=false;
}

async function showMine(){
  const list=JSON.parse(localStorage.getItem("yyokai_req")||"[]");
  if(!list.length)return;
  $("mine").style.display="block";
  const rows=await Promise.all(list.map(async r=>{
    const {data}=await sb.rpc("get_status",{p_id:r.id});
    return `<div class="st"><span>${r.date} · ${r.time}</span><span>${ST[data]||"—"}</span></div>`;
  }));
  $("mineList").innerHTML=rows.join("");
}

loadSlots();showMine();
</script>
</body>
</html>

<style>
  :root{
    --black:#060605;
    --panel:#0e0e0d;
    --white:#f4f1ea;
    --white-dim:rgba(244,241,234,0.55);
    --red:#ff6a55;
    --red-deep:#a13324;
    --line:rgba(244,241,234,0.09);
    --ease:cubic-bezier(0.16,1,0.3,1);
    --gutter:clamp(20px,6vw,64px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;outline:none;-webkit-tap-highlight-color:transparent;}
  html{background:var(--black);scroll-behavior:smooth;overscroll-behavior-x:none;}
  body{background:var(--black);color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden;line-height:1.5;
    overscroll-behavior-x:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;max-width:100vw;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--red);color:var(--black);}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- фонові кандзі (оптимізовано — приглушено під бренд, не чистий #ff0000) ---------- */
  .matrix-bg{position:fixed;inset:0;font-family:'Noto Sans JP',sans-serif;font-size:16px;color:var(--red);opacity:.08;
    display:flex;justify-content:space-around;z-index:0;pointer-events:none;}
  .matrix-column{display:flex;flex-direction:column;animation:matrixDrop 16s linear infinite;}
  @keyframes matrixDrop{from{transform:translateY(-50%);}to{transform:translateY(0%);}}

  /* ---------- TOP BAR (як на решті сайту) ---------- */
  .menu-btn{position:fixed;top:26px;right:24px;z-index:2000;width:26px;height:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;}
  .menu-btn span{display:block;width:100%;height:1px;background:var(--white);transition:transform .35s var(--ease),opacity .35s;}
  .menu-btn.active span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
  .menu-btn.active span:nth-child(2){opacity:0;}
  .menu-btn.active span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

  .brand-mark{position:fixed;top:24px;left:24px;z-index:2000;font-family:'Unbounded',sans-serif;font-size:13px;letter-spacing:.04em;text-decoration:none;color:var(--white);}

  .sound-btn{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(14,14,13,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .3s,background .3s;}
  .sound-btn:hover{border-color:var(--red-deep);}
  .sound-btn svg{width:15px;height:15px;}
  .sound-btn .icon-off{display:none;}
  .sound-btn.muted .icon-on{display:none;}
  .sound-btn.muted .icon-off{display:block;}

  .nav-overlay{position:fixed;inset:0;background:var(--black);z-index:1999;display:flex;flex-direction:column;justify-content:center;padding:0 var(--gutter);transform:translateY(-102%);transition:transform .55s var(--ease);}
  .nav-overlay.active{transform:translateY(0);}
  .nav-overlay a{display:block;font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.5rem,6vw,2.6rem);color:var(--white-dim);text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line);transition:color .3s var(--ease),padding-left .3s var(--ease),text-shadow .3s var(--ease);}
  .nav-overlay a:hover,.nav-overlay a:focus-visible{color:var(--white);padding-left:14px;text-shadow:0 0 22px rgba(244,241,234,0.45);}
  .nav-foot{margin-top:30px;font-size:12px;color:var(--white-dim);}

  .cta-fixed{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--black);padding:16px 36px;border-radius:100px;text-decoration:none;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:600;z-index:1500;box-shadow:0 10px 30px rgba(255,106,85,.35);white-space:nowrap;transition:transform .25s var(--ease);}
  .cta-fixed:hover{transform:translateX(-50%) translateY(-2px);}

  /* ---------- HEADER ---------- */
  .page-head{position:relative;z-index:1;padding:100px var(--gutter) 10px;text-align:center;}
  .page-head .mono{font-size:11px;color:var(--red);}
  .page-head h1{font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.3rem,4vw,1.8rem);margin-top:8px;}
  .page-head p{color:var(--white-dim);font-size:.9rem;margin-top:8px;max-width:40ch;margin-left:auto;margin-right:auto;}

  /* ---------- ПРЕМІУМ 3D-КАРТКИ ---------- */
  .container{position:relative;z-index:1;display:flex;flex-direction:column;gap:130px;padding:60px var(--gutter) 140px;align-items:center;}

  .card-stage{width:min(320px,80vw);perspective:1400px;}
  .nft-card{
    position:relative;width:100%;aspect-ratio:320/450;display:block;text-decoration:none;
    border-radius:14px;overflow:hidden;transform-style:preserve-3d;
    border:1px solid var(--line);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(255,106,85,.05);
    transition:transform .5s var(--ease), box-shadow .5s var(--ease);
    animation:idleFloat 7s ease-in-out infinite;
  }
  .card-stage:nth-child(2n) .nft-card{animation-delay:-3.2s;}
  @keyframes idleFloat{0%,100%{transform:rotateY(-6deg) rotateX(2deg) translateZ(0);}50%{transform:rotateY(6deg) rotateX(-2deg) translateZ(10px);}}
  .card-stage.tilting .nft-card{animation-play-state:paused;}

  .layer{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none;}
  .layer-base{transform:translateZ(0);}
  .layer-glow{transform:translateZ(-30px) scale(1.15);filter:blur(22px) saturate(1.2);opacity:.55;}
  .layer-vignette{background:linear-gradient(to top,rgba(0,0,0,.65) 0%,transparent 45%,rgba(0,0,0,.25) 100%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);}
  .layer-glare{mix-blend-mode:screen;opacity:.5;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.35),transparent 42%);transition:opacity .3s;}
  .card-stage:not(.hovering) .layer-glare{opacity:.18;}

  .meta{margin-top:26px;text-align:center;}
  .title{font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.1rem,3vw,1.35rem);text-transform:uppercase;letter-spacing:.04em;color:var(--white);}
  .btn-try{
    margin-top:18px;display:inline-block;padding:14px 40px;background:transparent;color:var(--white);
    font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    text-decoration:none;border:1px solid var(--red-deep);border-radius:100px;transition:border-color .3s,background .3s,color .3s;
  }
  .btn-try:hover{border-color:var(--red);background:var(--red);color:var(--black);}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>

<script>
  function toggleMenu(){
    document.getElementById('nav').classList.toggle('active');
    document.getElementById('menuBtn').classList.toggle('active');
  }

  /* кандзі-дощ на фоні (yokai/mythology тематика) */
  (function(){
    var matrix = document.getElementById('matrix');
    var chars = "般若狐霊魂天人地龍神鬼";
    for (let i = 0; i < 12; i++){
      var col = document.createElement('div');
      col.className = 'matrix-column';
      col.style.animationDuration = (14 + Math.random()*8) + 's';
      var content = "";
      for (let j = 0; j < 50; j++){ content += chars[Math.floor(Math.random()*chars.length)] + "<br>"; }
      col.innerHTML = content + content;
      matrix.appendChild(col);
    }
  })();

  /* звук: та сама логіка, що на портфоліо */
  (function(){
    var audio = document.getElementById('bgAudio');
    var btn = document.getElementById('soundBtn');
    var triedAutoplay = false;
    function setIcon(){ if(audio.paused) btn.classList.add('muted'); else btn.classList.remove('muted'); }
    function tryAutoplay(){
      if(triedAutoplay) return;
      triedAutoplay = true;
      audio.play().catch(function(){});
    }
    window.addEventListener('scroll', tryAutoplay, {once:true, passive:true});
    window.addEventListener('touchstart', tryAutoplay, {once:true, passive:true});
    btn.addEventListener('click', function(){
      if(audio.paused){ audio.play().catch(function(){}); } else { audio.pause(); }
    });
    audio.addEventListener('play', setIcon);
    audio.addEventListener('pause', setIcon);
  })();

  /* преміальний 3D-тілт карток курсором (тільки на пристроях з мишкою) */
  (function(){
    var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if(!canHover) return;
    document.querySelectorAll('.card-stage').forEach(function(stage){
      var card = stage.querySelector('.nft-card');
      var glare = stage.querySelector('.layer-glare');
      stage.addEventListener('pointerenter', function(){ stage.classList.add('tilting','hovering'); });
      stage.addEventListener('pointermove', function(e){
        var r = stage.getBoundingClientRect();
        var px = (e.clientX - r.left) / r.width;
        var py = (e.clientY - r.top) / r.height;
        var rx = (0.5 - py) * 18;
        var ry = (px - 0.5) * 18;
        card.style.transform = 'rotateX('+rx+'deg) rotateY('+ry+'deg) translateZ(20px)';
        if(glare){ glare.style.setProperty('--gx', (px*100)+'%'); glare.style.setProperty('--gy', (py*100)+'%'); }
      });
      stage.addEventListener('pointerleave', function(){
        stage.classList.remove('tilting','hovering');
        card.style.transform = '';
      });
    });
  })();
</script>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YYOKAI | Вільні ескізи</title>
<meta name="description" content="Готові ескізи — унікальні, не повторюються. YYOKAI, Львів.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;900&family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#060605;
    --panel:#0e0e0d;
    --white:#f4f1ea;
    --white-dim:rgba(244,241,234,0.55);
    --red:#ff6a55;
    --red-deep:#a13324;
    --line:rgba(244,241,234,0.09);
    --ease:cubic-bezier(0.16,1,0.3,1);
    --gutter:clamp(20px,6vw,64px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;outline:none;-webkit-tap-highlight-color:transparent;}
  html{background:var(--black);scroll-behavior:smooth;overscroll-behavior-x:none;}
  body{background:var(--black);color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden;line-height:1.5;
    overscroll-behavior-x:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;max-width:100vw;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--red);color:var(--black);}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ============================================================
     👉 ФОН СТОРІНКИ — відео позаду контенту, затемнене і трохи розмите.
     Файл: -5816441903785162927.mov (має лежати поруч з lettering.html,
     назва має збігатися з точністю до регістру літер).
     Можеш підкрутити прозорість і розмиття тут:
     ============================================================ */
  :root{ --bg-video-opacity:.55; --bg-video-blur:1.5px; }
  .hero-video-section{position:relative;overflow:hidden;min-height:56vh;display:flex;align-items:center;}
  .bg-video-wrap{position:absolute;inset:0;z-index:0;overflow:hidden;opacity:0;transition:opacity 1.2s ease;}
  .bg-video-wrap.active{opacity:var(--bg-video-opacity);}
  .bg-fade-bottom{position:absolute;left:0;right:0;bottom:0;height:40%;z-index:1;background:linear-gradient(to bottom,transparent,var(--black));pointer-events:none;}
  .bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(var(--bg-video-blur));opacity:0;transition:opacity 1s linear;}
  .bg-video.is-active{opacity:1;}
  .bg-tint{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(6,6,5,.1) 0%,rgba(6,6,5,.7) 85%);}

  /* ---------- TOP BAR (як на решті сайту) ---------- */
  .menu-btn{position:fixed;top:26px;right:24px;z-index:2000;width:26px;height:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;}
  .menu-btn span{display:block;width:100%;height:1px;background:var(--white);transition:transform .35s var(--ease),opacity .35s;}
  .menu-btn.active span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
  .menu-btn.active span:nth-child(2){opacity:0;}
  .menu-btn.active span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

  .brand-mark{position:fixed;top:24px;left:24px;z-index:2000;font-family:'Unbounded',sans-serif;font-size:13px;letter-spacing:.04em;text-decoration:none;color:var(--white);}

  .sound-btn{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(14,14,13,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .3s,background .3s;}
  .sound-btn:hover{border-color:var(--red-deep);}
  .sound-btn svg{width:15px;height:15px;}
  .sound-btn .icon-off{display:none;}
  .sound-btn.muted .icon-on{display:none;}
  .sound-btn.muted .icon-off{display:block;}

  .nav-overlay{position:fixed;inset:0;background:var(--black);z-index:1999;display:flex;flex-direction:column;justify-content:center;padding:0 var(--gutter);transform:translateY(-102%);transition:transform .55s var(--ease);}
  .nav-overlay.active{transform:translateY(0);}
  .nav-overlay a{display:block;font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.5rem,6vw,2.6rem);color:var(--white-dim);text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line);transition:color .3s var(--ease),padding-left .3s var(--ease),text-shadow .3s var(--ease);}
  .nav-overlay a:hover,.nav-overlay a:focus-visible{color:var(--white);padding-left:14px;text-shadow:0 0 22px rgba(244,241,234,0.45);}
  .nav-foot{margin-top:30px;font-size:12px;color:var(--white-dim);}

  .cta-fixed{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--black);padding:16px 36px;border-radius:100px;text-decoration:none;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:600;z-index:1500;box-shadow:0 10px 30px rgba(255,106,85,.35);white-space:nowrap;transition:transform .25s var(--ease);}
  .cta-fixed:hover{transform:translateX(-50%) translateY(-2px);}

  /* ---------- HEADER ---------- */
  .page-head{position:relative;z-index:1;padding:100px var(--gutter) 24px;text-align:center;}
  .page-head .mono{font-size:11px;color:var(--red);}
  .page-head h1{font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.3rem,4vw,1.8rem);margin-top:8px;}
  .page-head p{color:var(--white-dim);font-size:.9rem;margin-top:8px;max-width:44ch;margin-left:auto;margin-right:auto;}

  /* ---------- GRID GALLERY (2 колонки, як портфоліо) ---------- */
  .grid-wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 var(--gutter) 140px;}
  .flash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:820px){.flash-grid{grid-template-columns:repeat(3,1fr);gap:12px;}}

  .flash-cell{position:relative;aspect-ratio:3/4;overflow:hidden;}
  .flash-cell img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s var(--ease),transform .4s var(--ease);}
  .flash-cell img.loaded{opacity:1;}
  .flash-cell.available{cursor:pointer;}
  .flash-cell.available:hover img{transform:scale(1.04);}
  .flash-cell.claimed img{opacity:.55;filter:grayscale(1);}
  .flash-cell.claimed img.loaded{opacity:.55;filter:grayscale(1);}

  .tag{position:absolute;left:10px;bottom:10px;z-index:2;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.03em;
    color:#3a3632;padding:5px 20px;border-radius:100px;white-space:nowrap;background-size:260% 100%;
    animation:tagShimmer 15s ease-in-out infinite alternate;text-shadow:none;}
  .tag-available{background-image:linear-gradient(100deg,#e6b9c6,#b9cbe6,#dcd3ad,#e6b9c6);}

  .claimed-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
    font-family:'Unbounded',sans-serif;font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    color:#e8e8e4;padding:9px 16px;border-radius:100px;white-space:nowrap;
    background:rgba(90,90,86,.85);border:1px solid rgba(232,232,228,.15);}

  @keyframes tagShimmer{0%{background-position:0% 50%;}100%{background-position:100% 50%;}}

  .empty-cell{position:relative;aspect-ratio:3/4;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;}
  .empty-cell span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--white-dim);opacity:.5;letter-spacing:.03em;}

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;}
  }
</style>
</head>
<body>

<section class="hero-video-section">
  <div class="bg-video-wrap" id="bgVideoWrap">
    <video class="bg-video is-active" id="bgVideoA" muted playsinline preload="auto" autoplay>
      <source src="-310047267327574324.mp4" type="video/mp4">
    </video>
    <video class="bg-video" id="bgVideoB" muted playsinline preload="none">
      <source src="-310047267327574324.mp4" type="video/mp4">
    </video>
    <div class="bg-tint"></div>
  </div>
  <div class="bg-fade-bottom"></div>

  <div class="page-head">
    <div class="mono">flash</div>
    <h1>Вільні ескізи</h1>
    <p>Кожен ескіз — в одному екземплярі. Заброньовані роботи більше не повторюються.</p>
  </div>
</section>

<audio id="bgAudio" src="track.mp3" loop preload="none"></audio>
<button class="sound-btn muted" id="soundBtn" aria-label="Увімкнути/вимкнути музику">
  <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="#f4f1ea" stroke-width="1.6"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="#f4f1ea" stroke-width="1.6"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
</button>

<a href="index.html" class="brand-mark">YYOKAI</a>
<div class="menu-btn" id="menuBtn" onclick="toggleMenu()"><span></span><span></span><span></span></div>

<nav class="nav-overlay" id="nav">
  <a href="index.html">Головна</a>
  <a href="portfolio.html">Портфоліо</a>
  <a href="index.html#price">Ціни</a>
  <a href="index.html#tools">Функції</a>
  <a href="index.html#map">Контакти</a>
  <div class="nav-foot mono">yyokai.tattoo — Львів</div>
</nav>

<a href="booking.html" class="cta-fixed">Записатися</a>

<div class="grid-wrap">
  <div class="flash-grid" id="flashGrid"></div>
</div>

<script>
  /* фонове відео: плавна поява + безшовна склейка циклу */
  (function(){
    var wrap = document.getElementById('bgVideoWrap');
    requestAnimationFrame(function(){ setTimeout(function(){ wrap.classList.add('active'); }, 60); });

    var a = document.getElementById('bgVideoA');
    var b = document.getElementById('bgVideoB');
    if(!a || !b) return;
    var active = a, standby = b, crossfading = false, preloaded = false;
    function crossfade(){
      if(crossfading) return;
      crossfading = true;
      try{ standby.currentTime = 0; standby.play().catch(function(){}); }catch(e){}
      standby.classList.add('is-active');
      active.classList.remove('is-active');
      setTimeout(function(){
        try{ active.pause(); }catch(e){}
        var tmp = active; active = standby; standby = tmp;
        preloaded = false; crossfading = false;
      }, 1000);
    }
    function bind(v){
      v.addEventListener('timeupdate', function(){
        if(v !== active || !v.duration) return;
        if(!preloaded && v.currentTime >= v.duration * 0.5){
          preloaded = true; standby.setAttribute('preload','auto'); standby.load();
        }
        if((v.duration - v.currentTime) <= 1) crossfade();
      });
    }
    bind(a); bind(b);
  })();

  function toggleMenu(){
    document.getElementById('nav').classList.toggle('active');
    document.getElementById('menuBtn').classList.toggle('active');
  }

  /* звук: та сама логіка, що на портфоліо */
  (function(){
    var audio = document.getElementById('bgAudio');
    var btn = document.getElementById('soundBtn');
    var triedAutoplay = false;
    function tryAutoplay(){
      if(triedAutoplay) return;
      triedAutoplay = true;
      audio.play().catch(function(){});
    }
    window.addEventListener('scroll', tryAutoplay, {once:true, passive:true});
    window.addEventListener('touchstart', tryAutoplay, {once:true, passive:true});
    btn.addEventListener('click', function(){
      if(audio.paused){ audio.play().catch(function(){}); } else { audio.pause(); }
    });
    audio.addEventListener('play', function(){ btn.classList.remove('muted'); });
    audio.addEventListener('pause', function(){ btn.classList.add('muted'); });
  })();

  /* ============================================================
     👉 СПИСОК ЕСКІЗІВ
     - src: назва файлу зображення (постав поруч з lettering.html)
     - claimed: true/false — true = сірий бейдж "Заброньовано" по
       центру фото, false = пастельне "Вільно" знизу зліва.
     - tryOn: посилання на сторінку примірки цього ескізу (наприклад
       'primerka.html'). Клік по доступному ескізу одразу відкриває
       цю сторінку. Залиш порожнім '', якщо примірки ще немає —
       тоді клік просто покаже фото на весь екран.
     Порожні місця в кінці — запас під майбутні ескізи, просто
     заміни src у будь-якому рядку, коли з'явиться нова робота.
     ============================================================ */
  const flashItems = [
    {src:'yok1.png', claimed:false, tryOn:'primerka.html'},
    {src:'yok2.jpg', claimed:false, tryOn:'primerka3.html'},
    {src:'yok3.png', claimed:false, tryOn:''},
    {src:'yok4.png', claimed:false, tryOn:''},
    {src:'yok5.png', claimed:false, tryOn:''},
    {src:'yok5.1.png', claimed:false, tryOn:''},
    {src:'yok6.png', claimed:false, tryOn:''},
    {src:'yok7.png', claimed:false, tryOn:''},
    {src:'yok8.png', claimed:false, tryOn:''},
    {src:'yok9.png', claimed:false, tryOn:''},
    {src:'yok10.png', claimed:false, tryOn:''},
    // --- запас під майбутні ескізи (просто встав src, коли буде готово) ---
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''},
    {src:'', claimed:false, tryOn:''}
  ];

  var grid = document.getElementById('flashGrid');

  flashItems.forEach(function(item){
    if(!item.src){
      var empty = document.createElement('div');
      empty.className = 'empty-cell';
      empty.innerHTML = '<span>скоро</span>';
      grid.appendChild(empty);
      return;
    }

    var cell = document.createElement('div');
    cell.className = 'flash-cell ' + (item.claimed ? 'claimed' : 'available');

    var img = document.createElement('img');
    img.loading = 'lazy';
    img.src = item.src;
    img.alt = 'Ескіз YYOKAI';
    img.addEventListener('load', function(){ img.classList.add('loaded'); });
    cell.appendChild(img);

    if(item.claimed){
      var badge = document.createElement('span');
      badge.className = 'claimed-badge';
      badge.textContent = 'Заброньовано';
      cell.appendChild(badge);
    } else {
      var tag = document.createElement('span');
      tag.className = 'tag tag-available';
      tag.textContent = 'Вільно';
      cell.appendChild(tag);

      if(item.tryOn){
        cell.addEventListener('click', function(){
          window.location.href = item.tryOn;
        });
      }
    }

    grid.appendChild(cell);
  });
</script>
</body>
</html>

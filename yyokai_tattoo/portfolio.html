<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YYOKAI | Портфоліо</title>
<meta name="description" content="Портфоліо робіт — японський графічний та fine-line тату-стиль. YYOKAI, Львів.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;900&family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#060605;
    --panel:#0e0e0d;
    --white:#f4f1ea;
    --white-dim:rgba(244,241,234,0.55);
    --red:#ff6a55;
    --red-deep:#a13324;
    --line:rgba(244,241,234,0.09);
    --ease:cubic-bezier(0.16,1,0.3,1);
    --gutter:clamp(20px,6vw,64px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;outline:none;-webkit-tap-highlight-color:transparent;}
  html{background:var(--black);scroll-behavior:smooth;overscroll-behavior-x:none;}
  body{background:var(--black);color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden;line-height:1.5;
    overscroll-behavior-x:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;max-width:100vw;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--red);color:var(--black);}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ============================================================
     👉 ФОН СТОРІНКИ — те саме відео, що й на головній.
     Просто впиши точну назву файлу (з великими/малими літерами
     як у репозиторії) у два теги <source> нижче в HTML.
     ============================================================ */
  .bg-video-wrap{position:fixed;inset:0;z-index:0;overflow:hidden;opacity:.3;}
  .bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(3px);opacity:0;transition:opacity 1s linear;}
  .bg-video.is-active{opacity:1;}
  .bg-tint{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(6,6,5,.2) 0%,rgba(6,6,5,.92) 85%);}

  /* ---------- NAV (ідентично головній сторінці) ---------- */
  .menu-btn{position:fixed;top:26px;right:24px;z-index:2000;width:26px;height:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;}
  .menu-btn span{display:block;width:100%;height:1px;background:var(--white);transition:transform .35s var(--ease),opacity .35s;}
  .menu-btn.active span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
  .menu-btn.active span:nth-child(2){opacity:0;}
  .menu-btn.active span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

  .brand-mark{position:fixed;top:24px;left:24px;z-index:2000;font-family:'Unbounded',sans-serif;font-size:13px;letter-spacing:.04em;text-decoration:none;color:var(--white);}

  .nav-overlay{position:fixed;inset:0;background:var(--black);z-index:1999;display:flex;flex-direction:column;justify-content:center;padding:0 var(--gutter);transform:translateY(-102%);transition:transform .55s var(--ease);}
  .nav-overlay.active{transform:translateY(0);}
  .nav-overlay a{display:block;font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.5rem,6vw,2.6rem);color:var(--white-dim);text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line);transition:color .3s var(--ease),padding-left .3s var(--ease),text-shadow .3s var(--ease);}
  .nav-overlay a:hover,.nav-overlay a:focus-visible{color:var(--white);padding-left:14px;text-shadow:0 0 22px rgba(244,241,234,0.45);}
  .nav-foot{margin-top:30px;font-size:12px;color:var(--white-dim);}

  .cta-fixed{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--black);padding:16px 36px;border-radius:100px;text-decoration:none;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:600;z-index:1500;box-shadow:0 10px 30px rgba(255,106,85,.35);white-space:nowrap;transition:transform .25s var(--ease);}
  .cta-fixed:hover{transform:translateX(-50%) translateY(-2px);}

  /* ---------- COMPACT HEADER (замість повноекранного hero) ---------- */
  .page-head{position:relative;z-index:1;padding:100px var(--gutter) 18px;text-align:center;}
  .page-head .mono{font-size:11px;color:var(--red);opacity:0;transition:opacity .8s var(--ease) .1s;}
  .page-head h1{font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.3rem,4vw,1.8rem);margin-top:8px;opacity:0;transform:translateY(10px);transition:opacity .8s var(--ease) .2s,transform .8s var(--ease) .2s;}
  .page-head.active .mono,.page-head.active h1{opacity:1;transform:none;}

  /* ---------- GALLERY — займає майже весь екран одразу ---------- */
  .gallery-container{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 var(--gutter) 130px;display:flex;flex-direction:column;align-items:center;}
  .gallery-viewer{position:relative;width:100%;height:calc(100svh - 300px);min-height:380px;max-height:760px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);overflow:hidden;
    opacity:0;transform:scale(.98);transition:opacity .8s var(--ease) .3s,transform .8s var(--ease) .3s;}
  .gallery-viewer.active{opacity:1;transform:scale(1);}
  .gallery-viewer img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transition:opacity .25s linear;}
  .nav-zone{position:absolute;top:0;bottom:0;width:35%;cursor:pointer;z-index:2;}
  .nav-zone.left-zone{left:0;}
  .nav-zone.right-zone{right:0;}

  .bottom-nav{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:24px;width:100%;}
  .arrow-wrapper{cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--red-deep);border-radius:50%;transition:border-color .3s,background .3s;}
  .arrow-wrapper:hover{border-color:var(--red);background:#161311;}
  .counter{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--white-dim);min-width:80px;text-align:center;}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    .page-head .mono,.page-head h1,.gallery-viewer{opacity:1!important;transform:none!important;}
  }
</style>
</head>
<body>

<div class="bg-video-wrap">
  <video class="bg-video is-active" id="bgVideoA" muted playsinline preload="auto" autoplay>
    <source src="videopodlogo2.mov" type="video/mp4">
  </video>
  <video class="bg-video" id="bgVideoB" muted playsinline preload="none">
    <source src="videopodlogo2.mov" type="video/mp4">
  </video>
  <div class="bg-tint"></div>
</div>

<a href="index.html" class="brand-mark">YYOKAI</a>
<div class="menu-btn" id="menuBtn" onclick="toggleMenu()"><span></span><span></span><span></span></div>

<nav class="nav-overlay" id="nav">
  <a href="index.html">Головна</a>
  <a href="index.html#price">Ціни</a>
  <a href="esciz.html">Вільні ескізи</a>
  <a href="index.html#tools">Функції</a>
  <a href="index.html#map">Контакти</a>
  <div class="nav-foot mono">yyokai.tattoo — Львів</div>
</nav>

<a href="booking.html" class="cta-fixed">Записатися</a>

<div class="page-head" id="pageHead">
  <div class="mono">作 — works</div>
  <h1>Портфоліо</h1>
</div>

<section class="gallery-container" id="gallery">
  <div class="gallery-viewer" id="viewer">
    <div class="nav-zone left-zone" onclick="prevImg()" aria-label="Попереднє фото"></div>
    <div class="nav-zone right-zone" onclick="nextImg()" aria-label="Наступне фото"></div>
    <img id="mainImg" src="" alt="YYOKAI tattoo робота">
  </div>

  <div class="bottom-nav">
    <div class="arrow-wrapper" onclick="prevImg()" aria-label="Попереднє фото">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="counter" id="imgCounter">1 / 83</div>
    <div class="arrow-wrapper" onclick="nextImg()" aria-label="Наступне фото">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>
</section>

<script>
  function toggleMenu(){
    document.getElementById('nav').classList.toggle('active');
    document.getElementById('menuBtn').classList.toggle('active');
  }

  (function(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var head = document.getElementById('pageHead');
    var viewer = document.getElementById('viewer');
    if(reduce){ head.classList.add('active'); viewer.classList.add('active'); return; }
    requestAnimationFrame(function(){
      setTimeout(function(){
        head.classList.add('active');
        viewer.classList.add('active');
      }, 60);
    });
  })();

  /* ---- плавна склейка циклу фонового відео ---- */
  (function(){
    var a = document.getElementById('bgVideoA');
    var b = document.getElementById('bgVideoB');
    if(!a || !b) return;
    var active = a, standby = b, crossfading = false, preloaded = false;
    function crossfade(){
      if(crossfading) return;
      crossfading = true;
      try{ standby.currentTime = 0; standby.play().catch(function(){}); }catch(e){}
      standby.classList.add('is-active');
      active.classList.remove('is-active');
      setTimeout(function(){
        try{ active.pause(); }catch(e){}
        var tmp = active; active = standby; standby = tmp;
        preloaded = false; crossfading = false;
      }, 1000);
    }
    function bind(v){
      v.addEventListener('timeupdate', function(){
        if(v !== active || !v.duration) return;
        if(!preloaded && v.currentTime >= v.duration * 0.5){
          preloaded = true; standby.setAttribute('preload','auto'); standby.load();
        }
        if((v.duration - v.currentTime) <= 1) crossfade();
      });
    }
    bind(a); bind(b);
  })();

  const photos = [
    "19.jpg","20.JPG","21.JPG","22.JPG","23.JPG","24.JPG","25.JPG","26.JPG","27.JPG","28.JPG",
    "29.JPG","30.JPG","31.JPG","32.JPG","33.JPG","34.JPG","35.jpg","36.JPG","37.JPG","38.JPG",
    "39.JPG","40.JPG","41.JPG","42.JPG","43.JPG","44.JPG","45.JPG","46.JPG","47.JPG","48.JPG",
    "49.JPG","50.JPG","51.JPG","52.JPG","53.JPG","54.JPG","55.JPG","56.JPG","57.JPG","58.JPG",
    "59.JPG","60.JPG","61.JPG","62.JPG","63.JPG","64.JPG","65.JPG","66.JPG","67.JPG","68.JPG",
    "69.JPG","70.JPG","71.JPG","72.JPG","73.JPG","74.JPG","75.JPG","76.JPG","77.JPG","78.JPG",
    "79.JPG","80.JPG","81.JPG","82.JPG","83.JPG","101.JPG","84.JPG","85.JPG","86.JPG","87.JPG",
    "88.JPG","89.JPG","90.JPG","91.JPG","92.JPG","93.JPG","94.JPG","95.JPG","96.JPG","97.JPG",
    "98.JPG","99.JPG","100.JPG"
  ];

  let currentIdx = 0;
  const mainImg = document.getElementById('mainImg');
  const counter = document.getElementById('imgCounter');

  function updateImg(){
    mainImg.style.opacity = '0';
    setTimeout(function(){
      mainImg.src = photos[currentIdx];
      counter.textContent = (currentIdx + 1) + ' / ' + photos.length;
      mainImg.style.opacity = '1';
    }, 120);
  }
  function nextImg(){ currentIdx = (currentIdx + 1) % photos.length; updateImg(); }
  function prevImg(){ currentIdx = (currentIdx - 1 + photos.length) % photos.length; updateImg(); }

  let startX = 0;
  document.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    var endX = e.changedTouches[0].clientX;
    if (startX - endX > 50) nextImg();
    if (endX - startX > 50) prevImg();
  }, {passive:true});

  updateImg();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YYOKAI | Портфоліо</title>
<meta name="description" content="Портфоліо робіт — японський графічний та fine-line тату-стиль. YYOKAI, Львів.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;900&family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#060605;
    --panel:#0e0e0d;
    --white:#f4f1ea;
    --white-dim:rgba(244,241,234,0.55);
    --red:#ff6a55;
    --red-deep:#a13324;
    --line:rgba(244,241,234,0.09);
    --ease:cubic-bezier(0.16,1,0.3,1);
    --gutter:clamp(20px,6vw,64px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;outline:none;-webkit-tap-highlight-color:transparent;}
  html{background:var(--black);scroll-behavior:smooth;overscroll-behavior-x:none;}
  body{background:var(--black);color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden;line-height:1.5;
    overscroll-behavior-x:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;max-width:100vw;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--red);color:var(--black);}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- TOP BAR ---------- */
  .menu-btn{position:fixed;top:26px;right:24px;z-index:2000;width:26px;height:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;}
  .menu-btn span{display:block;width:100%;height:1px;background:var(--white);transition:transform .35s var(--ease),opacity .35s;}
  .menu-btn.active span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
  .menu-btn.active span:nth-child(2){opacity:0;}
  .menu-btn.active span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

  .brand-mark{position:fixed;top:24px;left:24px;z-index:2000;font-family:'Unbounded',sans-serif;font-size:13px;letter-spacing:.04em;text-decoration:none;color:var(--white);}

  /* 👉 іконка звуку — рівно по центру між лого і бургером */
  .sound-btn{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(14,14,13,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .3s,background .3s;}
  .sound-btn:hover{border-color:var(--red-deep);}
  .sound-btn svg{width:15px;height:15px;}
  .sound-btn .icon-off{display:none;}
  .sound-btn.muted .icon-on{display:none;}
  .sound-btn.muted .icon-off{display:block;}

  .nav-overlay{position:fixed;inset:0;background:var(--black);z-index:1999;display:flex;flex-direction:column;justify-content:center;padding:0 var(--gutter);transform:translateY(-102%);transition:transform .55s var(--ease);}
  .nav-overlay.active{transform:translateY(0);}
  .nav-overlay a{display:block;font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.5rem,6vw,2.6rem);color:var(--white-dim);text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line);transition:color .3s var(--ease),padding-left .3s var(--ease),text-shadow .3s var(--ease);}
  .nav-overlay a:hover,.nav-overlay a:focus-visible{color:var(--white);padding-left:14px;text-shadow:0 0 22px rgba(244,241,234,0.45);}
  .nav-foot{margin-top:30px;font-size:12px;color:var(--white-dim);}

  .cta-fixed{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--black);padding:16px 36px;border-radius:100px;text-decoration:none;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:600;z-index:1500;box-shadow:0 10px 30px rgba(255,106,85,.35);white-space:nowrap;transition:transform .25s var(--ease);}
  .cta-fixed:hover{transform:translateX(-50%) translateY(-2px);}

  /* ---------- COMPACT HEADER ---------- */
  .page-head{position:relative;z-index:1;padding:100px var(--gutter) 24px;text-align:center;}
  .page-head .mono{font-size:11px;color:var(--red);opacity:0;transition:opacity .8s var(--ease) .1s;}
  .page-head h1{font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(1.3rem,4vw,1.8rem);margin-top:8px;opacity:0;transform:translateY(10px);transition:opacity .8s var(--ease) .2s,transform .8s var(--ease) .2s;}
  .page-head.active .mono,.page-head.active h1{opacity:1;transform:none;}

  /* ---------- GRID GALLERY ---------- */
  .grid-wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 var(--gutter) 140px;}
  .photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;}
  @media(min-width:720px){.photo-grid{grid-template-columns:repeat(3,1fr);gap:4px;}}
  .photo-cell{position:relative;aspect-ratio:3/4;overflow:hidden;cursor:pointer;background:var(--panel);border:1px solid var(--line);}
  .photo-cell img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s var(--ease),transform .5s var(--ease);}
  .photo-cell img.loaded{opacity:1;}
  .photo-cell:hover img{transform:scale(1.04);}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(6,6,5,.97);z-index:3000;display:flex;align-items:center;justify-content:center;padding:60px 20px;opacity:0;visibility:hidden;transition:opacity .35s var(--ease);}
  .lightbox.open{opacity:1;visibility:visible;}
  .lightbox img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform:scale(.96);transition:transform .35s var(--ease);}
  .lightbox.open img{transform:scale(1);}
  .lightbox-close{position:absolute;top:22px;right:22px;width:40px;height:40px;border-radius:50%;border:1px solid var(--red-deep);background:rgba(14,14,13,.7);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .3s,background .3s;}
  .lightbox-close:hover{border-color:var(--red);background:#161311;}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    .page-head .mono,.page-head h1{opacity:1!important;transform:none!important;}
  }
</style>
</head>
<body>

<a href="index.html" class="brand-mark">YYOKAI</a>

<!-- 👉 звук: файл track.mp3 (той, що вже лежить у репозиторії) -->
<audio id="bgAudio" src="1789511605555163.mp3_out.mp3" loop preload="none"></audio>
<button class="sound-btn muted" id="soundBtn" aria-label="Увімкнути/вимкнути музику">
  <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="#f4f1ea" stroke-width="1.6"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="#f4f1ea" stroke-width="1.6"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
</button>

<div class="menu-btn" id="menuBtn" onclick="toggleMenu()"><span></span><span></span><span></span></div>

<nav class="nav-overlay" id="nav">
  <a href="index.html">Головна</a>
  <a href="index.html#price">Ціни</a>
  <a href="esciz.html">Вільні ескізи</a>
  <a href="index.html#tools">Функції</a>
  <a href="index.html#map">Контакти</a>
  <div class="nav-foot mono">yyokai.tattoo — Львів</div>
</nav>

<a href="booking.html" class="cta-fixed">Записатися</a>

<div class="page-head" id="pageHead">
  <div class="mono">作 — works</div>
  <h1>Портфоліо</h1>
</div>

<div class="grid-wrap">
  <div class="photo-grid" id="photoGrid"></div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-close" id="lightboxClose" aria-label="Закрити">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>
  <img id="lightboxImg" src="" alt="YYOKAI tattoo робота — повний розмір">
</div>

<script>
  function toggleMenu(){
    document.getElementById('nav').classList.toggle('active');
    document.getElementById('menuBtn').classList.toggle('active');
  }

  (function(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var head = document.getElementById('pageHead');
    if(reduce){ head.classList.add('active'); return; }
    requestAnimationFrame(function(){ setTimeout(function(){ head.classList.add('active'); }, 60); });
  })();

  /* ---- музика: автозапуск при першому скролі, вручну — кнопкою ---- */
  (function(){
    var audio = document.getElementById('bgAudio');
    var btn = document.getElementById('soundBtn');
    var triedAutoplay = false;

    function setIcon(){
      if(audio.paused) btn.classList.add('muted');
      else btn.classList.remove('muted');
    }
    function tryAutoplay(){
      if(triedAutoplay) return;
      triedAutoplay = true;
      audio.play().then(setIcon).catch(function(){
        /* браузер заблокував автозапуск без прямого дотику — чекаємо клік по іконці */
      });
    }
    window.addEventListener('scroll', tryAutoplay, {once:true, passive:true});
    window.addEventListener('touchstart', tryAutoplay, {once:true, passive:true});

    btn.addEventListener('click', function(){
      if(audio.paused){ audio.play().catch(function(){}); }
      else{ audio.pause(); }
    });
    audio.addEventListener('play', setIcon);
    audio.addEventListener('pause', setIcon);
  })();

  /* ---- галерея: сітка + лайтбокс ---- */
  const photos = [
    "19.jpg","20.JPG","21.JPG","22.JPG","23.JPG","24.JPG","25.JPG","26.JPG","27.JPG","28.JPG",
    "29.JPG","30.JPG","31.JPG","32.JPG","33.JPG","34.JPG","35.jpg","36.JPG","37.JPG","38.JPG",
    "39.JPG","40.JPG","41.JPG","42.JPG","43.JPG","44.JPG","45.JPG","46.JPG","47.JPG","48.JPG",
    "49.JPG","50.JPG","51.JPG","52.JPG","53.JPG","54.JPG","55.JPG","56.JPG","57.JPG","58.JPG",
    "59.JPG","60.JPG","61.JPG","62.JPG","63.JPG","64.JPG","65.JPG","66.JPG","67.JPG","68.JPG",
    "69.JPG","70.JPG","71.JPG","72.JPG","73.JPG","74.JPG","75.JPG","76.JPG","77.JPG","78.JPG",
    "79.JPG","80.JPG","81.JPG","82.JPG","83.JPG","101.JPG","84.JPG","85.JPG","86.JPG","87.JPG",
    "88.JPG","89.JPG","90.JPG","91.JPG","92.JPG","93.JPG","94.JPG","95.JPG","96.JPG","97.JPG",
    "98.JPG","99.JPG","100.JPG"
  ];

  var grid = document.getElementById('photoGrid');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');

  photos.forEach(function(src){
    var cell = document.createElement('div');
    cell.className = 'photo-cell';
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.src = src;
    img.alt = 'YYOKAI tattoo робота';
    img.addEventListener('load', function(){ img.classList.add('loaded'); });
    cell.appendChild(img);
    cell.addEventListener('click', function(){
      lightboxImg.src = src;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
    grid.appendChild(cell);
  });

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){ if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>

/* ── Анімації ── */
@keyframes pulse-glow{0%,100%{box-shadow:0 0 15px rgba(255,42,95,.4);transform:scale(1)}50%{box-shadow:0 0 35px rgba(255,183,3,.7);transform:scale(1.02)}}

@keyframes spinR{to{transform:rotate(360deg)}}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-75vh) translateX(var(--dx));opacity:0}}
.glow{animation:pulse-glow 3s infinite}
.shk{animation:shakeC .22s infinite}
canvas{touch-action:none}

<script type="module">
/* ══════════════════════════════════════════════════════════════════════════
   INKAI by YYOKAI — ЯК ЦЕ УСТРОЄНО (читай спочатку)
   Усі місця, які ти змінюватимеш, позначені «🔧 ЗМІНИТИ».
   Структура файлу:  0 Налаштування → 1 Firebase → 2 Допоміжне → 3 Дані гравця → 4 Каталоги (клинки, фони,
   покращення, сундуки) → 5 Звук → 6 Навігація → 7 Заставка → 8 Головна → 9 Ігровий рух → 10 Результат і реклама →
   11 Магазин → 12 Сундуки → 13 Друзі → 14 Рейтинг → 15 Нагороди → 16 Профіль і адмінка → 17 Вхід → 18 Старт.

   ПРАВИЛА FIRESTORE (Firebase → Firestore → Rules). Встав це, заміни ADMIN_UID на свій UID:
     rules_version='2'; service cloud.firestore { match /databases/{d}/documents {
       function admin(){ return request.auth.uid in ['ADMIN_UID']; }
       match /users/{u}   { allow read: if request.auth.uid==u || admin(); allow write: if request.auth.uid==u; }
       match /public/{u}  { allow read: if request.auth!=null; allow write: if request.auth.uid==u; }
       match /referrals/{u}{ allow read: if request.auth!=null; allow create: if request.auth.uid==u; }
       match /daylog/{x}  { allow create: if request.auth.uid==request.resource.data.uid && request.resource.data.ts==request.time;
                            allow read: if admin(); }
       match /submissions/{s}{ allow read: if request.auth!=null && (resource.data.uid==request.auth.uid || admin());
                            allow create: if request.auth.uid==request.resource.data.uid && request.resource.data.status=='pending';
                            allow update: if admin(); }
       match /claims/{c}  { allow create: if request.auth!=null; allow read, update: if admin(); }
       match /adEvents/{a}{ allow create: if request.auth!=null; }
       match /offers/{o}  { allow read: if true; allow write: if admin(); }
     }}
   ВАЖЛИВО: гра рахує монети/XP у браузері гравця, тому технічно підкований гравець може їх підробити.
   Надійні лише серверні дані: час реєстрації, час останнього візиту і журнал днів (daylog). Перед видачею
   тату завжди перевіряй заявку в адмінці (там видно і серверні, і клієнтські дані).
   ══════════════════════════════════════════════════════════════════════════ */

// ═══ 0. НАЛАШТУВАННЯ ═══
// 🔧 ЗМІНИТИ: ключі Firebase (Firebase → Project settings → Your apps → Web app).
//    Поки стоять PASTE_..., гра працює локально (вхід = гість, без збереження в хмарі).
//    Також: Authentication → Sign-in method → увімкни Google та Apple; Authentication → Settings → Authorized domains → додай свій домен.
const firebaseConfig={apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT_ID.firebaseapp.com",projectId:"PASTE_PROJECT_ID",storageBucket:"PASTE_PROJECT_ID.appspot.com",messagingSenderId:"PASTE_SENDER_ID",appId:"PASTE_APP_ID"};
const CFG={
 hero:{name:"ТВОЄ ІМ'Я",quote:"Кожна лінія — це історія. Кожен ёкай — частина мене.|Every line tells a story. Every yokai is a part of me."}, // 🔧 ЗМІНИТИ: ім'я і цитата на заставці
 promo:{text:"Підпишись на Instagram YYOKAI|Follow YYOKAI on Instagram",url:"https://instagram.com/yyokai.tattoo"},          // 🔧 ЗМІНИТИ: посилання з реклами
 adEvery:3,                       // 🔧 обов'язкова реклама після кожного N-го раунду
 roundSec:60,                     // 🔧 тривалість раунду (секунди)
 offerReward:1000,                // 🔧 нагорода монетами за партнерське завдання
 offlineBaseMin:120,              // 🔧 скільки хвилин приносять «духи» поки тебе нема (без покращення «Нічний дозор»)
 adminHash:"__HASH__"             // SHA-256 пароля адмінки (сам пароль у коді не зберігається). Змінити: порахуй SHA-256 нового пароля.
};
window.CFG=CFG;

// ═══ 1. FIREBASE (вантажиться у фоні, гра його не чекає) ═══
let FB={},app,auth,db,FBOK=false,authReady;const authReadyP=new Promise(r=>authReady=r);
(async()=>{try{
 const B="https://www.gstatic.com/firebasejs/10.8.0/";
 const m=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
 FB=Object.assign({},...m);app=FB.initializeApp(firebaseConfig);auth=FB.getAuth(app);db=FB.getFirestore(app);
 FBOK=!firebaseConfig.apiKey.startsWith("PASTE");   // false = ключі ще не вставлені
 if(FBOK)initAuth();else authReady();
}catch(e){authReady()}})();

// ═══ 2. ДОПОМІЖНЕ ═══
const $=i=>document.getElementById(i),R=Math.random,today=()=>new Date().toISOString().slice(0,10),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>Math.floor(n).toLocaleString();
// esc() — ОБОВ'ЯЗКОВО для будь-якого тексту від гравців (нік тощо), інакше можна підсунути код у сторінку
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// t("укр|eng") — переклад: ліва частина українською, права англійською. Новий текст пиши так само.
let lang=localStorage.ink_lang||"ua";const t=s=>{const a=String(s).split("|");return lang=="ua"?a[0]:a[1]||a[0]};
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function toast(m){const e=$("toast");e.textContent=m;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),4500)}
const inApp=/Instagram|FBAN|FBAV|Telegram|TikTok|Line\//i.test(navigator.userAgent); // вбудований браузер → Google вхід заблокований

// ═══ 3. ДАНІ ГРАВЦЯ (S) — зберігаються в браузері і (після входу) у Firestore ═══
const def={

// ═══ 9. ІГРОВИЙ РУХ (canvas) ═══
const cv=$("cv"),cx=cv.getContext("2d");let W,H,D=1,G={on:0},ptr={};
function rs(){D=Math.min(3,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}
addEventListener("resize",()=>{if(!$("gm").classList.contains("hidden"))rs()});
// «Поле» гравця: ox/w — зсув і ширина (у режимі ДУО екран ділиться на два поля)
const mkF=(ox,w)=>({ox,w,fx:[],e:[],h:[],p:[],x:[],tr:[],sc:30*U("start"),cb:0,cT:0,cuts:0,nb:12,bo:null,sp:.4,fz:0,cr:[],fp:0,sl:0,st:0,fr:0,sh:0,fl:0,ts:1,kills:0});
function startRound(m){
 if(G.on)return;
 $("gm").classList.remove("hidden");$("res").classList.replace("flex","hidden");rs();
 const n=m||1,fw=W/n,T=CFG.roundSec+2*U("time")+(S.c.plus>0?15:0);          // час = база + покращення «Довгий раунд» + бустер
 G={on:1,m:n,t:T,f:[...Array(n)].map((_,i)=>mkF(i*fw,fw)),l:performance.now()};
 if(S.c.plus>0)S.c.plus--;
 if(S.c.fz>0){S.c.fz--;G.f.forEach(f=>f.fr=performance.now()+8000)}           // бустер «старт із шаленством»
 save();snd(300,.2);setMusic("battle");requestAnimationFrame(frame);
}
function quitRound(){G.on=0;ptr={};setMusic("menu");$("gm").classList.add("hidden");rend()}

// PNG ёкаїв: положи img/yokai/fox.png ... (прозорий фон). Нема PNG → малюється емодзі. Різання працює однаково.
const YIMG={};[["🦊","fox"],["👹","oni"],["👺","tengu"],["🐸","kappa"],["💀","skull"],["🐉","dragon"]].forEach(([e,n])=>{const i=new Image();i.src="img/yokai/"+n+".png";YIMG[e]=i});
const BGI=BG.map((g,i)=>{const im=new Image();im.src="img/bg/"+i+".png";return im}),rdy=i=>i&&i.complete&&i.naturalWidth;
function sp(c,y,r){ // малює одного ёкая (PNG або емодзі) в центрі (0,0) з «радіусом» r
 const i=YIMG[y];
 if(rdy(i)){c.imageSmoothingEnabled=true;c.imageSmoothingQuality="high";const k=Math.min(2*r/i.naturalWidth,2*r/i.naturalHeight)*1.15,w=i.naturalWidth*k,h=i.naturalHeight*k;c.drawImage(i,-w/2,-h/2,w,h)}
 else{c.font=r*1.7+"px serif";c.textAlign="center";c.textBaseline="middle";c.fillText(y,0,r*.08)}
}
function drawBG(w){ // фон раунду: PNG купленого фону або градієнт епохи — міняється одразу після вибору у Магазині
 const bi=BGI[S.bg];
 if(rdy(bi)){const k=Math.max(w/bi.naturalWidth,H/bi.naturalHeight);cx.imageSmoothingQuality="high";cx.drawImage(bi,(w-bi.naturalWidth*k)/2,(H-bi.naturalHeight*k)/2,bi.naturalWidth*k,bi.naturalHeight*k);cx.fillStyle="rgba(0,0,0,.3)";cx.fillRect(0,0,w,H);return}
 const g=BG[S.bg],gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,g[2][0]);gr.addColorStop(1,g[2][1]);cx.fillStyle=gr;cx.fillRect(0,0,w,H);
 cx.globalAlpha=.16;cx.font=Math.min(w,H)*.5+"px serif";cx.textAlign="center";cx.fillStyle="#fff";cx.fillText(g[3],w*.7,H*.3);cx.globalAlpha=1;
}
function burst(f,x,y,n,c){for(let i=0;i<n;i++){const a=R()*6.283,s=120+R()*380;f.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:c||(R()<.5?"#ffb703":"#ff2a5f")})}}
const pop=(f,x,y,s,big)=>f.x.push({x,y,s,l:1,big});
function spawn(f,st){ // новий ёкай летить знизу вгору
 const r=34+R()*16,x=f.w*(.15+R()*.7),h=H*(.55+R()*.3),g=H*1.6*(1-.02*U("slow"));
 f.e.push({y:YK[R()*6|0],r,x,py:H+r,vx:(f.w/2-x)*(.2+R()*.4),vy:-Math.sqrt(2*g*h)*(st?1.1:1),rot:0,vr:(R()-.5)*6,cut:0});
}
// ★ Підрахунок очок за розріз — тут працюють покращення: coin, combo, crit, critm, x2 і множник клинка
function score(f,base,now){
 const b=BL[S.blade];let m=(1+f.cb*(.2+.02*U("combo")))*b.sc*(1+.1*U("coin"))*(now<f.fr?2:1)*(now<f.sl?2:1)*(now<f.st?1.5:1);
 if(R()<.03*U("crit"))m*=3+.2*U("critm");           // критичний розріз
 if(R()<.02*U("x2"))m*=2;                            // подвійна монета
 const p=Math.round(base*m);f.sc+=p;return p;
}
function cut(f,e,ang,now){
 e.cut=1;f.fx.push({x:e.x,y:e.py,a:ang,l:1});
 for(const s of[1,-1])f.h.push({y:e.y,r:e.r,x:e.x,py:e.py,vx:e.vx-Math.sin(ang)*s*190,vy:e.vy*.4+Math.cos(ang)*s*190,rot:e.rot,vr:e.vr+s*3,cl:ang-e.rot,s,l:1.4}); // дві половинки
 f.cb=now-f.cT<700+40*U("cwin")?f.cb+1:1;f.cT=now;                                    // вікно комбо
 if(f.cb>=Math.max(3,8-(U("frth")/3|0))&&now>f.fr)f.fr=now+4000+500*U("frz");         // шаленство
 const p=score(f,10,now);pop(f,e.x,e.py,"+"+p);burst(f,e.x,e.py,12);f.sh=6;f.cuts++;
 navigator.vibrate&&navigator.vibrate(10);sfx("slash",()=>snd(500+f.cb*25));
 if(f.cuts>=f.nb&&!f.bo)mkBoss(f,now);                                               // 🔧 f.nb = кожні скільки розрізів з'являється бос
}
function mkBoss(f,now){ // 3 види босів: frz — заморожує екран, slo — сповільнює час (більше очок), sto — шторм
 const ty=["frz","slo","sto"][R()*3|0];
 f.bo={y:YK[R()*6|0],ty,hp:10,t:0,hit:0,last:0,r:Math.min(f.w,H)*.15,nf:now+9000};   // hp:10 — 10 ударів на боса
 pop(f,f.w/2,H*.22,"BOSS!",1);f.fl=.6;snd(120,.4,.2);
 if(ty=="frz")frz(f);if(ty=="slo")f.sl=now+7000;if(ty=="sto")f.st=now+8000;
}
function frz(f){f.fz=1;f.cr=[];f.fp=0}                   // лід: треба 5 довгих свайпів, щоб розбити
const fOf=x=>G.m==2?G.f[x<W/2?0:1]:G.f[0];
const dseg=(px,py,ax,ay,bx,by)=>{const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1;let u=((px-ax)*dx+(py-ay)*dy)/l;u=Math.max(0,Math.min(1,u));return Math.hypot(px-ax-u*dx,py-ay-u*dy)};
cv.addEventListener("pointerdown",e=>{if(!G.on)return;const f=fOf(e.clientX);ptr[e.pointerId]={f,x:e.clientX-f.ox,y:e.clientY};f.tr.push({x:e.clientX-f.ox,y:e.clientY,t:performance.now()})});
cv.addEventListener("pointermove",e=>{
 const p=ptr[e.pointerId];if(!p||!G.on)return;const f=p.f,x=e.clientX-f.ox,y=e.clientY,now=performance.now();if(x<0||x>f.w)return;
 f.tr.push({x,y,t:now});const d=Math.hypot(x-p.x,y-p.y);if(d<4)return;const ang=Math.atan2(y-p.y,x-p.x);
 if(f.fz){ // заморожено: рубати ёкаїв не можна, треба розбити лід
  f.fp+=d;if(f.fp>180){f.fp=0;f.cr.push([R()*f.w,R()*H*.7]);f.sh=8;snd(700,.05,.1);if(f.cr.length>=5){f.fz=0;f.fl=.5;burst(f,x,y,40,"#7dd3fc");pop(f,f.w/2,H*.4,"💥",1);if(f.bo)f.bo.nf=now+9000}}
  p.x=x;p.y=y;return;
 }
 const hr=1+.03*U("hit");                                            // покращення «Широке лезо»
 for(const en of f.e)if(!en.cut&&dseg(en.x,en.py,p.x,p.y,x,y)<en.r*hr)cut(f,en,ang,now);
 if(f.bo&&dseg(f.bx,f.by,p.x,p.y,x,y)<f.bo.r){
  const b=f.bo;
  if(now-b.last>=120){
   b.last=now;f.fx.push({x:f.bx,y:f.by,a:ang,l:1});b.hp-=R()<.05*U("boss")?2:1;b.hit=1;f.sh=10;burst(f,f.bx,f.by,14,"#fff");sfx("boss",()=>snd(260,.12,.18));
   if(b.hp<=0){const pt=score(f,300*(1+.1*U("bossr")),now);pop(f,f.bx,f.by,"+"+pt+" 👑",1);burst(f,f.bx,f.by,70);f.kills++;S.kills++;S.souls+=5+U("soul");save();f.bo=null;f.fz=0;f.nb=f.cuts+14}
  }
 }
 p.x=x;p.y=y;
});
["pointerup","pointercancel"].forEach(n=>cv.addEventListener(n,e=>{delete ptr[e.pointerId]}));
function upd(f,raw,now){ // один кадр одного поля: логіка + малювання
 const slow=now<f.sl,storm=now<f.st,fren=now<f.fr;f.ts+=((slow?.4:1)-f.ts)*.15;
 const dt=raw*f.ts,ed=dt*(storm?1.3:1),g=H*1.6*(1-.02*U("slow"));
 cx.save();cx.beginPath();cx.rect(f.ox,0,f.w,H);cx.clip();cx.translate(f.ox+(R()-.5)*f.sh,(R()-.5)*f.sh);f.sh*=.85;drawBG(f.w);
 f.sp-=dt;if(f.sp<=0){const n=1+(R()*3|0);for(let i=0;i<n;i++)setTimeout(()=>G.on&&spawn(f,storm),i*160);f.sp=(.85+R()*.6)/(storm?2:1)/(slow?1.8:1)/(fren?1.5:1)/(1+.04*U("spawn"))}
 if(f.bo&&f.bo.ty=="frz"&&!f.fz&&now>f.bo.nf)frz(f);
 f.e.forEach(e=>{e.vy+=g*ed;e.x+=e.vx*ed;e.py+=e.vy*ed;e.rot+=e.vr*ed;cx.save();cx.translate(e.x,e.py);cx.rotate(e.rot);sp(cx,e.y,e.r);cx.restore()});
 f.e=f.e.filter(e=>!e.cut&&!(e.vy>0&&e.py>H+120));
 f.h.forEach(h=>{h.vy+=g*dt;h.x+=h.vx*dt;h.py+=h.vy*dt;h.rot+=h.vr*dt;h.l-=dt;cx.save();cx.globalAlpha=Math.max(0,Math.min(1,h.l));cx.translate(h.x,h.py);cx.rotate(h.rot);cx.rotate(h.cl);cx.beginPath();cx.rect(-h.r*2,h.s>0?0:-h.r*2,h.r*4,h.r*2);cx.clip();cx.rotate(-h.cl);sp(cx,h.y,h.r);cx.restore()});
 f.h=f.h.filter(h=>h.l>0&&h.py<H+200);
 const b=f.bo;
 if(b){ // бос: аура кольору здібності + HP-бар
  b.t+=dt;f.bx=f.w/2+Math.sin(b.t*1.3)*f.w*.18;f.by=H*.38+Math.sin(b.t*2)*12;
  const C={frz:"#7dd3fc",slo:"#c084fc",sto:"#fb923c"}[b.ty];
  cx.save();cx.translate(f.bx,f.by);const ag=cx.createRadialGradient(0,0,b.r*.5,0,0,b.r*1.8);ag.addColorStop(0,C+"99");ag.addColorStop(1,C+"00");cx.fillStyle=ag;cx.beginPath();cx.arc(0,0,b.r*1.8,0,6.3);cx.fill();
  if(b.hit>0){cx.shadowColor="#fff";cx.shadowBlur=30*b.hit;b.hit-=dt*5}sp(cx,b.y,b.r);cx.restore();
  const bw=f.w*.6,bx=(f.w-bw)/2,by=H*.12+40;cx.fillStyle="#272235";cx.fillRect(bx,by,bw,10);cx.fillStyle=C;cx.fillRect(bx,by,bw*Math.max(0,b.hp)/10,10);
  cx.fillStyle="#fff";cx.font="bold 12px system-ui";cx.textAlign="center";cx.fillText({frz:"❄️ "+t("ЗАМОРОЖУЄ|FREEZES"),slo:"⏳ "+t("СПОВІЛЬНЮЄ ЧАС|SLOWS TIME"),sto:"🌪 "+t("ШТОРМ|STORM")}[b.ty]+" "+Math.max(0,b.hp)+"/10",f.w/2,by+26);
 }
 f.p.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt*1.6;cx.globalAlpha=Math.max(0,p.l);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,3,0,6.3);cx.fill()});cx.globalAlpha=1;f.p=f.p.filter(p=>p.l>0);
 f.x.forEach(q=>{q.y-=50*dt;q.l-=dt*1.2;cx.globalAlpha=Math.max(0,Math.min(1,q.l));cx.fillStyle="#ffb703";cx.font=`800 ${q.big?34:20}px system-ui`;cx.textAlign="center";cx.fillText(q.s,q.x,q.y)});cx.globalAlpha=1;f.x=f.x.filter(q=>q.l>0);
 // Слід катани (колір = колір купленого клинка) + спалах лінії розрізу
 const bl=BL[S.blade];f.tr=f.tr.filter(p=>now-p.t<200);
 f.fx.forEach(q=>{q.l-=dt*4.5;const L=80+bl.w*14;cx.save();cx.translate(q.x,q.y);cx.rotate(q.a);cx.globalAlpha=Math.max(0,q.l);const gr=cx.createLinearGradient(-L,0,L,0);gr.addColorStop(0,"#fff0");gr.addColorStop(.5,"#fff");gr.addColorStop(1,"#fff0");cx.strokeStyle=gr;cx.lineWidth=2+3*q.l;cx.shadowColor=bl.smoke;cx.shadowBlur=20;cx.beginPath();cx.moveTo(-L,0);cx.lineTo(L,0);cx.stroke();cx.restore()});
 f.fx=f.fx.filter(q=>q.l>0);
 const nn=f.tr.length;
 if(nn>2){const P=f.tr,Lh=[],Rh=[];
  for(let i=0;i<nn;i++){const a0=P[Math.max(0,i-1)],b0=P[Math.min(nn-1,i+1)];let dx=b0.x-a0.x,dy=b0.y-a0.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const wd=bl.w*2.2*Math.sin(Math.PI*i/(nn-1))*Math.max(0,1-(now-P[i].t)/200)+.4;Lh.push([P[i].x-dy*wd,P[i].y+dx*wd]);Rh.push([P[i].x+dy*wd,P[i].y-dx*wd])}
  cx.beginPath();Lh.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));for(let i=Rh.length-1;i>=0;i--)cx.lineTo(Rh[i][0],Rh[i][1]);cx.closePath();
  cx.fillStyle=bl.smoke;cx.shadowColor=bl.smoke;cx.shadowBlur=18;cx.fill();cx.shadowBlur=0}
 if(slow){const v=cx.createRadialGradient(f.w/2,H/2,H*.2,f.w/2,H/2,H*.8);v.addColorStop(0,"#0000");v.addColorStop(1,"rgba(120,60,220,.45)");cx.fillStyle=v;cx.fillRect(0,0,f.w,H)}
 if(f.fz){cx.fillStyle="rgba(160,220,255,.4)";cx.fillRect(0,0,f.w,H);cx.strokeStyle="#fff";cx.lineWidth=3;f.cr.forEach(c=>{cx.beginPath();cx.moveTo(c[0],c[1]);cx.lineTo(c[0]+60,c[1]+90);cx.lineTo(c[0]-20,c[1]+160);cx.stroke()});cx.fillStyle="#0b3a5a";cx.font="900 22px system-ui";cx.textAlign="center";cx.fillText("❄️ "+t("РОЗБИЙ ЛІД! Свайпай|BREAK THE ICE! Swipe")+" "+f.cr.length+"/5",f.w/2,H*.55)}

 cx.restore();
}
function frame(now){if(!G.on)return;const raw=Math.min(.033,(now-G.l)/1000);G.l=now;G.t-=raw;$("tm").textContent=Math.max(0,Math.ceil(G.t));cx.clearRect(0,0,W,H);G.f.forEach(f=>upd(f,raw,now));if(G.t<=0)return endRound();requestAnimationFrame(frame)}

// ═══ 10. РЕЗУЛЬТАТ РАУНДУ І РЕКЛАМА ═══
function endRound(){
 G.on=0;ptr={};setMusic("menu");
 const sc=G.f.map(f=>f.sc),best=Math.max(...sc);S.rounds++;
 let m=1;if(S.c.x2>0){m*=2;S.c.x2--}if(S.c.x3>0){m*=3;S.c.x3--}                 // бустери ×2/×3 на раунд
 const coins=Math.round(best*(1+.03*U("end")))*m;                                 // монети = очки × бонуси (🔧 формула тут)
 let tier=-1;CHT.forEach((c,i)=>{if(best>=thr(i))tier=i});                        // який сундук заробив
 if(tier>=0)S.ch[tier]++;if(S.c.chg>0){S.c.chg--;S.ch[0]++}
 S.mon+=coins;S.xp+=best;save();push();
 G.res={sc,coins,tier,m};
 if(S.rounds%CFG.adEvery==0)ad(CFG.promo.text,showRes,"",1);else showRes();       // обов'язкова реклама кожні N раундів
}
function showRes(){
 const{sc,coins,tier,m}=G.res;
 const w=G.m==2?(sc[0]==sc[1]?t("Нічия!|Draw!"):`🏆 P${sc[0]>sc[1]?1:2} ${t("перемагає|wins")}`):t("Раунд завершено|Round over");
 $("res").innerHTML=`<h2 class="text-3xl font-black text-neonGold" style="animation:pop .4s">${w}</h2><div class="text-5xl font-black font-mono">${sc.map(fmt).join(" : ")}</div><div class="text-xl">+${fmt(coins)} 文 ${m>1?"(×"+m+")":""}</div>${tier>=0?`<div class="text-xl">${CHT[tier][0]} ${t("Сундук|Chest")} +1</div>`:""}<button id="dblB" onclick="dbl(${coins})" class="btng w-full max-w-xs py-3">📺 ${t("Подвоїти монети|Double coins")}</button><button onclick="startRound(${G.m})" class="btn w-full max-w-xs py-3">${t("Ще раз|Again")}</button><button onclick="quitRound()" class="text-xs text-gray-400">${t("Закрити|Close")}</button>`;
 $("res").classList.replace("hidden","flex");hdr();
}
function dbl(c){ad(CFG.promo.text,()=>{S.mon+=c;$("dblB").disabled=true;save();hdr()},"+"+fmt(c)+" 文")}

/* Що випадає (ваги: монети, бустер, клинок, фон, знижка, тату). 🔧 ЗМІНИТИ шанси тут: більше число = частіше.

const DROP=[[55,25,10,10,0,0],[40,20,15,15,10,0],[25,15,20,20,19.6,.4],[15,10,25,25,24,1]];
const DISC=[[],[[10,80],[20,20]],[[10,50],[20,35],[30,15]],[[20,50],[30,35],[40,15]]];   // [% знижки, вага] по сундуках

 const ty=wp(DROP[k]);
 if(ty==1){const b=BS[R()*BS.length|0];return{ty:"u",id:b[0],ic:b[1],lb:t(b[2]).split(":")[0].slice(0,26),r:1}}

 return{ty:"c",a:Math.round([300,1500,6000,25000][k]*(.5+R()*1.5)),ic:"🪙",r:0}            // монети (і запасний варіант)
}

/* Як отримати тату/знижку (це видно гравцю у вкладці). 🔧 ЗМІНИТИ: числа в масивах нижче.
   Формат пункту: [текст, поточне значення, потрібне значення]. Заявка = запис у Firestore «claims»; ти перевіряєш її в адмінці. */
const need=(k)=>{
 const F=["Друзів, що дійшли до 3-го рівня|Friends who reached level 3",S.friends],D=["Днів у грі (різних)|Different days played",S.days],X=["Очки XP (за раунди)|XP points (from rounds)",S.xp],T=["Підтверджені завдання партнерів|Verified partner tasks",tasksOk()];
 return {
  d10:[[...F,1],[...D,3]],                                             // знижка 10%: 1 друг + 3 дні
  d20:[[...F,2],[...D,3]],d30:[[...F,3],[...D,5]],d40:[[...F,4],[...D,7]],
  mini:[[...X,60000],[...D,14],[...T,3],[...F,1]],                     // міні-тату
  big:[[...X,250000],[...D,30],[...T,7],[...F,5],["Реклам переглянуто|Ads watched",S.ads,30],["Босів переможено|Bosses defeated",S.kills,10]]  // велике тату
 }[k];

  <div class="text-gray-500">${t("Монети й пасивний дохід на нагороди не впливають. Купони з сундуків теж проходять перевірку.|Coins and passive income don't count. Chest coupons are verified too.")}</div></div>`+

const dstr=ts=>ts&&ts.toDate?ts.toDate().toLocaleString():"—";
function streaks(dates){ // рахує серії по СЕРВЕРНИХ датах: поточна, найдовша, усього різних днів
 const s=[...new Set(dates)].sort();let best=0,run=0,prev=null;
 for(const d of s){run=prev&&(new Date(d)-new Date(prev))==864e5?run+1:1;best=Math.max(best,run);prev=d}
 let cur=0;const last=s[s.length-1],y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 if(last==today()||last==y){cur=1;for(let i=s.length-1;i>0;i--){if((new Date(s[i])-new Date(s[i-1]))==864e5)cur++;else break}}
 return{total:s.length,best,cur,last10:s.slice(-10)};
}

async function social(k){
 if(!FBOK){alert(t("Спершу встав ключі Firebase у файлі (розділ 0).|Paste your Firebase keys first (section 0)."));return}
 if(inApp){$("inApp").classList.remove("hidden");return}
 const prov=k=="g"?new FB.GoogleAuthProvider():new FB.OAuthProvider("apple.com");
 if(k=="a"){prov.addScope("email");prov.addScope("name")}else prov.setCustomParameters({prompt:"select_account"});
 try{await FB.signInWithPopup(auth,prov)}

  save();if(S.nick){await push();logDay()}

 });

<!DOCTYPE html>
<html lang="uk" class="dark"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>INKAI by YYOKAI</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{inkDark:'#0a090d',inkCard:'#131118',inkBorder:'#272235',crimsonRed:'#ff2a5f',neonGold:'#ffb703',deepPurple:'#3b0764',cyberBlue:'#00f0ff'}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
.card{@apply bg-inkCard/85 backdrop-blur-sm border border-inkBorder rounded-2xl p-4}
.btn{@apply px-4 py-2 rounded-xl text-xs font-bold bg-crimsonRed text-white active:scale-95 transition disabled:opacity-40}
.btng{@apply px-4 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-neonGold to-crimsonRed active:scale-95 transition disabled:opacity-40}
.inp{@apply w-full bg-inkDark border border-inkBorder rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-crimsonRed}
.chip{@apply px-2.5 py-1 rounded-full text-[11px] font-bold bg-inkDark border border-inkBorder}
</style>
<style>
html,body{touch-action:pan-y;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
input,button,select,textarea{font-size:16px}
canvas{touch-action:none}
@keyframes pulse-glow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes shakeC{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}
@keyframes spinR{to{transform:rotate(360deg)}}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-75vh) translateX(var(--dx));opacity:0}}
@keyframes drift{from{transform:translate3d(var(--x0),108vh,0) rotate(0)}to{transform:translate3d(var(--x1),-20vh,0) rotate(var(--rt))}}
.glow{animation:pulse-glow 3s infinite}
html{background:#0a090d;overflow-x:hidden}body{opacity:0;transition:opacity .8s ease}body.rd{opacity:1}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes glowIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.85)}to{opacity:1;transform:none}}
.shk{animation:shakeC .22s infinite}
.dia{position:absolute;width:8px;height:8px;background:#a8854a;transform:rotate(45deg);left:-3.5px}
.dia-r{left:auto;right:-4px;top:-3px;background:#8b1a2b;box-shadow:0 0 8px #ff2a5f}
.ember{position:fixed;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#ffb703;box-shadow:0 0 8px #ff2a5f;animation:rise linear infinite;pointer-events:none}
.amb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl{position:absolute;left:0;top:0;animation:drift linear infinite;will-change:transform;opacity:.13;filter:saturate(.8)}
.logo{font-family:'Lilita One','Cormorant Garamond',Georgia,serif;font-size:clamp(58px,20vw,88px);letter-spacing:.08em;line-height:1;background:linear-gradient(100deg,#fff6d6 0%,#ffd45a 28%,#ff6a2b 52%,#ff2a5f 76%,#fff6d6 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2.5px #2a0612;animation:shineL 4s linear infinite;filter:drop-shadow(0 3px 0 #7a0f2a) drop-shadow(0 6px 0 #3a0a14) drop-shadow(0 14px 14px rgba(0,0,0,.65)) drop-shadow(0 0 22px rgba(255,42,95,.55))}
.logo-blade{height:5px;width:62%;margin:12px auto 0;border-radius:5px;background:linear-gradient(90deg,transparent,#fff,#ffb703,#ff2a5f,transparent);box-shadow:0 0 16px #ff2a5f;transform:skewX(-30deg)}
.logo-s{font-family:'Lilita One',Georgia,serif;font-size:22px;letter-spacing:.12em;background:linear-gradient(180deg,#fff,#ffc94d,#ff5c3a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.6px #2a0612}
.emj{height:1.15em;width:1.15em;display:inline-block;vertical-align:-.2em;object-fit:contain}
@keyframes chestWob{0%{transform:rotate(0) scale(1)}15%{transform:rotate(-4deg) scale(1.03,.97)}30%{transform:rotate(5deg) scale(.97,1.04)}45%{transform:rotate(-7deg) scale(1.05,.95)}60%{transform:rotate(8deg) scale(.95,1.06)}75%{transform:rotate(-10deg) scale(1.08,.93)}90%{transform:rotate(11deg) scale(1.1,.92)}100%{transform:rotate(0) scale(1.15)}}
@keyframes chestPop{0%{transform:scale(1.15);opacity:1}40%{transform:scale(1.6);opacity:1}100%{transform:scale(2.3);opacity:0}}
@keyframes flashOut{0%{opacity:.95}100%{opacity:0}}
@keyframes ringOut{0%{transform:scale(.2);opacity:.9}100%{transform:scale(3.4);opacity:0}}
@keyframes beamUp{0%{transform:scaleY(0);opacity:.95}60%{opacity:.7}100%{transform:scaleY(1);opacity:0}}
@keyframes shoot{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:0}12%{opacity:1}45%{transform:translate(calc(var(--dx)*.6),var(--uy)) rotate(calc(var(--rt)*.5)) scale(1)}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rt)) scale(.9);opacity:0}}
@keyframes dropBounce{0%{transform:translateY(-90vh) scale(.6) rotate(-15deg);opacity:0}55%{transform:translateY(8px) scale(1.12) rotate(4deg);opacity:1}72%{transform:translateY(-14px) scale(.96)}86%{transform:translateY(3px) scale(1.03)}100%{transform:none}}
@keyframes slashWipe{0%{transform:translate(-130%,-130%) rotate(-35deg);opacity:0}25%{opacity:1}100%{transform:translate(130%,130%) rotate(-35deg);opacity:0}}
@keyframes splatOut{0%{transform:translate(0,0) scale(.2);opacity:.95}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
@keyframes raysSpin{to{transform:rotate(360deg)}}
@keyframes stripIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
@keyframes shineL{to{background-position:220% 0}}
.glass{background:linear-gradient(160deg,rgba(28,23,40,.8),rgba(11,9,17,.9));border:1px solid rgba(255,183,3,.2);border-radius:26px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(12px)}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .15s}
.sbtn:active{transform:scale(.97)}
.sline{height:1px;background:linear-gradient(90deg,transparent,rgba(255,183,3,.6),transparent)}
</style></head>
<body class="bg-inkDark text-white font-sans antialiased min-h-screen flex flex-col select-none">

<div id="sat" style="position:fixed;left:0;top:0;width:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)"></div>
<div id="amb" style="position:fixed;inset:0;z-index:0;pointer-events:none;background:#0a090d url(img/app_bg.png) center/cover no-repeat"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,13,.5),rgba(10,9,13,.82))"></div></div>

<!-- ═════ ЗАСТАВКА: після завантаження лого стоїть по центру між верхом і смужками ═════ -->
<div id="splash" class="fixed inset-0 z-[120] overflow-hidden transition-opacity duration-700" style="background:linear-gradient(135deg,#efe3cf,#e2d2b8);font-family:Georgia,serif">
 <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover"><source src="bar2.mp4" type="video/mp4"></video>
 <div class="absolute inset-0" style="background:linear-gradient(90deg,rgba(236,222,200,.95) 0,rgba(236,222,200,.72) 45%,rgba(236,222,200,0) 80%)"></div>
 <img src="hero.png" onerror="this.remove()" class="absolute bottom-0 right-[-10%] h-[88%] w-auto max-w-none" style="filter:drop-shadow(0 0 30px rgba(0,0,0,.35))">
 <div class="absolute left-5 top-[5%] bottom-[5%] w-px" style="background:rgba(168,133,74,.55)"><div id="spV" class="absolute left-0 top-0 w-px" style="height:0;background:#8b1a2b;box-shadow:0 0 6px #8b1a2b"></div><i class="dia" style="top:-4px"></i><i class="dia" style="bottom:-4px"></i></div>


 <div id="spBlk" class="absolute left-[11%] right-[34%] bottom-[7%]" style="color:#8b1a2b">
  <svg viewBox="0 0 24 24" width="30" height="30" class="mb-2"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#8b1a2b"/></svg>
  <div id="spName" style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;line-height:.95;font-size:clamp(34px,12vw,64px);letter-spacing:.02em;word-break:break-word"></div>
  <div class="mt-2 text-[11px] tracking-[.35em] uppercase" style="color:#a8854a;text-transform:lowercase">by yyokai</div>
  <div class="mt-4 relative h-[2px]" style="background:rgba(168,133,74,.5)"><div id="spBar" class="absolute left-0 top-0 h-full transition-all duration-200" style="width:8%;background:#8b1a2b;box-shadow:0 0 8px #8b1a2b"><i class="dia dia-r"></i></div></div>
  <div class="flex justify-between mt-3 text-[10px] tracking-[.25em] uppercase" style="color:#a8854a"><span id="spTxt">…</span><span id="spPct">0%</span></div>
  <div id="spQ" class="mt-4 text-[10px] leading-5 tracking-[.2em] uppercase"></div>
 </div>
</div>

<!-- ═════ НІКНЕЙМ ═════ -->
<div id="nickov" class="hidden fixed inset-0 z-[110] bg-inkDark/95 flex items-center justify-center p-4">
 <div class="card rounded-3xl p-6 w-full max-w-sm space-y-3">
  <h2 class="text-xl font-black uppercase text-center" data-t="Обери нікнейм|Choose a nickname"></h2>
  <p class="text-xs text-gray-400 text-center" data-t="Його бачать інші гравці в рейтингу. Пізніше нік можна змінити в профілі.|Other players see it in the rating. You can change it later in your profile."></p>
  <div id="nickAv" class="grid grid-cols-6 gap-2"></div>
  <input id="nickIn" maxlength="16" data-p="Нікнейм (3–16 символів)|Nickname (3–16 chars)" class="inp">
  <div id="nickErr" class="text-xs text-crimsonRed min-h-[16px]"></div>
  <button onclick="saveNick()" class="btng w-full py-3 text-sm" data-t="Почати гру|Start game"></button>
 </div>
</div>

<!-- ═════ ШАПКА: 文 монети · ⛩️ душі · 💎 нефрит · 🏮 ліхтарі ═════ -->
<header id="hdr" class="sticky top-0 z-50 bg-inkDark/95 border-b border-inkBorder px-3 pb-2 flex items-center justify-between" style="padding-top:calc(env(safe-area-inset-top,0px) + .5rem)">
 <span class="logo-s">INKAI</span>
 <div class="flex items-center gap-1.5">
  <div class="flex items-center bg-inkCard border border-inkBorder px-2 py-1 rounded-full text-[11px] font-bold gap-1">
   <span id="iCoin" class="text-neonGold"></span><span id="hCoins" class="font-mono">0</span>
   <span id="iSoul" class="ml-1"></span><span id="hSouls" class="font-mono">0</span>
   <span id="iJade" class="ml-1"></span><span id="hJade" class="font-mono">0</span>
   <span id="iLan" class="ml-1"></span><span id="hLan" class="font-mono">0</span></div>
  <button onclick="toggleMusic()" id="musBtn" class="px-2 py-1 rounded-lg bg-inkCard border border-inkBorder text-xs">🔊</button>
  <button onclick="toggleLanguage()" id="langBtn" class="px-2 py-1 rounded-lg bg-inkCard border border-inkBorder text-[11px] font-bold text-gray-300">🇺🇦</button>
 </div>
</header>

<main class="flex-1 pb-24 relative z-10">
 <section id="view-play" class="view p-4 max-w-md mx-auto w-full space-y-4"></section>
 <section id="view-shop" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-chests" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-friends" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-rewards" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-rating" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-profile" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-admin" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>

 <!-- ОКРЕМИЙ ЕКРАН ВХОДУ: шапка і меню приховані, у гру пускає лише після входу -->
 <section id="view-auth" class="view hidden fixed inset-0 z-[100] overflow-y-auto bg-inkDark">
  <video autoplay muted loop playsinline class="fixed inset-0 w-full h-full object-cover opacity-30 pointer-events-none"><source src="video/auth_bg.mp4" type="video/mp4"></video>
  <div class="fixed inset-0 pointer-events-none" style="background:radial-gradient(ellipse at 50% 0%,rgba(255,42,95,.22),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(59,7,100,.5),transparent 60%),linear-gradient(180deg,rgba(10,9,13,.4),rgba(10,9,13,.85))"></div>
  <div id="ambA" class="amb"></div>
  <div class="relative z-10 min-h-full flex flex-col items-center justify-center gap-6 px-6 py-8" style="padding-top:calc(env(safe-area-inset-top,0px) + 2rem)">
   <div class="text-center w-full">
    <div class="logo">INKAI</div><div class="logo-blade"></div>
    <div class="flex items-center justify-center gap-3 mt-4"><span class="sline w-10"></span><span class="text-[10px] tracking-[.5em] text-gray-400 uppercase pl-[.5em]">by YYOKAI</span><span class="sline w-10"></span></div>
    <button class="inst mt-4 px-5 py-2 rounded-xl text-xs font-bold border border-neonGold/50 text-neonGold" data-t="📲 Встановити гру|📲 Install game"></button>
   </div>
   <div class="glass w-full max-w-sm space-y-3">
    <div id="refBanner" class="hidden text-xs text-center bg-neonGold/10 border border-neonGold/30 text-neonGold rounded-xl py-2" data-t="🎁 Тебе запросив друг — бонус після реєстрації|🎁 A friend invited you — bonus after sign-up"></div>
    <div id="inApp" class="hidden text-xs bg-crimsonRed/10 border border-crimsonRed/40 text-crimsonRed rounded-xl p-3" data-t="⚠️ Ти у вбудованому браузері (Instagram/Telegram). Google блокує там вхід. Натисни «⋯» → «Відкрити в Safari/Chrome».|⚠️ You're in an in-app browser (Instagram/Telegram). Google blocks sign-in there. Tap “⋯” → “Open in Safari/Chrome”."></div>
    <div class="text-center"><h2 class="text-lg font-black uppercase tracking-[.2em]" data-t="Увійти|Sign in"></h2><p class="text-[11px] text-gray-400 mt-1" data-t="Один дотик — і гра запам'ятає тебе|One tap and the game remembers you"></p></div>
    <button onclick="social('g')" class="sbtn bg-white text-black"><i class="fa-brands fa-google"></i><span data-t="Продовжити з Google|Continue with Google"></span></button>
    <button onclick="social('a')" class="sbtn bg-black border border-gray-600"><i class="fa-brands fa-apple"></i><span data-t="Продовжити з Apple|Continue with Apple"></span></button>
    <details class="text-xs text-gray-400"><summary class="cursor-pointer text-center py-1" data-t="Інший спосіб (email)|Other way (email)"></summary>
     <form onsubmit="authSubmit(event)" class="space-y-2 mt-2">
      <input id="aEmail" type="email" required placeholder="Email" class="inp">
      <input id="aPass" type="password" required minlength="6" data-p="Пароль (від 6 символів)|Password (6+ chars)" class="inp">
      <button id="aBtn" class="btn w-full py-3"></button>
     </form>
     <button onclick="toggleAuth()" id="aTog" class="w-full text-xs text-neonGold mt-1"></button>
    </details>
    <div class="sline"></div>
    <div class="grid grid-cols-3 gap-2 text-center text-[10px] text-gray-300">
     <div><div class="text-lg">⚔️</div><span data-t="60 катан|60 blades"></span></div>
     <div><div class="text-lg">🎁</div><span data-t="Призи й тату|Prizes & tattoos"></span></div>
     <div><div class="text-lg">👥</div><span data-t="Дуо-режим|Duo mode"></span></div>
    </div>
   </div>
   <button onclick="guest()" class="text-[11px] text-gray-500 py-2" data-t="Спробувати як гість (без нагород)|Try as guest (no prizes)"></button>
  </div>
 </section>
</main>

<!-- ═════ ГРА ═════ -->
<div id="gm" class="hidden fixed inset-0 z-[80] bg-black">
 <canvas id="cv" class="w-full h-full block"></canvas>
 <button onclick="quitRound()" class="absolute right-3 w-9 h-9 rounded-full bg-black/60 border border-white/20 text-sm" style="top:calc(env(safe-area-inset-top,0px) + 8px)">✕</button>
 <div id="res" class="hidden absolute inset-0 bg-black/55 flex-col items-center justify-center p-6 text-center gap-3 overflow-y-auto"></div>
</div>

<div id="adOv" class="hidden fixed inset-0 z-[90] bg-black/80 items-center justify-center p-6">
 <div class="w-full max-w-xs card !border-neonGold/40 rounded-3xl text-center space-y-3 glow">
  <div class="text-4xl">📣</div><h3 id="adText" class="font-black"></h3>
  <button onclick="window.open(CFG.promo.url,'_blank')" class="w-full py-2 rounded-xl bg-inkDark border border-inkBorder text-xs font-bold" data-t="Відкрити|Open"></button>
  <button id="adBtn" onclick="adClaim()" class="btng w-full py-3" disabled></button>
  <button id="adX" onclick="adClose()" class="text-xs text-gray-500" data-t="Пізніше|Later"></button>
 </div>
</div>
<div id="ro" class="hidden fixed inset-0 z-[93] bg-black/85 items-center justify-center p-3"></div>
<div id="rev" class="hidden fixed inset-0 z-[95] bg-black/90 flex-col items-center justify-center text-center overflow-hidden"></div>
<div id="pc" class="hidden fixed inset-0 z-[96] bg-black/80 items-center justify-center p-6" onclick="this.classList.replace('flex','hidden')"></div>
<div id="toast" class="hidden fixed left-4 right-4 top-16 z-[97] card !border-neonGold/50 text-xs text-center"></div>

<nav id="nav" class="fixed bottom-0 left-0 right-0 z-40 bg-inkDark/95 border-t border-inkBorder px-1 pt-2 flex justify-around" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + .5rem)">
 <button onclick="go('play')" class="nb flex flex-col items-center text-gray-400" data-g="play"><span class="nv" data-n="play" data-fa="gamepad"></span><span class="text-[9px] font-semibold mt-0.5" data-t="Гра|Play"></span></button>
 <button onclick="go('shop')" class="nb flex flex-col items-center text-gray-400" data-g="shop"><span class="nv" data-n="shop" data-fa="store"></span><span class="text-[9px] font-semibold mt-0.5" data-t="Магазин|Shop"></span></button>
 <button onclick="go('chests')" class="nb flex flex-col items-center text-gray-400" data-g="chests"><span class="nv" data-n="chests" data-fa="box-open"></span><span class="text-[9px] font-semibold mt-0.5" data-t="Сундуки|Chests"></span></button>
 <button onclick="go('friends')" class="nb flex flex-col items-center text-gray-400" data-g="friends"><span class="nv" data-n="friends" data-fa="user-plus"></span><span class="text-[9px] font-semibold mt-0.5" data-t="Друзі|Friends"></span></button>
 <button onclick="go('rewards')" class="nb flex flex-col items-center text-gray-400" data-g="rewards"><span class="nv" data-n="rewards" data-fa="gift"></span><span class="text-[9px] font-semibold mt-0.5" data-t="Нагороди|Rewards"></span></button>
 <button onclick="go('rating')" class="nb flex flex-col items-center text-gray-400" data-g="rating"><span class="nv" data-n="rating" data-fa="trophy"></span><span class="text-[9px] font-semibold mt-0.5" data-t="Рейтинг|Rating"></span></button>
 <button onclick="go('profile')" class="nb flex flex-col items-center text-gray-400" data-g="profile"><span class="nv" data-n="profile" data-fa="user"></span><span class="text-[9px] font-semibold mt-0.5" data-t="Профіль|Profile"></span></button>
</nav>

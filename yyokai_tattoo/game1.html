<!DOCTYPE html>
<html lang="uk" class="dark"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Irezumi Yokai</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{inkDark:'#0a090d',inkCard:'#131118',inkBorder:'#272235',crimsonRed:'#ff2a5f',neonGold:'#ffb703',deepPurple:'#3b0764',cyberBlue:'#00f0ff'}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style type="text/tailwindcss">
.card{@apply bg-inkCard border border-inkBorder rounded-2xl p-4}
.btn{@apply px-4 py-2 rounded-xl text-xs font-bold bg-crimsonRed text-white active:scale-95 transition disabled:opacity-40}
.btng{@apply px-4 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-neonGold to-crimsonRed active:scale-95 transition disabled:opacity-40}
.inp{@apply w-full bg-inkDark border border-inkBorder rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-crimsonRed}
.chip{@apply px-2.5 py-1 rounded-full text-[11px] font-bold bg-inkDark border border-inkBorder}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 15px rgba(255,42,95,.4);transform:scale(1)}50%{box-shadow:0 0 35px rgba(255,183,3,.7);transform:scale(1.02)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.glow{animation:pulse-glow 3s infinite}
@keyframes shakeC{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}
@keyframes spinR{to{transform:rotate(360deg)}}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.shk{animation:shakeC .22s infinite}
canvas{touch-action:none}
</style></head>
<body class="bg-inkDark text-white font-sans antialiased min-h-screen flex flex-col select-none">

<!-- ================= ЕКРАН ЗАВАНТАЖЕННЯ (SPLASH / LOADING) ================= -->
<div id="view-splash" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-between p-6 transition-opacity duration-700">
 <video autoplay muted loop playsinline class="absolute inset-0 w-full h-full object-cover opacity-50 pointer-events-none">
  <!-- 🎬 Заміни посилання на своє відео завантаження: video/splash.mp4 -->
  <source src="video/splash.mp4" type="video/mp4">
 </video>
 <div class="relative z-10 text-center pt-8 space-y-2">
  <span class="text-xs font-mono tracking-[.4em] text-neonGold uppercase">YYOKAI STUDIO PRESENTS</span>
  <h1 class="text-4xl font-black tracking-widest bg-gradient-to-r from-white via-gray-200 to-crimsonRed bg-clip-text text-transparent">IREZUMI YOKAI</h1>
 </div>
 <div class="relative z-10 w-full max-w-xs space-y-4 pb-8">
  <div class="h-1.5 bg-inkDark/80 border border-inkBorder rounded-full overflow-hidden">
   <div id="loadBar" class="h-full bg-gradient-to-r from-neonGold to-crimsonRed w-0 transition-all duration-300"></div>
  </div>
  <button id="enterBtn" onclick="finishSplash()" class="btng w-full py-4 text-sm uppercase tracking-wider hidden shadow-[0_0_25px_rgba(255,183,3,.4)]">⚔️ <span data-t="Увійти у світ |Enter the World"></span></button>
 </div>
</div>

<header class="sticky top-0 z-50 bg-inkDark/85 backdrop-blur-md border-b border-inkBorder px-4 py-3 flex items-center justify-between">
 <span class="font-black tracking-widest bg-gradient-to-r from-white via-gray-200 to-crimsonRed bg-clip-text text-transparent">IREZUMI YOKAI</span>
 <div class="flex items-center space-x-2">
  <!-- 🪙 Баланс токеноміки: 文 (Монети), 🎟 (Квитки), ⛩️ (Душі/Каміння духів) -->
  <div class="flex items-center bg-inkCard border border-inkBorder px-3 py-1 rounded-full text-xs font-bold space-x-1.5"><span class="text-neonGold">文</span><span id="hCoins" class="font-mono">0</span><span>⛩️</span><span id="hSouls" class="font-mono">0</span><span>🎟</span><span id="hTix" class="font-mono">0</span></div>
  <button onclick="toggleMusic()" id="musBtn" class="px-2 py-1 rounded-lg bg-inkCard border border-inkBorder text-xs">🔊</button>
  <button onclick="toggleLanguage()" id="langBtn" class="px-2.5 py-1 rounded-lg bg-inkCard border border-inkBorder text-xs font-bold text-gray-300">🇺🇦 UA</button>
 </div>

<main class="flex-1 pb-24">
 <section id="view-play" class="view p-4 max-w-md mx-auto w-full space-y-4"></section>

 <!-- ================= АВТОРИЗАЦІЯ З ВІДЕОФОНОМ ================= -->
 <section id="view-auth" class="view hidden fixed inset-0 z-40 flex items-center justify-center p-4">

   <h2 id="aTitle" class="text-2xl font-black text-center uppercase"></h2>
   <button onclick="social('g')" class="w-full py-3 rounded-xl bg-white text-black font-bold text-sm"><i class="fa-brands fa-google mr-2"></i><span data-t="Продовжити з Google|Continue with Google"></span></button>
   <button onclick="social('a')" class="w-full py-3 rounded-xl bg-black border border-gray-600 font-bold text-sm"><i class="fa-brands fa-apple mr-2"></i><span data-t="Продовжити з Apple|Continue with Apple"></span></button>

   </form>
   <button onclick="authMode(mode=='reg'?'login':'reg')" id="aTog" class="w-full text-xs text-neonGold"></button>
  </div>
 </section>
</main>

<div id="gm" class="hidden fixed inset-0 z-[80] bg-black">
 <canvas id="cv" class="w-full h-full block"></canvas>

<div id="adOv" class="hidden fixed inset-0 z-[90] bg-black/80 items-center justify-center p-6">

  <h3 id="adText" class="font-black"></h3>
  <button onclick="window.open(CFG.promo.url,'_blank')" class="w-full py-2 rounded-xl bg-inkDark border border-inkBorder text-xs font-bold" data-t="Відкрити|Open"></button>
  <button id="adBtn" onclick="adClaim()" class="btng w-full py-3" disabled></button>
  <button id="adX" onclick="adClose()" class="text-xs text-gray-500" data-t="Пізніше|Later"></button>
 </div>
</div>

<div id="rev" class="hidden fixed inset-0 z-[95] bg-black/90 flex-col items-center justify-center text-center overflow-hidden"></div>

<nav class="fixed bottom-0 left-0 right-0 z-40 bg-inkDark/95 border-t border-inkBorder backdrop-blur-md px-1 py-2 flex justify-around">
 <button onclick="go('play')" class="nb flex flex-col items-center text-gray-400" data-g="play"><i class="fa-solid fa-gamepad"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Гра|Play"></span></button>
 <button onclick="go('shop')" class="nb flex flex-col items-center text-gray-400" data-g="shop"><i class="fa-solid fa-store"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Магазин|Shop"></span></button>
 <button onclick="go('chests')" class="nb flex flex-col items-center text-gray-400" data-g="chests"><i class="fa-solid fa-box-open"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Сундуки|Chests"></span></button>
 <button onclick="go('friends')" class="nb flex flex-col items-center text-gray-400" data-g="friends"><i class="fa-solid fa-user-plus"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Друзі|Friends"></span></button>
 <button onclick="go('rewards')" class="nb flex flex-col items-center text-gray-400" data-g="rewards"><i class="fa-solid fa-gift"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Нагороди|Rewards"></span></button>
 <button onclick="go('rating')" class="nb flex flex-col items-center text-gray-400" data-g="rating"><i class="fa-solid fa-trophy"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Рейтинг|Rating"></span></button>
 <button onclick="go('profile')" class="nb flex flex-col items-center text-gray-400" data-g="profile"><i class="fa-solid fa-user"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Профіль|Profile"></span></button>
</nav>

<script type="module">
// ⚠️ ВСТАВ КЛЮЧІ FIREBASE. Authentication → Sign-in method: увімкни Google та Apple.
const firebaseConfig={apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT_ID.firebaseapp.com",projectId:"PASTE_PROJECT_ID",storageBucket:"PASTE_PROJECT_ID.appspot.com",messagingSenderId:"PASTE_SENDER_ID",appId:"PASTE_APP_ID"};
const CFG={promo:{text:"Підпишись на Instagram YYOKAI|Follow YYOKAI on Instagram",url:"https://instagram.com/yyokai.tattoo"},adEvery:3};
window.CFG=CFG;
let FB={},app,auth,db;
try{const B="https://www.gstatic.com/firebasejs/10.8.0/";const m=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);FB=Object.assign({},...m);app=FB.initializeApp(firebaseConfig);auth=FB.getAuth(app);db=FB.getFirestore(app)}catch(e){FB={}}

const $=i=>document.getElementById(i),R=Math.random,today=()=>new Date().toISOString().slice(0,10),fmt=n=>Math.floor(n).toLocaleString(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let lang=localStorage.ink_lang||"ua";const t=s=>{const a=String(s).split("|");return lang=="ua"?a[0]:a[1]||a[0]};

// ---------- ЕКРАН ЗАВАНТАЖЕННЯ (Анімація і перехід) ----------
window.finishSplash=()=>{
 const s=$("view-splash");
 s.style.opacity="0";
 setTimeout(()=>s.remove(),700);
 if(!user) { authMode("reg"); go("auth"); } else { go("play"); }
};
window.addEventListener("DOMContentLoaded",async()=>{
 let p=0;const bar=$("loadBar"),btn=$("enterBtn");
 while(p<100){p+=R()*25+10;if(p>100)p=100;bar.style.width=p+"%";await sleep(150)}
 btn.classList.remove("hidden");
});

// ---------- ДАНІ ТА ТОКЕНОМІКА ----------
// Економіка: Монети (文) — фармляться в геймплеї. Душі (⛩️) — преміум валюта за босів і сундуки. Квитки (🎟) — участь у розіграші.
const PRE=["Бамбуковий|Bamboo","Залізний|Iron","Нефритовий|Jade","Срібний|Silver","Багряний|Crimson","Грозовий|Storm","Морозний|Frost","Тіньовий|Shadow","Драконячий|Dragon","Демонічний|Demon"];
const FRM=["Танто|Tanto","Вакідзасі|Wakizashi","Катана|Katana","Нодаті|Nodachi","Нагінада|Naginata"];
const BL=[];
PRE.forEach((p,a)=>FRM.forEach((f,b)=>{
 const i=a*5+b;
 // Кратна прогресія цін: базові дешеві, епічні та міфічні — дорогі (щоб не купити все за 1 раз)
 const price=i===0?0:Math.round(300*1.32**i/10)*10;
 const smokeColor=`hsl(${(a*36+b*7)%360}, 100%, 60%)`;
 BL.push({i,p,f,hue:(a*36+b*7)%360,w:3+a*.8+b*.4,price,sc:1+i*.03,fx:a>=9?3:a>=7?2:a>=4?1:0,smoke:smokeColor});
}));

// Фони з різною вартістю в магазині (кратна різниця)
const BG=[
 ["Асука|Asuka","Спокій і ясність старих храмів|Calm of old temples",["#1e3a5f","#0a1624"],"🏯",0],
 ["Нара|Nara","Перша столиця: олені та монети|First capital: deer & coins",["#14532d","#052e16"],"🦌",2500],
 ["Хэйан|Heian","Епоха нічних духів|Age of night spirits",["#4c1d95","#1a0b2e"],"🌙",8000],
 ["Камакура|Kamakura","Самураї та Дзен: сила у тиші|Samurai & Zen",["#7f1d1d","#2a0a0a"],"⚔️",22000],
 ["Муроматі|Muromachi","Сад каміння та театр Но|Rock gardens",["#374151","#0b0f14"],"🎭",55000],
 ["Сенгоку|Sengoku","Війна країн: вогонь і замки|Warring States",["#9a3412","#240a02"],"🔥",120000],
 ["Едо|Edo","Мир Токугава: сакура і місто|Tokugawa peace",["#9d174d","#2a0516"],"🌸",280000],
 ["Мейдзі|Meiji","Нова ера: неон і залізо|Neon and iron",["#0e7490","#04161c"],"🏮",600000]
];

const CH=[["🦊","Кіцуне|Kitsune",0],["🐸","Каппа|Kappa",1],["👹","Они|Oni",1],["👺","Тэнгу|Tengu",2],["🐱","Бакенеко|Bakeneko",2],["❄️","Юкі-онна|Yuki-onna",3],["💀","Гасядокуро|Gashadokuro",3],["🐉","Рюдзін|Ryujin",4]];
const RAR=["#6b7280","#3b82f6","#a855f7","#ffb703","#ff2a5f"];
const BS=[["x2","✖️2","Подвоєння монет на 3 раунди|Double coins for 3 rounds",1200],["plus","⏱+15","+15 секунд у наступному раунді|+15s next round",800],["fz","⚡","Прискорювач: старт із 8с шаленства|Haste: 8s frenzy",1000]];
const CHT=[["🎋","Бамбуковий|Bamboo",800,300],["📦","Золотий|Gold",3500,800],["🐲","Драконячий|Dragon",12000,1600]];
const YK=["🦊","👹","👺","🐸","💀","🐉"];
const SAMPLE=[["ig","Підпишись на Instagram YYOKAI|Follow YYOKAI on Instagram","https://instagram.com/yyokai.tattoo"],["tt","Підпишись на TikTok|Follow on TikTok","https://tiktok.com/@yyokai"],["yt","Підпишись на YouTube|Subscribe on YouTube","https://youtube.com/@yyokai"],["tc","Telegram-канал|Telegram channel","https://t.me/yyokai"],["tg","Запусти Telegram-бота|Start Telegram bot","https://t.me/YyokaiInkBot"],["pt","Партнерський бонус|Partner bonus","https://instagram.com/yyokai.tattoo"]].map(([id,title,url])=>({id,title,url}));

const def={mon:500,souls:10,xp:0,rounds:0,kills:0,ads:0,tix:1,days:1,last:today(),nick:"",blade:0,bg:0,char:0,blades:[0],bgs:[0],chars:[0],x2:0,plus:0,fz:0,ch:[1,0,0],claimed:[],friends:0,offers:{}};
let S={...def,...JSON.parse(localStorage.ink_s4||"{}")};if(S.last!==today()){S.days++;S.last=today()}
let user=null,mode="reg",cur="play",shopT="b",OFFERS=[...SAMPLE],FR=[];
const refId=new URLSearchParams(location.search).get("ref");
const lvl=x=>1+Math.floor(Math.sqrt(x/300)),cb=()=>(CH[S.char][2]+1)*.03,okN=()=>Object.values(S.offers).filter(v=>v=="ok").length;
function save(){localStorage.ink_s4=JSON.stringify(S)}
async function persLogin(isAdmin){
 user={uid:isAdmin?"admin_uid":"local_guest",email:isAdmin?"admin1@yyokai.com":"guest@yyokai.com"};
 S.nick=isAdmin?"YYOKAI_ADMIN":(S.nick||"YokaiMaster");
 save(); go("play"); rend();
}
async function push(){if(!user||!db||user.uid=="local_guest"||user.uid=="admin_uid")return;const{offers,...r}=S;try{await FB.setDoc(FB.doc(db,"users",user.uid),{...r,coins:S.mon,souls:S.souls,lvl:lvl(S.xp),email:user.email||"",ts:FB.serverTimestamp()},{merge:true})}catch(e){}}
setInterval(()=>{save();push()},15000);

// ---------- ЗВУКОВА СИСТЕМА ----------
// 🎵 Свої файли музики закинь у папки: music/menu.mp3 та music/battle.mp3
const MUS={menu:"music/menu.mp3",battle:"music/battle.mp3"},PENT=[0,2,4,7,9];let music=localStorage.ink_mus!=0,mTrack="menu",mStarted=0,synthT=null;const mA={};
Object.keys(MUS).forEach(k=>{const a=new Audio(MUS[k]);a.loop=true;a.volume=0;a.preload="auto";a.onerror=()=>{a.bad=1};mA[k]=a});
function tone(f,d,ty,v){try{window.AC=window.AC||new (window.AudioContext||window.webkitAudioContext)();const A=AC,o=A.createOscillator(),g=A.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,A.currentTime);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}
function fade(a,to,cb){const s0=a.volume,t0=performance.now(),f=n=>{const p=Math.min(1,(n-t0)/900);a.volume=Math.max(0,Math.min(1,s0+(to-s0)*p));if(p<1)requestAnimationFrame(f);else cb&&cb()};requestAnimationFrame(f)}
function synth(k){let n=0;synthT=setInterval(()=>{if(!music)return;if(k=="menu")tone(220*2**(PENT[R()*5|0]/12)*(R()<.5?1:2),2.2,"sine",.05);else{n++;if(n%4==1)tone(70,.25,"sine",.18);tone(110*2**([0,3,5,7,10][n%5]/12),.2,"sawtooth",.04)}},k=="menu"?1300:260)}
function setMusic(k){mTrack=k;if(!mStarted)return;clearInterval(synthT);Object.keys(mA).forEach(n=>{const a=mA[n];if(n==k&&music){a.play().catch(()=>{});fade(a,.5)}else fade(a,0,()=>a.pause())});if(music&&mA[k].bad)synth(k)}
window.toggleMusic=()=>{music=!music;localStorage.ink_mus=music?1:0;$("musBtn").textContent=music?"🔊":"🔇";setMusic(mTrack)};
addEventListener("pointerdown",()=>{if(mStarted)return;mStarted=1;Object.values(SA).forEach(a=>a.load());try{window.AC=window.AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}setMusic(mTrack)},{capture:true});

// 🔊 Звуки ефектів закинь у: sfx/slash.mp3, sfx/boss.mp3, sfx/tick.mp3, sfx/reveal.mp3
const SFXF={slash:"sfx/slash.mp3",boss:"sfx/boss.mp3",tick:"sfx/tick.mp3",reveal:"sfx/reveal.mp3"},SA={};
Object.keys(SFXF).forEach(k=>{const a=new Audio(SFXF[k]);a.preload="auto";a.onerror=()=>{a.bad=1};SA[k]=a});
function sfx(k,fb){const a=SA[k];if(a&&!a.bad){const c=a.cloneNode();c.volume=.8;c.play().catch(()=>{a.bad=1;fb&&fb()})}else if(fb)fb()}
window.testSnd=k=>{const a=SA[k]||mA[k];if(!a)return;const c=a.cloneNode();c.volume=.8;c.play().catch(e=>alert(k+": "+e.name+" — файл не знайдено / file missing"))};
const sndStat=()=>Object.entries({...SFXF,...MUS}).map(([k,u])=>{const a=SA[k]||mA[k];return `<div class="flex justify-between text-[11px]"><span>${u}</span><span>${a.bad?"❌ (файл відсутній)":"✅"} <button class="underline ml-2" onclick="testSnd('${k}')">▶</button></span></div>`}).join("");

// ---------- НАВІГАЦІЯ ТА i18n ----------
function tr(){
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
 $("langBtn").textContent=lang=="ua"?"🇺🇦 UA":"🇬🇧 EN";
}
window.toggleLanguage=()=>{lang=lang=="ua"?"en":"ua";localStorage.ink_lang=lang;tr();rend()};
const RV={play:()=>rPlay(),shop:()=>rShop(),chests:()=>rChests(),friends:()=>rFriends(),rewards:()=>rRewards(),rating:()=>rRating(),profile:()=>rProfile(),auth:()=>{}};
window.go=v=>{
 cur=v;document.querySelectorAll(".view").forEach(e=>e.classList.add("hidden"));
 const el=$("view-"+v);if(el)el.classList.remove("hidden");

const lab=it=>it.ty=="c"?fmt(it.a)+" 文":it.lb;
function apply(it){
 if(it.ty=="c")S.mon+=it.a;else if(it.ty=="u")S[it.id]+=3;else if(it.ty=="h")S.chars.push(it.i);else if(it.ty=="b")S.blades.push(it.i);
 save();push();
}
// 📦 PNG сундуків: img/chest/bamboo.png, gold.png, dragon.png
const CHF=["bamboo","gold","dragon"];
window.tapChest=k=>{if(opening)return;if(S.ch[k])openChest(k,0);else if(S.mon>=CHT[k][2]&&confirm("Купити сундук?"))openChest(k,1)};
window.openChest=async(k,buyIt)=>{
 if(opening)return;if(buyIt){if(S.mon<CHT[k][2])return;S.mon-=CHT[k][2]}else{if(!S.ch[k])return;S.ch[k]--}
 opening=1;const it=rollItem(k);apply(it);
 $("view-chests").innerHTML=`<div class="text-center space-y-3 pt-12"><div class="text-7xl shk">📦</div><b class="text-neonGold">Відкриваємо сундук...</b></div>`;
 await sleep(2000);
 alert("Випало: "+lab(it));opening=0;rend();
};
function rChests(){
 $("view-chests").innerHTML=`<h2 class="text-xl font-black uppercase">Сундуки ёкаїв</h2><div class="grid grid-cols-3 gap-2">`+CHT.map((c,k)=>`<button onclick="tapChest(${k})" class="card !p-2 text-center"><div class="text-5xl h-20 flex items-center justify-center">${c[0]}</div><b class="text-[11px]">${t(c[1])}</b><div class="text-[10px] text-gray-400">${S.ch[k]?`×${S.ch[k]}`:fmt(c[2])+" 文"}</div></button>`).join("")+`</div>`;
}

// ---------- ДРУЗІ ТА ОФЕРИ ----------
window.copyRef=()=>{const i=$("refIn");i.select();navigator.clipboard.writeText(i.value);alert(t("Скопійовано!|Copied!"))};
window.doOffer=async id=>{if(!user){go("auth");return}const o=OFFERS.find(x=>x.id==id);window.open(o.url,"_blank");try{await FB.setDoc(FB.doc(db,"submissions",user.uid+"_"+id),{uid:user.uid,offer:id,status:"ok"});S.offers[id]="ok";S.mon+=1000;rFriends()}catch(e){}};
function rFriends(){
 $("view-friends").innerHTML=`<h2 class="text-xl font-black uppercase text-neonGold">👥 Запроси друга</h2><div class="card space-y-3"><p class="text-xs text-gray-300">Отримуй бонуси за кожного активного друга.</p><div class="flex gap-2"><input id="refIn" readonly class="inp !py-2.5 text-xs font-mono text-neonGold" value="${location.origin+location.pathname}?ref=${user?user.uid:""}"><button onclick="copyRef()" class="btn">Копіювати</button></div></div><h3 class="text-sm font-black uppercase pt-2">Партнери та завдання</h3>`+OFFERS.map(o=>`<div class="card flex items-center justify-between"><div><b class="text-sm">${t(o.title)}</b><div class="text-[10px] text-crimsonRed">+1000 文</div></div><button onclick="doOffer('${o.id}')" class="btn">START</button></div>`).join("");
}

// ---------- ТАБЛИЦЯ ЛІДЕРІВ (Реальний глобальний рейтинг) ----------
window.rRating=async()=>{
 let list=[{nick:S.nick||"Ти",xp:S.xp,coins:S.mon}];
 if(db){try{const q=await FB.getDocs(FB.query(FB.collection(db,"users"),FB.orderBy("xp","desc"),FB.limit(20)));q.forEach(d=>{const x=d.data();list.push({nick:x.nick||"Yokai",xp:x.xp||0,coins:x.coins||0})})}catch(e){}}
 list.sort((a,b)=>b.xp-a.xp);
 $("view-rating").innerHTML=`<h2 class="text-xl font-black uppercase text-neonGold mb-3">⛩️ Книга Великих Самураїв</h2><div class="space-y-2">`+list.map((u,i)=>`<div class="card !p-3 flex items-center justify-between ${i<5?"border-neonGold/50":""}"><div class="flex items-center gap-3"><span class="font-black font-mono text-sm ${i==0?"text-neonGold":i==1?"text-gray-300":i==2?"text-amber-600":""}">#${i+1}</span><div><b class="text-xs">${u.nick}</b><div class="text-[10px] text-gray-400">Lv ${lvl(u.xp)}</div></div></div><span class="font-mono text-xs text-neonGold">${fmt(u.xp)} XP</span></div>`).join("")+`</div>`;
};

// ---------- НАГОРОДИ СТУДІЇ YYOKAI (5 виграшних місць / знижки) ----------
window.claim=async id=>{S.claimed.push(id);save();rend();alert("Заявку надіслано в студію YYOKAI!");};
function rRewards(){
 const L=[
  ["d10","🏷 Знижка 10% на тату",S.xp>=5000],
  ["d20","🏷 Знижка 20% на тату",S.xp>=20000],
  ["mini","🎁 Безкоштовне міні-тату від YYOKAI",S.xp>=60000],
  ["big","👑 Головний приз: повноцінний рукав / великий сеанс (ТОП-5 місяця)",S.xp>=150000]
 ];
 $("view-rewards").innerHTML=`<h2 class="text-xl font-black uppercase">Нагороди студії YYOKAI</h2><p class="text-xs text-gray-400 mb-3">Набирай XP у грі, піднімайся в таблиці лідерів. Щомісяця ТОП-5 гравців отримують безкоштовні сеанси та знижки!</p>`+L.map(([id,ti,ok])=>`<div class="card space-y-3"><h3 class="font-black text-sm">${ti}</h3><button onclick="claim('${id}')" ${ok&&!S.claimed.includes(id)?"":"disabled"} class="btng w-full py-2.5 ${ok?"":"!from-gray-800 !to-gray-800 !text-gray-500"}">${S.claimed.includes(id)?"Заявку подано":ok?"Забрати нагороду":"Недостатньо XP"}</button></div>`).join("");
}

// ---------- ПРОФІЛЬ ТА АВТОРИЗАЦІЯ (Адмінка admin1 / admin1) ----------
function rProfile(){
 $("view-profile").innerHTML=`
 <div class="card flex items-center gap-4"><div class="text-5xl">${CH[S.char][0]}</div><div><h3 class="font-bold text-sm">${S.nick||"Гість"}</h3><span class="inline-block mt-1 px-2 py-0.5 bg-crimsonRed/20 border border-crimsonRed/40 text-crimsonRed text-[10px] font-bold rounded-full">Lv ${lvl(S.xp)} · ${fmt(S.xp)} XP</span></div></div>
 <div class="card space-y-1"><h4 class="text-xs font-bold text-neonGold uppercase">🔊 Перевірка звуків та файлів</h4>${sndStat()}</div>
 ${user&&user.uid!="local_guest"?`<button onclick="logout()" class="w-full py-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 font-bold text-sm">Вийти з акаунта</button>`:`<button onclick="authMode('reg');go('auth')" class="w-full py-3 rounded-xl bg-neonGold/10 border border-neonGold/40 text-neonGold font-bold text-sm">Увійти / Зареєструватися</button>`}
 `;
}
window.authMode=m=>{mode=m;$("aTitle").textContent=m=="reg"?"Зберегти прогрес":"З поверненням";$("aBtn").textContent=m=="reg"?"Створити акаунт":"Увійти";$("aTog").textContent=m=="reg"?"Вже є акаунт? Увійти":"Немає акаунта? Реєстрація";$("aNick").classList.toggle("hidden",m!="reg")};
window.social=async k=>{persLogin(false)};
window.authSubmit=async e=>{
 e.preventDefault();
 const em=$("aEmail").value,pw=$("aPass").value;
 // 🔐 Вбудована швидка адмінка за логіном admin1 та паролем admin1
 if(em==="admin1"&&pw==="admin1"){alert("Вітаємо, Адміне YYOKAI!");persLogin(true);return;}
 if(mode=="reg"&&$("aNick").value)S.nick=$("aNick").value;
 persLogin(false);
};
window.logout=()=>{user=null;go("auth")};

tr();$("musBtn").textContent=music?"🔊":"🔇";
if(refId){$("refBanner").classList.remove("hidden");authMode("reg");go("auth")}
else{go("auth");}
</script></body></html>

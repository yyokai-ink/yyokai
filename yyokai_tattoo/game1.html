<!DOCTYPE html>
<html lang="uk" class="dark"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{inkDark:'#0a090d',inkCard:'#131118',inkBorder:'#272235',crimsonRed:'#ff2a5f',neonGold:'#ffb703',deepPurple:'#3b0764',cyberBlue:'#00f0ff'}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style type="text/tailwindcss">
.card{@apply bg-inkCard border border-inkBorder rounded-2xl p-4}
.btn{@apply px-4 py-2 rounded-xl text-xs font-bold bg-crimsonRed text-white active:scale-95 transition disabled:opacity-40}

.chip{@apply px-2.5 py-1 rounded-full text-[11px] font-bold bg-inkDark border border-inkBorder}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 15px rgba(255,42,95,.4);transform:scale(1)}50%{box-shadow:0 0 35px rgba(255,183,3,.7);transform:scale(1.02)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.glow{animation:pulse-glow 3s infinite}
@keyframes shakeC{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}
@keyframes spinR{to{transform:rotate(360deg)}}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.shk{animation:shakeC .22s infinite}
canvas{touch-action:none}
</style></head>
<body class="bg-inkDark text-white font-sans antialiased min-h-screen flex flex-col select-none">

<header class="sticky top-0 z-50 bg-inkDark/85 backdrop-blur-md border-b border-inkBorder px-4 py-3 flex items-center justify-between">
 <span class="font-black tracking-widest bg-gradient-to-r from-white via-gray-200 to-crimsonRed bg-clip-text text-transparent">IREZUMI YOKAI</span>
 <div class="flex items-center space-x-2">
  <div class="flex items-center bg-inkCard border border-inkBorder px-3 py-1 rounded-full text-xs font-bold space-x-1.5"><span class="text-neonGold">文</span><span id="hCoins" class="font-mono">0</span><span>🎟</span><span id="hTix" class="font-mono">0</span></div>
  <button onclick="toggleMusic()" id="musBtn" class="px-2 py-1 rounded-lg bg-inkCard border border-inkBorder text-xs">🔊</button><button onclick="toggleLanguage()" id="langBtn" class="px-2.5 py-1 rounded-lg bg-inkCard border border-inkBorder text-xs font-bold text-gray-300"></button>
 </div>
</header>

<main class="flex-1 pb-24">
 <section id="view-play" class="view p-4 max-w-md mx-auto w-full space-y-4"></section>
 <section id="view-shop" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-chests" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-friends" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-rewards" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-profile" class="view hidden p-4 max-w-md mx-auto w-full space-y-3"></section>
 <section id="view-auth" class="view hidden p-4 max-w-sm mx-auto w-full">
  <div class="card rounded-3xl p-6 space-y-3">
   <div id="refBanner" class="hidden text-xs text-center bg-neonGold/10 border border-neonGold/30 text-neonGold rounded-xl py-2" data-t="🎁 Тебе запросив друг — бонус після реєстрації|🎁 A friend invited you — bonus after sign-up"></div>
   <h2 id="aTitle" class="text-2xl font-black text-center uppercase"></h2>
   <button onclick="social('g')" class="w-full py-3 rounded-xl bg-white text-black font-bold text-sm"><i class="fa-brands fa-google mr-2"></i><span data-t="Продовжити з Google|Continue with Google"></span></button>
   <button onclick="social('a')" class="w-full py-3 rounded-xl bg-black border border-gray-600 font-bold text-sm"><i class="fa-brands fa-apple mr-2"></i><span data-t="Продовжити з Apple|Continue with Apple"></span></button>
   <form onsubmit="authSubmit(event)" class="space-y-3"><input id="aEmail" type="email" required placeholder="Email" class="inp"><input id="aPass" type="password" required minlength="6" data-p="Пароль (від 6 символів)|Password (6+ chars)" class="inp"><input id="aNick" maxlength="16" data-p="Нікнейм (для реєстрації)|Nickname (for sign-up)" class="inp"><button id="aBtn" class="btn w-full py-3.5 text-sm"></button></form>
   <button onclick="authMode(mode=='reg'?'login':'reg')" id="aTog" class="w-full text-xs text-neonGold"></button>
  </div>
 </section>
</main>

<div id="gm" class="hidden fixed inset-0 z-[80] bg-black">
 <canvas id="cv" class="w-full h-full block"></canvas>
 <div id="tm" class="absolute left-0 right-0 text-center text-3xl font-black font-mono pointer-events-none" style="top:calc(env(safe-area-inset-top,0px) + 8px)"></div>
 <button onclick="quitRound()" class="absolute right-3 w-9 h-9 rounded-full bg-black/60 border border-white/20 text-sm" style="top:calc(env(safe-area-inset-top,0px) + 8px)">✕</button>
 <div id="res" class="hidden absolute inset-0 bg-black/85 flex-col items-center justify-center p-6 text-center gap-3"></div>
</div>
<div id="adOv" class="hidden fixed inset-0 z-[90] bg-black/80 items-center justify-center p-6"><div class="w-full max-w-xs card !border-neonGold/40 rounded-3xl text-center space-y-3 glow"><div class="text-4xl">📣</div><h3 id="adText" class="font-black"></h3><button onclick="window.open(CFG.promo.url,'_blank')" class="w-full py-2 rounded-xl bg-inkDark border border-inkBorder text-xs font-bold" data-t="Відкрити|Open"></button><button id="adBtn" onclick="adClaim()" class="btng w-full py-3" disabled></button><button id="adX" onclick="adClose()" class="text-xs text-gray-500" data-t="Пізніше|Later"></button></div></div>

<div id="rev" class="hidden fixed inset-0 z-[95] bg-black/90 flex-col items-center justify-center text-center overflow-hidden"></div>
<nav class="fixed bottom-0 left-0 right-0 z-40 bg-inkDark/95 border-t border-inkBorder backdrop-blur-md px-1.5 py-2 flex justify-around">
 <button onclick="go('play')" class="nb flex flex-col items-center text-gray-400" data-g="play"><i class="fa-solid fa-gamepad"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Гра|Play"></span></button>
 <button onclick="go('shop')" class="nb flex flex-col items-center text-gray-400" data-g="shop"><i class="fa-solid fa-store"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Магазин|Shop"></span></button>
 <button onclick="go('chests')" class="nb flex flex-col items-center text-gray-400" data-g="chests"><i class="fa-solid fa-box-open"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Сундуки|Chests"></span></button>
 <button onclick="go('friends')" class="nb flex flex-col items-center text-gray-400" data-g="friends"><i class="fa-solid fa-user-plus"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Друзі|Friends"></span></button>
 <button onclick="go('rewards')" class="nb flex flex-col items-center text-gray-400" data-g="rewards"><i class="fa-solid fa-gift"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Нагороди|Rewards"></span></button>
 <button onclick="go('profile')" class="nb flex flex-col items-center text-gray-400" data-g="profile"><i class="fa-solid fa-user"></i><span class="text-[9px] font-semibold mt-0.5" data-t="Профіль|Profile"></span></button>
</nav>

<script type="module">
// ⚠️ ВСТАВ КЛЮЧІ FIREBASE. Authentication → Sign-in method: увімкни Google та Apple.
const firebaseConfig={apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT_ID.firebaseapp.com",projectId:"PASTE_PROJECT_ID",storageBucket:"PASTE_PROJECT_ID.appspot.com",messagingSenderId:"PASTE_SENDER_ID",appId:"PASTE_APP_ID"};
const CFG={promo:{text:"Підпишись на Instagram студії|Follow the studio on Instagram",url:"https://instagram.com/yyokai.tattoo"},adEvery:3};
window.CFG=CFG;
let FB={},app,auth,db;
try{const B="https://www.gstatic.com/firebasejs/10.8.0/";const m=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);FB=Object.assign({},...m);app=FB.initializeApp(firebaseConfig);auth=FB.getAuth(app);db=FB.getFirestore(app)}catch(e){FB={}}

const $=i=>document.getElementById(i),R=Math.random,today=()=>new Date().toISOString().slice(0,10),fmt=n=>Math.floor(n).toLocaleString(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let lang=localStorage.ink_lang||"ua";const t=s=>{const a=String(s).split("|");return lang=="ua"?a[0]:a[1]||a[0]};

// ---------- ДАНІ ----------
const PRE=["Бамбуковий|Bamboo","Залізний|Iron","Нефритовий|Jade","Срібний|Silver","Багряний|Crimson","Грозовий|Storm","Морозний|Frost","Тіньовий|Shadow","Драконячий|Dragon","Демонічний|Demon"];
const FRM=["Танто|Tanto","Вакідзасі|Wakizashi","Катана|Katana","Нодаті|Nodachi","Нагінада|Naginata"];
const BL=[];PRE.forEach((p,a)=>FRM.forEach((f,b)=>{const i=a*5+b;BL.push({i,p,f,hue:(a*36+b*7)%360,w:3+a*.8+b*.4,price:i?Math.round(150*1.2**i/10)*10:0,sc:1+i*.03,fx:a>=9?3:a>=7?2:a>=4?1:0})}));
const BG=[["Асука|Asuka","Прихід буддизму — спокій і ясність|Arrival of Buddhism — calm and clarity",["#1e3a5f","#0a1624"],"🏯",0],["Нара|Nara","Перша столиця: олені та монети Вадо|First capital: deer and Wadō coins",["#14532d","#052e16"],"🦌",400],["Хэйан|Heian","Епоха поезії та нічних духів|Age of poetry and night spirits",["#4c1d95","#1a0b2e"],"🌙",1500],["Камакура|Kamakura","Самураї та Дзен: сила у тиші|Samurai & Zen: strength in silence",["#7f1d1d","#2a0a0a"],"⚔️",4000],["Муроматі|Muromachi","Сад каміння та театр Но|Rock gardens and Noh theatre",["#374151","#0b0f14"],"🎭",9000],["Сенгоку|Sengoku","Війна країн: вогонь і замки|Warring States: fire and castles",["#9a3412","#240a02"],"🔥",20000],["Едо|Edo","Мир Токугава: місто і сакура|Tokugawa peace: city and sakura",["#9d174d","#2a0516"],"🌸",50000],["Мейдзі|Meiji","Нова ера: неон і залізо|New era: neon and iron",["#0e7490","#04161c"],"🏮",120000]];
const CH=[["🦊","Кіцуне|Kitsune",0],["🐸","Каппа|Kappa",1],["👹","Они|Oni",1],["👺","Тэнгу|Tengu",2],["🐱","Бакенеко|Bakeneko",2],["❄️","Юкі-онна|Yuki-onna",3],["💀","Гасядокуро|Gashadokuro",3],["🐉","Рюдзін|Ryujin",4]];
const RAR=["#6b7280","#3b82f6","#a855f7","#ffb703","#ff2a5f"];
const BS=[["x2","✖️2","Подвоєння монет на 3 раунди|Double coins for 3 rounds",800],["plus","⏱+15","+15 секунд у наступному раунді|+15 seconds next round",500],["fz","⚡","Прискорювач: старт із 8с шаленства|Haste: start with 8s frenzy",600]];
const CHT=[["🎋","Бамбуковий|Bamboo",500,300],["📦","Золотий|Gold",2500,800],["🐲","Драконячий|Dragon",10000,1600]];
const YK=["🦊","👹","👺","🐸","💀","🐉"];
const SAMPLE=[["ig","Підпишись на Instagram|Follow on Instagram","https://instagram.com/yyokai.tattoo"],["tt","Підпишись на TikTok|Follow on TikTok","https://tiktok.com/@your"],["yt","Підпишись на YouTube|Subscribe on YouTube","https://youtube.com/@your"],["tc","Telegram-канал|Telegram channel","https://t.me/your"],["tg","Запусти Telegram-бота|Start the Telegram bot","https://t.me/YyokaiInkBot"],["pt","Партнер: бонус за дію|Partner: action bonus","https://example.com"]].map(([id,title,url])=>({id,title,url}));

const def={mon:300,xp:0,rounds:0,kills:0,ads:0,tix:0,days:1,last:today(),nick:"",blade:0,bg:0,char:0,blades:[0],bgs:[0],chars:[0],x2:0,plus:0,fz:0,ch:[1,0,0],claimed:[],friends:0,offers:{}};
let S={...def,...JSON.parse(localStorage.ink_s3||"{}")};if(S.last!==today()){S.days++;S.last=today()}
let user=null,mode="reg",cur="play",shopT="b",OFFERS=[...SAMPLE],FR=[];
const refId=new URLSearchParams(location.search).get("ref");
const lvl=x=>1+Math.floor(Math.sqrt(x/300)),cb=()=>(CH[S.char][2]+1)*.03,okN=()=>Object.values(S.offers).filter(v=>v=="ok").length;
function save(){localStorage.ink_s3=JSON.stringify(S)}
async function push(){if(!user||!db)return;const{offers,...r}=S;try{await FB.setDoc(FB.doc(db,"users",user.uid),{...r,coins:S.mon,lvl:lvl(S.xp),email:user.email||"",ts:FB.serverTimestamp()},{merge:true})}catch(e){}}
setInterval(()=>{save();push()},15000);
const snd=(f,d=.09,v=.12)=>{try{window.AC=window.AC||new (window.AudioContext||window.webkitAudioContext)();const A=AC,o=A.createOscillator(),g=A.createGain();o.type="sawtooth";o.frequency.setValueAtTime(f,A.currentTime);o.frequency.exponentialRampToValueAtTime(f/4,A.currentTime+d);g.gain.setValueAtTime(v,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}};

// ---------- МУЗИКА: м'яка в меню, бойова в раунді ----------
// 🎵 Свої треки: menu.mp3 (спокійна) і battle.mp3 (бойова). Нема файлу — тихий синтезований фон.
const MUS={menu:"menu.mp3",battle:"battle.mp3"},PENT=[0,2,4,7,9];let music=localStorage.ink_mus!=0,mTrack="menu",mStarted=0,synthT=null;const mA={};
Object.keys(MUS).forEach(k=>{const a=new Audio(MUS[k]);a.loop=true;a.volume=0;a.preload="auto";a.onerror=()=>{a.bad=1};mA[k]=a});
function tone(f,d,ty,v){try{window.AC=window.AC||new (window.AudioContext||window.webkitAudioContext)();const A=AC,o=A.createOscillator(),g=A.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,A.currentTime);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}
function fade(a,to,cb){const s0=a.volume,t0=performance.now(),f=n=>{const p=Math.min(1,(n-t0)/900);a.volume=Math.max(0,Math.min(1,s0+(to-s0)*p));if(p<1)requestAnimationFrame(f);else cb&&cb()};requestAnimationFrame(f)}
function synth(k){let n=0;synthT=setInterval(()=>{if(!music)return;if(k=="menu")tone(220*2**(PENT[R()*5|0]/12)*(R()<.5?1:2),2.2,"sine",.05);else{n++;if(n%4==1)tone(70,.25,"sine",.18);tone(110*2**([0,3,5,7,10][n%5]/12),.2,"sawtooth",.04)}},k=="menu"?1300:260)}
function setMusic(k){mTrack=k;if(!mStarted)return;clearInterval(synthT);Object.keys(mA).forEach(n=>{const a=mA[n];if(n==k&&music){a.play().catch(()=>{});fade(a,.5)}else fade(a,0,()=>a.pause())});if(music&&mA[k].bad)synth(k)}
window.toggleMusic=()=>{music=!music;localStorage.ink_mus=music?1:0;$("musBtn").textContent=music?"🔊":"🔇";setMusic(mTrack)};
addEventListener("pointerdown",()=>{if(mStarted)return;mStarted=1;Object.values(SA).forEach(a=>a.load());try{window.AC=window.AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}setMusic(mTrack)},{capture:true});

// 🔊 Звуки ефектів: slash.mp3 (розріз), boss.mp3 (удар по босу), tick.mp3 (клац у рулетці), reveal.mp3 (відкриття призу). Нема файлу — звучить синтез.
const SFXF={slash:"Звук для розрезания.mp3",boss:"boss.mp3",tick:"tick.mp3",reveal:"reveal.mp3"},SA={};
Object.keys(SFXF).forEach(k=>{const a=new Audio(SFXF[k]);a.preload="auto";a.onerror=()=>{a.bad=1};SA[k]=a});
function sfx(k,fb){const a=SA[k];if(a&&!a.bad){const c=a.cloneNode();c.volume=.8;c.play().catch(()=>{a.bad=1;fb&&fb()})}else if(fb)fb()}
window.testSnd=k=>{const a=SA[k]||mA[k];if(!a)return;const c=a.cloneNode();c.volume=.8;c.play().catch(e=>alert(k+": "+e.name+" — "+(a.bad?"файл не знайдено / file not found":"")))};
const sndStat=()=>Object.entries({...SFXF,...MUS}).map(([k,u])=>{const a=SA[k]||mA[k];return `<div class="flex justify-between text-[11px]"><span>${u}</span><span>${a.bad?"❌":a.readyState>=2?"✅":"⏳"} <button class="underline" onclick="testSnd('${k}')">▶</button></span></div>`}).join("");

// ---------- i18n / навігація ----------
function tr(){document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));$("langBtn").textContent=lang=="ua"?"🇺🇦 UA":"🇬🇧 EN";authMode(mode)}
window.toggleLanguage=()=>{lang=lang=="ua"?"en":"ua";localStorage.ink_lang=lang;tr();rend()};
const RV={play:()=>rPlay(),shop:()=>rShop(),chests:()=>rChests(),friends:()=>rFriends(),rewards:()=>rRewards(),profile:()=>rProfile(),auth:()=>{}};
function rend(){$("hCoins").textContent=fmt(S.mon);$("hTix").textContent=S.tix;if(!(cur=="chests"&&opening))RV[cur]()}
window.go=v=>{cur=v;document.querySelectorAll(".view").forEach(e=>e.classList.add("hidden"));$("view-"+v).classList.remove("hidden");document.querySelectorAll(".nb").forEach(b=>{const a=b.dataset.g==v;b.classList.toggle("text-crimsonRed",a);b.classList.toggle("text-gray-400",!a)});rend()};
const bar=(b)=>`<div class="h-2 rounded-full" style="background:linear-gradient(90deg,hsl(${b.hue},100%,50%),#fff);box-shadow:0 0 ${6+b.fx*5}px hsl(${b.hue},100%,55%)"></div>`;
const bname=b=>t(PRE[b.i/5|0])+" "+t(FRM[b.i%5]);

// ---------- ГОЛОВНА ----------
function rPlay(){const b=BL[S.blade],g=BG[S.bg],left=CFG.adEvery-S.rounds%CFG.adEvery;
 $("view-play").innerHTML=`<div class="card space-y-3 text-center" style="background:url(img/bg/${S.bg}.png) center/cover,linear-gradient(180deg,${g[2][0]},${g[2][1]})"><div class="text-5xl">${CH[S.char][0]}</div><div class="text-xs text-gray-300">${t(g[0])} · ${bname(b)}</div>${bar(b)}<div class="flex justify-center gap-2 flex-wrap">${S.x2?`<span class="chip text-neonGold">✖️2 ×${S.x2}</span>`:""}${S.plus?`<span class="chip">⏱+15 ×${S.plus}</span>`:""}${S.fz?`<span class="chip">⚡ ×${S.fz}</span>`:""}<span class="chip">Lv ${lvl(S.xp)}</span></div></div>
 <button onclick="startRound(1)" class="btng w-full py-4 text-base">⚔️ ${t("СОЛО · 1 хвилина|SOLO · 1 minute")}</button>
 <button onclick="startRound(2)" class="btn w-full py-3 text-sm">👥 ${t("ДУО · 2 гравці на одному екрані|DUO · 2 players, one screen")}</button>
 <div class="card text-xs text-gray-300 space-y-1"><div>🎯 ${t("Цілі раунду: 300 → 🎋, 800 → 📦, 1600 → 🐲 сундук|Round goals: 300 → 🎋, 800 → 📦, 1600 → 🐲 chest")}</div><div>📣 ${t("Реклама через раундів|Ad in rounds")}: <b>${left}</b></div></div>`}

// ---------- РАУНД ----------
const cv=$("cv"),cx=cv.getContext("2d"),oc=document.createElement("canvas"),oq=oc.getContext("2d");let W,H,D=1,G={on:0},ptr={};
function rs(){D=Math.min(3,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}addEventListener("resize",()=>{if($("gm").classList.contains("hidden")==false)rs()});
const mkF=(ox,w)=>({ox,w,fx:[],e:[],h:[],p:[],x:[],tr:[],sc:0,cb:0,cT:0,cuts:0,nb:12,bo:null,sp:.4,fz:0,cr:[],fp:0,sl:0,st:0,fr:0,sh:0,fl:0,ts:1,kills:0});
window.startRound=m=>{if(G.on)return;$("gm").classList.remove("hidden");$("res").classList.replace("flex","hidden");rs();const n=Date.now()>0?m:1,fw=W/n;G={on:1,m:n,t:60+(S.plus>0?15:0),f:[...Array(n)].map((_,i)=>mkF(i*fw,fw)),l:performance.now()};if(S.plus>0)S.plus--;if(S.fz>0){S.fz--;G.f.forEach(f=>f.fr=performance.now()+8000)}save();snd(300,.2);setMusic("battle");requestAnimationFrame(frame)};

 if(ty==0)return{ty:"c",a:Math.round([200,1000,4000][k]*(.5+R()*1.5)),ic:"🪙",r:0};
 if(ty==1){const b=BS[R()*3|0];return{ty:"u",id:b[0],ic:b[1],lb:t(b[2]).split(":")[0].slice(0,14),r:1}}
 if(ty==2){const c=CH.filter(x=>x[2]<=k+2),ch=c[R()*c.length|0],i=CH.indexOf(ch);return{ty:"h",i,ic:ch[0],lb:t(ch[1]),r:ch[2]}}
 if(ty==3){const l=BL.filter(b=>!S.blades.includes(b.i)&&b.i<[12,30,50][k]);if(l.length){const b=l[R()*l.length|0];return{ty:"b",i:b.i,ic:"🗡",lb:bname(b),r:Math.min(4,b.i/10|0)}}}
 if(ty==4){const l=BG.map((g,i)=>i).filter(i=>!S.bgs.includes(i));if(l.length){const i=l[R()*l.length|0];return{ty:"g",i,ic:BG[i][3],lb:t(BG[i][0]),r:Math.min(4,1+i/2|0)}}}
 if(ty==5)return{ty:"t",ic:"🎟",lb:t("Квиток на тату|Tattoo ticket"),r:4};
 return{ty:"c",a:Math.round([200,1000,4000][k]*(.5+R()*1.5)),ic:"🪙",r:0}}

function apply(it){let m="";if(it.ty=="c")S.mon+=it.a;else if(it.ty=="u")S[it.id]+=it.id=="x2"?3:1;else if(it.ty=="h"){if(S.chars.includes(it.i)){const c=300*(CH[it.i][2]+1);S.mon+=c;m=t("Дубль → |Duplicate → ")+c+" 文"}else{S.chars.push(it.i);S.char=it.i;m=t("Новий персонаж! +|New character! +")+Math.round((CH[it.i][2]+1)*3)+"% 文"}}else if(it.ty=="b"){S.blades.push(it.i);S.blade=it.i}else if(it.ty=="g"){S.bgs.push(it.i);S.bg=it.i}else if(it.ty=="t")S.tix++;save();push();return m}

function rainCoins(n){const o=$("rev");for(let i=0;i<n;i++){const e=document.createElement("span");e.textContent="🪙";e.style.cssText=`position:fixed;top:-30px;left:${R()*100}%;font-size:${16+R()*20}px;animation:fall ${1.2+R()}s ${R()*.8}s ease-in forwards;pointer-events:none`;o.appendChild(e);setTimeout(()=>e.remove(),3200)}}
function reveal(it,m){const c=RAR[it.r],ov=$("rev");ov.innerHTML=`<div class="absolute inset-0 opacity-70" style="background:conic-gradient(${c}00,${c}99,${c}00,${c}99,${c}00,${c}99,${c}00);animation:spinR 7s linear infinite;-webkit-mask:radial-gradient(circle,#000 15%,transparent 70%);mask:radial-gradient(circle,#000 15%,transparent 70%)"></div><div class="relative space-y-3 px-6"><div class="text-xs font-black tracking-[.3em]" style="color:${c}">${t(["ЗВИЧАЙНИЙ|COMMON","РІДКІСНИЙ|RARE","ЕПІЧНИЙ|EPIC","ЛЕГЕНДАРНИЙ|LEGENDARY","МІФІЧНИЙ|MYTHIC"][it.r])}</div><div class="text-8xl" style="animation:pop .5s;filter:drop-shadow(0 0 30px ${c})">${it.ic}</div><div class="text-2xl font-black" style="color:${c}">${lab(it)}</div><div class="text-xs text-gray-300">${m}</div><button class="btng px-10 py-3" onclick="closeRev()">OK</button></div>`;ov.classList.replace("hidden","flex");sfx("reveal",()=>[0,4,7,12].slice(0,2+it.r).forEach((st,i)=>setTimeout(()=>tone(330*2**(st/12),.7,"triangle",.14),i*140)));if(it.r>=2)rainCoins(30+it.r*15)}

 for(let i=0;i<10;i++){tone(80+i*20,.12,"sine",.2);await sleep(130)}
 $("view-chests").innerHTML=`<h2 class="text-center font-black text-neonGold">${CHT[k][0]} ${t(CHT[k][1])}</h2><div class="relative overflow-hidden rounded-2xl border border-neonGold/50 bg-black/60" id="rbox"><div id="rmark" class="absolute left-1/2 top-0 bottom-0 w-1 -ml-0.5 bg-neonGold z-10 shadow-[0_0_14px_#ffb703] transition-transform"></div><div id="rstrip" class="flex gap-1 p-2" style="width:max-content">${strip.map(s=>`<div class="w-20 h-24 shrink-0 rounded-xl flex flex-col items-center justify-center text-center text-[9px] bg-inkCard" style="border:2px solid ${RAR[s.r]};box-shadow:0 0 8px ${RAR[s.r]}66"><span class="text-3xl">${s.ic}</span><span class="px-1 leading-tight">${lab(s)}</span></div>`).join("")}</div></div>`;
 const st=$("rstrip"),mk=$("rmark"),bw=$("rbox").clientWidth,target=X*84+8+40-bw/2+(R()-.5)*40;st.style.transition="none";st.style.transform="translateX(0)";st.offsetHeight;st.style.transition="transform 5.2s cubic-bezier(.1,.75,.12,1)";st.style.transform=`translateX(-${target}px)`;
 await new Promise(res=>{let last=-1;const t0=performance.now(),lp=()=>{const m=new DOMMatrix(getComputedStyle(st).transform),idx=Math.floor((-m.m41+bw/2-8)/84);if(idx!=last){last=idx;sfx("tick",()=>tone(1300,.04,"square",.07));mk.style.transform="scaleY(1.3)";setTimeout(()=>mk.style.transform="",60)}if(performance.now()-t0<5400)requestAnimationFrame(lp);else res()};requestAnimationFrame(lp)});
 const m=apply(it);reveal(it,m)}

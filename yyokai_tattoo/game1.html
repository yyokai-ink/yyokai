html,body{touch-action:pan-y;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
input,button,select,textarea{font-size:16px}

@keyframes pulse-glow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes shakeC{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}
@keyframes spinR{to{transform:rotate(360deg)}}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-75vh) translateX(var(--dx));opacity:0}}
@keyframes drift{from{transform:translate3d(var(--x0),108vh,0) rotate(0)}to{transform:translate3d(var(--x1),-20vh,0) rotate(var(--rt))}}

.dia{position:absolute;width:8px;height:8px;background:#a8854a;transform:rotate(45deg);left:-3.5px}

<script type="module">
/* ══════════════════════════════════════════════════════════════════════════
   INKAI by YYOKAI v6.  Місця для змін позначено «🔧».
   Нове: 4 валюти, 60 катан зі своїми ефектами, 100 фонів, свитки-«бомби», 3 промахи/3 свитки = кінець,
   3 таймерні сундуки (срібний/золотий/діамантовий), ціни ×2, без зуму, оптимізація canvas.

   ПРАВИЛА FIRESTORE (замінити ADMIN_UID):
     rules_version='2'; service cloud.firestore { match /databases/{d}/documents {
       function admin(){ return request.auth.uid in ['ADMIN_UID']; }
       match /users/{u}   { allow read: if request.auth.uid==u || admin(); allow write: if request.auth.uid==u; }
       match /public/{u}  { allow read: if request.auth!=null; allow write: if request.auth.uid==u; }
       match /referrals/{u}{ allow read: if request.auth!=null; allow create: if request.auth.uid==u; }
       match /daylog/{x}  { allow create: if request.auth.uid==request.resource.data.uid && request.resource.data.ts==request.time; allow read: if admin(); }
       match /submissions/{s}{ allow read: if request.auth!=null && (resource.data.uid==request.auth.uid || admin());
                            allow create: if request.auth.uid==request.resource.data.uid && request.resource.data.status=='pending'; allow update: if admin(); }
       match /claims/{c}  { allow create: if request.auth!=null; allow read, update: if admin(); }
       match /adEvents/{a}{ allow create: if request.auth!=null; }
       match /offers/{o}  { allow read: if true; allow write: if admin(); }
     }}
   ВАЖЛИВО: монети/XP/таймери сундуків живуть у браузері гравця — їх можна підробити. Перед видачею тату перевіряй заявку в адмінці.
   ══════════════════════════════════════════════════════════════════════════ */

// ═══ 0. НАЛАШТУВАННЯ ═══
const firebaseConfig={apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT_ID.firebaseapp.com",projectId:"PASTE_PROJECT_ID",storageBucket:"PASTE_PROJECT_ID.appspot.com",messagingSenderId:"PASTE_SENDER_ID",appId:"PASTE_APP_ID"};
const CFG={
 hero:{name:"INKAI",quote:"Кожна лінія — це історія. Кожен ёкай — частина мене.|Every line tells a story. Every yokai is a part of me."}, // 🔧
 promo:{text:"Підпишись на Instagram YYOKAI|Follow YYOKAI on Instagram",url:"https://instagram.com/yyokai.tattoo"},          // 🔧
 adEvery:3,            // 🔧 обов'язкова реклама після кожного N-го раунду
 offerReward:1000,     // 🔧 нагорода монетами за партнерське завдання
 offlineBaseMin:120,
 adminHash:"__HASH__"
};
window.CFG=CFG;

// ═══ 1. FIREBASE ═══
let FB={},app,auth,db,FBOK=false,authReady;const authReadyP=new Promise(r=>authReady=r);
(async()=>{try{
 const B="https://www.gstatic.com/firebasejs/10.8.0/";
 const m=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
 FB=Object.assign({},...m);app=FB.initializeApp(firebaseConfig);auth=FB.getAuth(app);db=FB.getFirestore(app);
 FBOK=!firebaseConfig.apiKey.startsWith("PASTE");
 if(FBOK)initAuth();else authReady();
}catch(e){authReady()}})();

// ═══ 2. ДОПОМІЖНЕ ═══
const $=i=>document.getElementById(i),R=Math.random,today=()=>new Date().toISOString().slice(0,10),sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Компактні великі числа: 1.2M, 3.4B, 5.6T…
const fmt=n=>{n=Math.floor(n);if(n<1e6)return n.toLocaleString();let i=0;while(n>=1000&&i<5){n/=1000;i++}return(n<100?n.toFixed(1):Math.floor(n))+["","K","M","B","T","Q"][i]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lang=localStorage.ink_lang||"ua";const t=s=>{const a=String(s).split("|");return lang=="ua"?a[0]:a[1]||a[0]};
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function toast(m){const e=$("toast");e.textContent=m;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),4500)}
const inApp=/Instagram|FBAN|FBAV|Telegram|TikTok|Line\//i.test(navigator.userAgent);
// Забороняємо зум жестами (iOS ігнорує user-scalable=no)

}

  if(!u){user=null;authReady();return}
  user=u;let fresh=0;
  try{const r=await FB.getDoc(FB.doc(db,"users",u.uid));
   if(r.exists()){const{offers,ts,lastSeen,regAt,...x}=r.data();if((x.xp||0)>=S.xp){S={...S,...x,c:{...def.c,...x.c},up:{...x.up},ck:{...def.ck,...x.ck},bp:x.bp||{}};S.jd=S.jd||0;S.ln=S.ln??3}}else fresh=1}catch(e){}
  if(fresh){
   try{await FB.setDoc(FB.doc(db,"users",u.uid),{regAt:FB.serverTimestamp()},{merge:true})}catch(e){}
   if(refId&&refId!=u.uid){S.mon+=500;try{await FB.setDoc(FB.doc(db,"referrals",u.uid),{by:refId,ts:FB.serverTimestamp()})}catch(e){}}
  }
  await loadFriends();
  try{(await FB.getDocs(FB.query(FB.collection(db,"submissions"),FB.where("uid","==",u.uid)))).forEach(d=>{S.offers[d.data().offer]=d.data().status})}catch(e){}
  try{const o=[];(await FB.getDocs(FB.collection(db,"offers"))).forEach(d=>o.push({id:d.id,...d.data()}));if(o.length)OFFERS=o}catch(e){}
  save();if(S.nick){await push();logDay()}
  authReady();
  if(splashDone){if(!S.nick)showNick();else if(cur=="auth"||cur=="play")go("play");else rend()}
 });
}

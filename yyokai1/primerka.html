<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YYOKAI — Tattoo Visualizer</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:#050505;
  color:#f5f2ea;
  font-family:'Montserrat', Arial, sans-serif;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
img,video{display:block;max-width:100%}
button,input,textarea,select{font:inherit}

:root{
  --bg:#050505;
  --card:#141414;
  --text:#f5f2ea;
  --muted:#8d8d8d;
  --silver:#d6d2c8;
  --red:#ff2a2a;
}

.container{max-width:1240px;margin:auto}
section{padding:110px 26px}

h1{
  font-size:clamp(56px,13vw,176px);
  line-height:.82;
  letter-spacing:-.085em;
  font-weight:700;
  color:var(--text);
}

.label{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 18px;
  margin-bottom:26px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  color:var(--silver);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  backdrop-filter:blur(18px);
}

/* NAV */
.nav{
  position:fixed;
  top:0;left:0;width:100%;
  z-index:100;
  padding:18px 26px;
  background:rgba(5,5,5,.68);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(24px);
}
.nav-inner{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:18px;
}
.nav-logo{
  color:#fff;
  font-size:13px;
  letter-spacing:.48em;
  font-weight:700;
}
.nav-actions{display:flex;justify-content:flex-end}

.burger{
  width:38px;height:26px;
  background:none;border:0;
  cursor:pointer;
  position:relative;
  z-index: 101;
}
.burger span{
  position:absolute;
  left:0;
  width:38px;
  height:1px;
  background:#f3f3f3;
  transition:.35s ease;
}
.burger span:nth-child(1){top:3px}
.burger span:nth-child(2){top:13px}
.burger span:nth-child(3){top:23px}
.burger.active span:nth-child(1){top:13px;transform:rotate(45deg)}
.burger.active span:nth-child(2){opacity:0}
.burger.active span:nth-child(3){top:13px;transform:rotate(-45deg)}

.book-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  padding:10px 12px 10px 17px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  color:#f5f2ea;
  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;
  cursor:pointer;
  transition:.25s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.28);
  backdrop-filter:blur(16px);
}
.book-btn:hover{
  background:rgba(255,255,255,.14);
  transform:translateY(-1px);
}
.arrow{
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  color:#f2f2f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex:none;
}
.pulse-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 18px rgba(255,42,42,.55);
  animation:pulse 1.55s infinite ease-in-out;
  flex:none;
}
@keyframes pulse{
  0%{opacity:.25;transform:scale(.75);box-shadow:0 0 0 0 rgba(255,42,42,.45)}
  50%{opacity:1;transform:scale(1);box-shadow:0 0 16px 5px rgba(255,42,42,.32)}
  100%{opacity:.25;transform:scale(.75);box-shadow:0 0 0 0 rgba(255,42,42,0)}
}

.mobile-menu{
  position:fixed;inset:0;
  background:rgba(5,5,5,.96);
  z-index:90;display:none;
  align-items:center;justify-content:center;
  flex-direction:column;gap:24px;
  font-size:clamp(28px,7vw,70px);
  text-transform:uppercase;
  letter-spacing:-.06em;
  backdrop-filter:blur(18px);
}
.mobile-menu.open{display:flex}
.mobile-menu a{color:#f5f2ea}
.mobile-menu a:hover{color:var(--silver)}

/* HERO */
.hero{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:flex-end;
  padding:128px 26px 78px;
  overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:.54;filter:grayscale(1) contrast(1.1);
}
.hero:before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,#050505 0%,rgba(5,5,5,.96) 100%);
  z-index:1;
}
.hero-content{position:relative;z-index:2;width:100%}
.hero-logo{width:min(280px,58vw);margin:0 auto clamp(160px,26vh,280px);filter:brightness(0) invert(1);}

/* VISUALIZER APP CONTAINER */
.visualizer-section {
  background: linear-gradient(180deg, #050505, #0f0f0f, #050505);
  padding-top: 40px;
}
.visualizer-window {
  background: #f5f2ea;
  color: #050505;
  border-radius: 30px;
  padding: 30px;
  max-width: 460px;
  margin: 0 auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  position: relative;
}
.visualizer-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
}
.visualizer-header h3 {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
}
.visualizer-header p {
  font-size: 14px;
  color: #555;
  margin-top: 4px;
}
.close-app {
  font-size: 28px;
  background: none; border: 0; cursor: pointer; color: #050505;
}

/* CANVAS / WORKSPACE */
.canvas-container {
  width: 100%;
  height: 400px;
  background: linear-gradient(145deg, #eee, #f9f9f9);
  border-radius: 24px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  user-select: none;
}
.body-background {
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}
.tattoo-overlay {
  position: absolute;
  width: 130px;
  cursor: move;
  transform-origin: center center;
  mix-blend-mode: multiply;
  filter: blur(0px);
  opacity: 0.85;
}

/* TOUCH CONTROLS OVERLAY */
.controls-3d {
  position: absolute;
  top: 12px; right: 12px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 10;
}
.control-3d {
  width: 34px; height: 34px;
  border-radius: 50%; background: #050505; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; border: 0; cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* CONTROLS & SLIDERS */
.control-group {
  margin-bottom: 18px;
}
.control-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  color: #050505;
}
.slider-wrapper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #666;
}
.custom-range {
  flex: 1;
  margin: 0 10px;
  accent-color: #050505;
  cursor: pointer;
}

/* UPLOAD BUTTON */
.upload-box {
  margin-bottom: 22px;
}
.file-label {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px;
  background: #050505;
  color: #f5f2ea;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
}
.file-label input { display: none; }

/* HORIZONTAL BODY PARTS SELECTOR */
.body-parts-slider {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 26px;
}
.body-parts-slider::-webkit-scrollbar { height: 3px; }
.body-parts-slider::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

.part-card {
  flex: none;
  width: 72px;
  text-align: center;
  cursor: pointer;
}
.part-thumb {
  width: 72px;
  height: 85px;
  object-fit: cover;
  border-radius: 14px;
  border: 2px solid transparent;
  background: #ddd;
  margin-bottom: 4px;
}
.part-card.active .part-thumb {
  border-color: #050505;
}
.part-card span {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: #333;
}

/* SUBMIT */
.submit-layout-btn {
  width: 100%;
  background: #050505;
  color: #f5f2ea;
  padding: 18px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  border: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}

/* FOOTER (MATCHING LOGIC) */
footer{
  padding:54px 26px;
  border-top:1px solid rgba(255,255,255,.09);
  color:#555;text-align:center;
  letter-spacing:.18em;font-size:11px;
}

/* MODALS (EXACTLY MATCHING SHIFT SITE) */
.modal{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.76);
  display:none;align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(18px);
}
.modal.open{display:flex}
.modal-box{
  width:min(760px,100%);max-height:90vh;
  overflow:auto;border-radius:34px;padding:34px;position:relative;
  background:linear-gradient(145deg,#171717,#0d0d0d);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 34px 90px rgba(0,0,0,.38);
}
.modal-box h2{font-size:52px; margin-bottom:34px; letter-spacing:-.07em; font-weight:400;}
.close{
  position:absolute;top:18px;right:22px;
  background:none;border:0;color:#fff;
  font-size:36px;cursor:pointer;
}
.modal-form-input {
  width:100%;background:#070707;color:#fff;
  border:1px solid rgba(255,255,255,.14);
  border-radius:17px;padding:16px;margin-bottom:12px;outline:none;
}
.modal-form-input:focus{border-color:rgba(255,255,255,.34);}
textarea.modal-form-input{min-height:132px}
input[type=file]{border-style:dashed;color:#777}
.submit{width:100%;margin-top:8px}

@media(max-width:500px){
  .visualizer-window { padding: 20px; border-radius: 24px; }
  .canvas-container { height: 320px; }
  .modal-box h2{font-size:38px;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <button class="burger" id="burger"><span></span><span></span><span></span></button>
    <div class="nav-logo">YYOKAI</div>
    <div class="nav-actions">
      <button class="book-btn open-booking">
        <span class="pulse-dot"></span>
        Book an appointment
        <span class="arrow">→</span>
      </button>
    </div>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Home</a>
</div>

<header class="hero">
  <video class="hero-bg" autoplay muted loop playsinline>
    <source src="video1.mov" type="video/mp4">
  </video>
  <div class="hero-content container">
    <img class="hero-logo" src="logo1.png" alt="Logo">
    <div class="hero-title">
      <h1>PRIMERKA</h1>
    </div>
  </div>
</header>

<section class="visualizer-section">
  <div class="container">

    <div class="visualizer-window">
      <div class="visualizer-header">
        <div>
          <h3>Visualizer</h3>
          <p>Interactive Placement Viewer</p>
        </div>
        <button class="close-app" onclick="window.location.href='index.html'">&times;</button>
      </div>

      <div class="canvas-container" id="canvas">
        <div class="controls-3d">
            <button class="control-3d" onclick="changeScale(0.1)">+</button>
            <button class="control-3d" onclick="changeScale(-0.1)">-</button>
            <button class="control-3d" onclick="changeRotation(15)">↻</button>
            <button class="control-3d" onclick="changeRotation(-15)">↺</button>
        </div>
        <img src="https://images.unsplash.com/photo-1590402421685-6184a44738fc?auto=format&fit=crop&w=500&q=80" class="body-background" id="bodyBg" alt="Forearm">
        <img src="https://i.imgur.com/w9N8SgG.png" class="tattoo-overlay" id="tattoo" alt="Tattoo">
      </div>

      <div class="upload-box">
        <label class="file-label">
          <span>Upload your sketch</span>
          <input type="file" id="sketchLoader" accept="image/*">
        </label>
      </div>

      <div class="control-group">
        <label>Transparency</label>
        <div class="slider-wrapper">
          <span>10%</span>
          <input type="range" id="opacityRange" class="custom-range" min="10" max="100" value="85">
          <span>100%</span>
        </div>
      </div>

      <div class="control-group">
        <label>Blur</label>
        <div class="slider-wrapper">
          <span>0px</span>
          <input type="range" id="blurRange" class="custom-range" min="0" max="5" value="0" step="0.5">
          <span>5px</span>
        </div>
      </div>

      <div class="control-group">
        <label>Body Part</label>
        <div class="body-parts-slider">
          <div class="part-card active" data-img="https://images.unsplash.com/photo-1590402421685-6184a44738fc?auto=format&fit=crop&w=500&q=80">
            <img src="https://images.unsplash.com/photo-1590402421685-6184a44738fc?auto=format&fit=crop&w=120&q=80" class="part-thumb">
            <span>Forearm</span>
          </div>
          <div class="part-card" data-img="https://images.unsplash.com/photo-1542596768-5d1d21f1cf98?auto=format&fit=crop&w=500&q=80">
            <img src="https://images.unsplash.com/photo-1542596768-5d1d21f1cf98?auto=format&fit=crop&w=120&q=80" class="part-thumb">
            <span>Arm</span>
          </div>
          <div class="part-card" data-img="https://images.unsplash.com/photo-1500917293891-ef795e70e1f6?auto=format&fit=crop&w=500&q=80">
            <img src="https://images.unsplash.com/photo-1500917293891-ef795e70e1f6?auto=format&fit=crop&w=120&q=80" class="part-thumb">
            <span>Leg</span>
          </div>
          <div class="part-card" data-img="https://images.unsplash.com/photo-1605517389112-9214b7e9b897?auto=format&fit=crop&w=500&q=80">
            <img src="https://images.unsplash.com/photo-1605517389112-9214b7e9b897?auto=format&fit=crop&w=120&q=80" class="part-thumb">
            <span>Ribs</span>
          </div>
          <div class="part-card" data-img="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" class="part-thumb">
            <span>Back</span>
          </div>
        </div>
      </div>

      <button class="submit-layout-btn open-booking">
        Submit Layout &rarr;
      </button>
    </div>

  </div>
</section>

<footer>YYOKAI — TATTOO LETTERING TOOL</footer>

<div class="modal" id="bookingModal">
  <div class="modal-box">
    <button class="close" id="closeModal">×</button>
    <span class="label">Booking</span>
    <h2>Get a consultation</h2>

    <form id="bookingForm">
      <input name="name" placeholder="First name *" required class="modal-form-input">
      <input name="instagram" placeholder="Instagram" class="modal-form-input">
      <textarea name="idea" placeholder="Tattoo idea — style, elements, mood *" required class="modal-form-input"></textarea>
      <input name="placement" placeholder="Placement *" required class="modal-form-input">
      <input name="size" placeholder="Approximate size *" required class="modal-form-input">

      <select name="city" required class="modal-form-input">
        <option value="">Preferred city *</option>
        <option>Lviv, Ukraine</option>
        <option>Bucharest, Romania</option>
        <option>Other</option>
      </select>

      <input name="date" placeholder="Preferred date / month" class="modal-form-input">
      <input type="file" name="references" multiple accept="image/*">
      <input type="email" name="email" placeholder="Email *" required class="modal-form-input">
      <input name="phone" placeholder="WhatsApp / Phone *" required class="modal-form-input">

      <button class="book-btn submit" type="submit" style="width: 100%; margin-top: 8px; background: var(--red); color: white;">
        <span class="pulse-dot"></span>
        Submit project
        <span class="arrow">→</span>
      </button>
    </form>
  </div>
</div>

<script>
/* BURGER MENU */
const burger = document.getElementById("burger");
const mobileMenu = document.getElementById("mobileMenu");
burger.onclick = () => {
  burger.classList.toggle("active");
  mobileMenu.classList.toggle("open");
};

/* INTERACTIVE LOGIC */
const canvas = document.getElementById("canvas");
const tattoo = document.getElementById("tattoo");

let isDragging = false;
let currentX = 0, currentY = 0;
let initialX, initialY;
let xOffset = 0, yOffset = 0;
let scale = 1, rotation = 0;

canvas.addEventListener("mousedown", dragStart);
canvas.addEventListener("mousemove", drag);
canvas.addEventListener("mouseup", dragEnd);
canvas.addEventListener("touchstart", dragStart, {passive: false});
canvas.addEventListener("touchmove", drag, {passive: false});
canvas.addEventListener("touchend", dragEnd);

function dragStart(e) {
  if (e.target === tattoo) {
    isDragging = true;
    if (e.type === "touchstart") {
      initialX = e.touches[0].clientX - xOffset;
      initialY = e.touches[0].clientY - yOffset;
    } else {
      initialX = e.clientX - xOffset;
      initialY = e.clientY - yOffset;
    }
  }
}

function drag(e) {
  if (isDragging) {
    e.preventDefault();
    if (e.type === "touchmove") {
      currentX = e.touches[0].clientX - initialX;
      currentY = e.touches[0].clientY - initialY;
    } else {
      currentX = e.clientX - initialX;
      currentY = e.clientY - initialY;
    }
    xOffset = currentX;
    yOffset = currentY;
    applyTransforms();
  }
}
function dragEnd() { isDragging = false; }

// Scale & Rotation buttons (perfect for mobile screens)
function changeScale(amount) {
    scale += amount;
    scale = Math.min(Math.max(.2, scale), 3);
    applyTransforms();
}
function changeRotation(degree) {
    rotation += degree;
    applyTransforms();
}

// Mouse wheel handler
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (e.ctrlKey) {
    rotation += e.deltaY * 0.1;
  } else {
    scale += e.deltaY * -0.001;
    scale = Math.min(Math.max(.2, scale), 3);
  }
  applyTransforms();
}, {passive: false});

function applyTransforms() {
  tattoo.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scale}) rotate(${rotation}deg)`;
}

/* SKETCH UPLOADER */
const sketchLoader = document.getElementById("sketchLoader");
sketchLoader.onchange = function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      tattoo.src = event.target.result;
      xOffset = 0; yOffset = 0; scale = 1; rotation = 0;
      currentX = 0; currentY = 0;
      applyTransforms();
    };
    reader.readAsDataURL(file);
  }
};

/* TRANSPARENCY & BLUR */
const opacityRange = document.getElementById("opacityRange");
const blurRange = document.getElementById("blurRange");
function updateEffects() {
  tattoo.style.opacity = opacityRange.value / 100;
  tattoo.style.filter = `blur(${blurRange.value}px)`;
}
opacityRange.oninput = updateEffects;
blurRange.oninput = updateEffects;

/* BODY SELECTOR */
const partCards = document.querySelectorAll(".part-card");
const bodyBg = document.getElementById("bodyBg");
partCards.forEach(card => {
  card.onclick = () => {
    partCards.forEach(c => c.classList.remove("active"));
    card.classList.add("active");
    bodyBg.src = card.getAttribute("data-img");
  };
});

/* BOOKING MODAL & TELEGRAM TELEMETRY (EXACTLY AS MAIN SITE) */
const modal = document.getElementById("bookingModal");
document.querySelectorAll(".open-booking").forEach(btn => {
  btn.onclick = e => {
    e.preventDefault();
    modal.classList.add("open");
    burger.classList.remove("active");
    mobileMenu.classList.remove("open");
  };
});
document.getElementById("closeModal").onclick = () => modal.classList.remove("open");
modal.onclick = e => { if(e.target === modal) modal.classList.remove("open") };

document.getElementById("bookingForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(this).entries());
  
  const BOT_TOKEN = "PASTE_BOT_TOKEN_HERE";
  const CHAT_ID = "PASTE_CHAT_ID_HERE";

  const message = `
NEW YYOKAI BOOKING (FROM PRIMERKA)
Name: ${data.name}
Instagram: ${data.instagram}
Idea: ${data.idea}
Placement: ${data.placement}
Size: ${data.size}
City: ${data.city}
Date: ${data.date}
Email: ${data.email}
Phone: ${data.phone}
`;

  if(BOT_TOKEN !== "PASTE_BOT_TOKEN_HERE"){
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: message })
    });
  }

  alert("Your request has been sent.");
  modal.classList.remove("open");
  this.reset();
});
</script>

</body>
</html>

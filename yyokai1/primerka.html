<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YYOKAI — Tattoo Lettering Tool & Primerka</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<link id="dynamic-fonts" rel="stylesheet">

<style>
/* CSS RESET */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:#050505;
  color:#f5f2ea;
  font-family:'Montserrat', Arial, sans-serif;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
img,video{display:block;max-width:100%}
button,input,textarea,select{font:inherit; background: none; border: none; cursor: pointer; color: inherit;}

/* CSS VARIABLES */
:root{
  --bg:#050505;
  --card:#141414;
  --card2:#1b1b1b;
  --text:#f5f2ea;
  --muted:#8d8d8d;
  --muted2:#b8b8b8;
  --silver:#d6d2c8;
  --line:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.08);
  --glass2:rgba(255,255,255,.14);
  --red:#ff2a2a;
}

/* CONTAINER */
.container{max-width:1240px;margin:auto}
section{padding:110px 26px}

/* TYPOGRAPHY */
h1{
  font-size:clamp(56px,13vw,176px);
  line-height:.82;
  letter-spacing:-.085em;
  font-weight:700;
  color:var(--text);
}
h2{
  font-size:clamp(42px,8vw,104px);
  line-height:.88;
  letter-spacing:-.07em;
  font-weight:400;
  color:var(--text);
  margin-bottom:34px;
}
p{
  color:var(--muted);
  font-size:17px;
  line-height:1.58;
}

.label{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 18px;
  margin-bottom:26px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);
  color:var(--silver);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  backdrop-filter:blur(18px);
}

/* NAV */
.nav{
  position:fixed;
  top:0;left:0;width:100%;
  z-index:100;
  padding:18px 26px;
  background:rgba(5,5,5,.68);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(24px);
}
.nav-inner{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:18px;
}
.nav-logo{
  color:#fff;
  font-size:13px;
  letter-spacing:.48em;
  font-weight:700;
}
.nav-actions{display:flex;justify-content:flex-end}

.burger{
  width:38px;height:26px;
  position:relative;
  z-index: 101;
}
.burger span{
  position:absolute;
  left:0;
  width:38px;
  height:1px;
  background:#f3f3f3;
  transition:.35s ease;
}
.burger span:nth-child(1){top:3px}
.burger span:nth-child(2){top:13px}
.burger span:nth-child(3){top:23px}
.burger.active span:nth-child(1){top:13px;transform:rotate(45deg)}
.burger.active span:nth-child(2){opacity:0}
.burger.active span:nth-child(3){top:13px;transform:rotate(-45deg)}

.book-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  padding:10px 12px 10px 17px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  color:#f5f2ea;
  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.28);
  backdrop-filter:blur(16px);
  transition:.25s ease;
}
.book-btn:hover{
  background:rgba(255,255,255,.14);
  transform:translateY(-1px);
}
.arrow{
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  color:#f2f2f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex:none;
}
.pulse-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 18px rgba(255,42,42,.55);
  animation:pulse 1.55s infinite ease-in-out;
  flex:none;
}
@keyframes pulse{
  0%{opacity:.25;transform:scale(.75);box-shadow:0 0 0 0 rgba(255,42,42,.45)}
  50%{opacity:1;transform:scale(1);box-shadow:0 0 16px 5px rgba(255,42,42,.32)}
  100%{opacity:.25;transform:scale(.75);box-shadow:0 0 0 0 rgba(255,42,42,0)}
}

.mobile-menu{
  position:fixed;
  inset:0;
  background:rgba(5,5,5,.96);
  z-index:90;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:24px;
  font-size:clamp(28px,7vw,70px);
  letter-spacing:-.06em;
  text-transform:uppercase;
  backdrop-filter:blur(18px);
}
.mobile-menu.open{display:flex}
.mobile-menu a{color:#f5f2ea}
.mobile-menu a:hover{color:var(--silver)}

/* HERO WITH VIDEO */
.hero{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:flex-end;
  padding:128px 26px 78px;
  overflow:hidden;
}
.hero-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.54;
  filter:grayscale(1) contrast(1.1);
}
.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top,#050505 0%,rgba(5,5,5,.96) 10%,rgba(5,5,5,.62) 36%,rgba(5,5,5,.26) 66%,rgba(5,5,5,.76) 100%),
    radial-gradient(circle at 50% 104%,rgba(255,255,255,.16),transparent 34%);
  z-index:1;
}
.hero-content{
  position:relative;
  z-index:2;
  width:100%;
}
.hero-logo{
  width:min(280px,58vw);
  margin:0 auto clamp(160px,26vh,280px);
  filter:brightness(0) invert(1) drop-shadow(0 24px 70px rgba(255,255,255,.14));
  opacity:.96;
}
.hero-title{
  display:grid;
  gap:22px;
}
.hero-title p{
  max-width:820px;
  color:#b7b7b7;
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:13px;
}

/* SECTION HEAD */
.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:24px;
  margin-bottom:28px;
}
.section-head p{max-width:420px}

/* PRIMERKA SECTION */
.primerka-section {
  background: linear-gradient(180deg, #050505, #0f0f0f, #050505);
  position: relative;
}
.visualizer-card {
  background: #f5f2ea;
  color: #050505;
  border-radius: 30px;
  padding: 34px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  position: relative;
  transition: all 0.3s ease;
  width: min(760px, 100%);
  margin: 0 auto;
}
.visualizer-card h3 { font-weight: 700; color: #050505; font-size: 28px; margin-bottom: 24px;}
.visualizer-card h4 { font-weight: 700; color: #050505; font-size: 18px; margin-bottom: 16px;}
.close-primerka{
  position:absolute;top:18px;right:22px;
  color:#050505; font-size:36px;
}

/* 3D Viewer styles */
.viewer-3d-wrapper {
  position: relative;
  background: linear-gradient(145deg, #eee, #f9f9f9);
  border-radius: 20px;
  height: 480px;
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.arm-visual {
  height: 90%;
  object-fit: contain;
}
.tattoo-visual {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 120px;
  opacity: 0.7;
}
.controls-3d {
  position: absolute;
  top: 10px; right: 10px;
  display: flex; flex-direction: column; gap: 8px;
}
.control-3d {
  width: 32px; height: 32px;
  border-radius: 50%; background: #050505; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

/* Range Sliders */
.setting-item { margin-bottom: 20px; }
.range-container { display: flex; align-items: center; gap: 14px; }
.range-slider { flex-grow: 1; accent-color: #050505; }
.range-labels { display: flex; justify-content: space-between; font-size: 12px; color: #777; width: 100%;}

/* Body Part Selector */
.body-selector {
  display: flex; gap: 14px;
  overflow-x: auto; padding-bottom: 10px;
}
.body-item {
  flex: none; width: 80px; text-align: center;
  cursor: pointer; opacity: 0.6;
}
.body-item.active { opacity: 1; font-weight: 700; }
.body-thumb {
  width: 80px; height: 100px;
  object-fit: cover; border-radius: 12px;
  border: 2px solid transparent; margin-bottom: 6px;
}
.body-item.active .body-thumb { border-color: #050505; }
.body-item small { display: block; font-size: 10px; color: #050505; }

/* Modal form style from image_0.png & image_1.png logic */
.booking-actions { margin-top: 30px; text-align: center; }
.book-btn.red {
  background: var(--red);
  color: #fff;
  width: 100%;
}
.form-input {
  width: 100%;
  background: #fcfcfc;
  border: 1px solid #ddd;
  color: #050505;
  border-radius: 17px;
  padding: 16px;
  margin-bottom: 12px;
  outline: none;
}
.form-input:focus { border-color: #aaa; }
textarea.form-input { min-height: 132px; }

/* MODALS */
.modal{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.76);
  display:none;align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(18px);
}
.modal.open{display:flex}
.modal-box{
  width:min(760px,100%);max-height:90vh;
  overflow:auto;border-radius:34px;padding:34px;position:relative;
  background:linear-gradient(145deg,#171717,#0d0d0d);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 34px 90px rgba(0,0,0,.38);
}
.modal-box h2{font-size:52px}
.close{
  position:absolute;top:18px;right:22px;
  background:none;border:0;color:#fff;
  font-size:36px;cursor:pointer;
}
.modal-form-input{
  width:100%;background:#070707;color:#fff;
  border:1px solid rgba(255,255,255,.14);
  border-radius:17px;padding:16px;margin-bottom:12px;outline:none;
}
.modal-form-input:focus{border-color:rgba(255,255,255,.34);}
textarea.modal-form-input{min-height:132px}
input[type=file]{border-style:dashed;color:#777}
.submit{width:100%;margin-top:8px}

/* RESPONSIVE MEDIA QUERIES */
@media(max-width:850px){
  section{padding:78px 26px;}
  .section-head{display:block;margin-bottom:24px;}
  .section-head h2{font-size:clamp(48px,15vw,68px);line-height:.9;margin-bottom:18px;}
  .section-head p{max-width:100%;font-size:16px;line-height:1.45;color:#8f8f8f;}

  .nav-logo{display:none;}
  .nav-inner{grid-template-columns:1fr auto;}
  .hero-logo{width:220px;}
  
  .viewer-3d-wrapper { height: 360px; }
  .visualizer-card { padding: 24px; }
  .book-btn.red { width: 100%; }
}
</style>
</head>

<body>

<nav class="nav">
  <div class="nav-inner">
    <button class="burger" id="burger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-logo">YYOKAI</div>
    <div class="nav-actions">
      <button class="book-btn open-booking">
        <span class="pulse-dot"></span>
        Get a consultation
        <span class="arrow">→</span>
      </button>
    </div>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Home</a>
  <a href="#primerka">Primerka</a>
</div>

<header class="hero" id="home">
  <video class="hero-bg" autoplay muted loop playsinline>
    <source src="video1.mov" type="video/mp4">
  </video>
  <div class="hero-content container">
    <img class="hero-logo" src="logo1.png" alt="YYOKAI logo">
    <div class="hero-title">
      <h1>YYOKAI</h1>
      <p>Japanese tattoo aesthetic / Integrated Visualizer for custom placement design.</p>
    </div>
  </div>
</header>

<main>

<section id="primerka" class="primerka-section">
  <div class="container">
    
    <div class="visualizer-card">
        <button class="close close-primerka">×</button>
        <h3>Visualizer</h3>
        <h4>Interactive 3D Placement Viewer</h4>

        <div class="viewer-3d-wrapper">
            <img src="https://image.shutterstock.com/image-photo/closedup-man-body-part-naked-260nw-1934336153.jpg" alt="Body Part" class="arm-visual">
            <img src="https://static.thenounproject.com/png/4437817-200.png" alt="Tattoo Design" class="tattoo-visual" id="tattooDesign">
            
            <div class="controls-3d">
                <button class="control-3d">-</button>
                <button class="control-3d">+</button>
                <button class="control-3d">↻</button>
                <button class="control-3d">↺</button>
            </div>
        </div>

        <div class="primerka-settings">
            <div class="setting-item">
                <label>Transparency</label>
                <div class="range-container">
                    <input type="range" class="range-slider" id="opacitySlider" min="10" max="90" value="70" step="1" oninput="updateTattooEffect()">
                </div>
                <div class="range-labels"><span>10%</span><span>90%</span></div>
            </div>

            <div class="setting-item">
                <label>Blur</label>
                <div class="range-container">
                    <input type="range" class="range-slider" id="blurSlider" min="1" max="8" value="3" step="0.5" oninput="updateTattooEffect()">
                </div>
                <div class="range-labels"><span>1px</span><span>8px</span></div>
            </div>
        </div>

        <div class="setting-item">
            <label>Body Part</label>
            <div class="body-selector">
                <div class="body-item active">
                    <img src="https://image.shutterstock.com/image-photo/closedup-man-body-part-naked-260nw-1934336153.jpg" alt="Forearm" class="body-thumb">
                    <small>Forearm</small>
                </div>
                <div class="body-item">
                    <img src="https://image.shutterstock.com/image-photo/closedup-man-naked-torso-shoulder-260nw-1934336162.jpg" alt="Upper Arm" class="body-thumb">
                    <small>Upper Arm</small>
                </div>
                <div class="body-item">
                    <img src="https://image.shutterstock.com/image-photo/closedup-man-body-part-naked-260nw-1934336141.jpg" alt="Thigh" class="body-thumb">
                    <small>Thigh</small>
                </div>
                <div class="body-item">
                    <img src="https://image.shutterstock.com/image-photo/closedup-man-naked-back-shoulder-260nw-1934336177.jpg" alt="Ribs" class="body-thumb">
                    <small>Ribs</small>
                </div>
                 <div class="body-item">
                    <img src="https://image.shutterstock.com/image-photo/closedup-man-body-part-naked-260nw-1934336156.jpg" alt="Back" class="body-thumb">
                    <small>Back</small>
                </div>
            </div>
        </div>

        <div class="booking-actions">
            <button class="book-btn red submit-primerka">
                <span class="pulse-dot"></span>
                Submit Final Layout
                <span class="arrow">→</span>
            </button>
        </div>

    </div>

  </div>
</section>

</main>

<footer>YYOKAI — TATTOO GENERATOR & VISUALIZER</footer>

<div class="modal" id="bookingModal">
  <div class="modal-box">
    <button class="close" id="closeModal">×</button>
    <span class="label">Booking</span>
    <h2>Get a consultation</h2>

    <form id="bookingForm">
      <input name="name" placeholder="First name *" required class="modal-form-input">
      <input name="instagram" placeholder="Instagram" class="modal-form-input">
      <textarea name="idea" placeholder="Tattoo idea — style, elements, mood *" required class="modal-form-input"></textarea>
      <input name="placement" placeholder="Placement *" required class="modal-form-input">
      <input name="size" placeholder="Approximate size *" required class="modal-form-input">

      <select name="city" required class="modal-form-input">
        <option value="">Preferred city *</option>
        <option>Lviv, Ukraine</option>
        <option>Bucharest, Romania</option>
        <option>Other</option>
      </select>

      <input name="date" placeholder="Preferred date / month" class="modal-form-input">
      <input type="file" name="references" multiple accept="image/*">
      <input type="email" name="email" placeholder="Email *" required class="modal-form-input">
      <input name="phone" placeholder="WhatsApp / Phone *" required class="modal-form-input">

      <button class="book-btn submit red" type="submit">
        <span class="pulse-dot"></span>
        Submit project
        <span class="arrow">→</span>
      </button>
    </form>
  </div>
</div>

<script>
// Burger menu logic
const burger = document.getElementById("burger");
const mobileMenu = document.getElementById("mobileMenu");

burger.onclick = () => {
  burger.classList.toggle("active");
  mobileMenu.classList.toggle("open");
};

document.querySelectorAll(".mobile-menu a").forEach(link => {
  link.onclick = () => {
    burger.classList.remove("active");
    mobileMenu.classList.remove("open");
  };
});

// Booking Modal logic
const modal = document.getElementById("bookingModal");
const closeBtn = document.getElementById("closeModal");

document.querySelectorAll(".open-booking").forEach(btn => {
  btn.onclick = e => {
    e.preventDefault();
    modal.classList.add("open");
    burger.classList.remove("active");
    mobileMenu.classList.remove("open");
  };
});

closeBtn.onclick = () => modal.classList.remove("open");
modal.onclick = e => { if(e.target === modal) modal.classList.remove("open") };

// Primerka interactive effects
const tattooDesign = document.getElementById('tattooDesign');
const opacitySlider = document.getElementById('opacitySlider');
const blurSlider = document.getElementById('blurSlider');

function updateTattooEffect() {
  const opacityVal = opacitySlider.value / 100;
  const blurVal = blurSlider.value + 'px';
  tattooDesign.style.opacity = opacityVal;
  tattooDesign.style.filter = `blur(${blurVal})`;
}

// Body Part Selector logic
const bodySelector = document.querySelector('.body-selector');
const bodyVisual = document.querySelector('.arm-visual');

bodySelector.addEventListener('click', e => {
  const bodyItem = e.target.closest('.body-item');
  if (!bodyItem) return;

  document.querySelectorAll('.body-item').forEach(item => item.classList.remove('active'));
  bodyItem.classList.add('active');

  const newImgSrc = bodyItem.querySelector('img').src;
  bodyVisual.src = newImgSrc;
});

// Final submit logic
const finalSubmitBtn = document.querySelector('.submit-primerka');
finalSubmitBtn.onclick = () => {
  alert('Final layout ready for consultation. Opening booking form.');
  modal.classList.add("open");
};

document.getElementById("bookingForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(this).entries());
  const message = `
NEW YYOKAI BOOKING (FROM PRIMERKA)
Name: ${data.name}
Instagram: ${data.instagram}
Idea: ${data.idea}
Placement: ${data.placement}
Size: ${data.size}
City: ${data.city}
Date: ${data.date}
Email: ${data.email}
Phone: ${data.phone}
`;
  alert("Your request has been sent.");
  modal.classList.remove("open");
  this.reset();
});

</script>

</body>
</html>
